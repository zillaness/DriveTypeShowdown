<!DOCTYPE html>
<!--
  file: ai/drive_showdown_solo_lab.html
  version: 1.0.0
  author: Sam Cao (AI Lab addon)
  created: 2026-07-17
  description: Bundles a genuinely PLAYABLE single-player time trial (push all 8 balls through
    the gap, fastest wins) with the neuroevolution AI LAB from drive_showdown_ai_speedrun.html,
    behind a single 🎮 PLAY / 🤖 LAB mode toggle. Both modes share one physics engine and one
    "ghost" pool: finish a human run and it's instantly racing inside the Lab; train a champion
    in the Lab and one click races it live against you in Play — no file export/import required,
    though that's still available for sharing with the real game or other people. Includes a
    📖 Learn panel of concrete, numbers-backed lessons about ML discovered while building this.
    No build, no libraries, offline.
  ai_update: Patch with targeted edits only. Bump version + changelog at bottom. JS syntax check after edits.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070e">
<title>DriveShowdown · Solo + AI Lab</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#07070e;--panel:#0e0e1c;--line:#1d1d33;--mint:#44ffaa;--blue:#5aa8ff;--amber:#ffce4d;--red:#ff5c6a;--dim:#7a7a98;--ball:#ffd740;--gold:#ffce4d;}
  html,body{height:100%;background:var(--bg);color:#e8e8ff;font-family:'Courier New',monospace;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100dvh;}
  #bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;background:linear-gradient(180deg,#101024,#0a0a16);
       border-bottom:1px solid var(--line);user-select:none;}
  #bar .brand{font-weight:bold;letter-spacing:1px;color:var(--mint);text-shadow:0 0 10px rgba(68,255,170,.4);margin-right:4px;white-space:nowrap;}
  #bar .brand b{color:#fff;}
  button{font-family:inherit;font-size:12px;color:#dfe;background:#161630;border:1px solid #2a2a4a;border-radius:6px;
          padding:6px 10px;cursor:pointer;transition:.12s;white-space:nowrap;}
  button:hover{background:#20204a;border-color:var(--mint);color:#fff;}
  button.on{background:var(--mint);color:#04120c;border-color:var(--mint);font-weight:bold;}
  button.gold{border-color:#4a3a1a;}
  button.gold.on{background:var(--gold);color:#1a1204;border-color:var(--gold);}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  .ctl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);}
  .ctl input[type=range]{width:82px;accent-color:var(--mint);}
  select{font-family:inherit;font-size:12px;color:#dfe;background:#161630;border:1px solid #2a2a4a;border-radius:6px;padding:5px 6px;cursor:pointer;}
  select:hover{border-color:var(--mint);}
  /* settings model: amber = applies at next run; mint = live-tweakable any time */
  .runset{border-left:3px solid var(--amber)!important;}
  .liveset{border-left:3px solid var(--mint)!important;}
  select.runset,.ctl.runset input{outline:none;}
  #pendingBadge{display:none;font-size:10px;color:#1a1204;background:var(--amber);border-radius:4px;padding:2px 7px;font-weight:bold;white-space:nowrap;}
  #pendingBadge.show{display:inline-block;}
  #gpBadge{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap;}
  #gpBadge.on{color:#04120c;background:var(--mint);border-color:var(--mint);font-weight:bold;}
  #tut{position:absolute;left:0;right:0;bottom:0;z-index:45;display:none;padding:14px 18px;background:linear-gradient(0deg,#0d0d1ef8,#0d0d1ee0);border-top:2px solid var(--mint);}
  #tut.show{display:block;}
  #tut .step{font-size:10px;color:var(--dim);letter-spacing:1px;}
  #tut h3{font-size:14px;color:var(--mint);margin:2px 0 4px;}
  #tut p{font-size:12.5px;line-height:1.5;color:#d8d8f0;max-width:900px;}
  #tut .btns{margin-top:8px;display:flex;gap:8px;}
  #chal{position:absolute;right:0;top:0;bottom:0;z-index:44;display:none;width:330px;overflow:auto;background:#0c0c1af5;border-left:1px solid var(--line);padding:14px;}
  #chal.show{display:block;}
  #chal h3{color:var(--gold);font-size:14px;margin-bottom:8px;}
  #chal .c{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  #chal .c.done{border-color:var(--mint);background:rgba(68,255,170,.06);}
  #chal .c b{font-size:12px;color:#fff;} #chal .c.done b{color:var(--mint);}
  #chal .c p{font-size:11px;color:var(--dim);line-height:1.4;margin-top:2px;}
  #konami{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.92);}
  #konami.show{display:flex;}
  #konami .card{max-width:560px;background:#0d0d1c;border:2px solid var(--mint);border-radius:14px;padding:30px 34px;text-align:center;box-shadow:0 0 60px rgba(68,255,170,.25);}
  #konami h1{color:var(--mint);font-size:20px;margin-bottom:14px;letter-spacing:1px;}
  #konami p{color:#d8d8f0;font-size:13px;line-height:1.65;margin:8px 0;}
  #konami a{color:var(--blue);}
  #scrubWrap{display:none;align-items:center;gap:6px;}
  #scrubWrap.show{display:flex;}
  #scrub{width:200px;accent-color:var(--gold);}
  #canwrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;}
  #hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim);pointer-events:none;text-shadow:0 1px 3px #000;max-width:60%;}
  #tooltip{position:fixed;z-index:50;max-width:270px;background:#141428;border:1px solid var(--mint);color:#dfe;
    font-size:11px;line-height:1.4;padding:7px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .1s;
    box-shadow:0 6px 22px rgba(0,0,0,.55);}
  #tooltip b{color:var(--mint);}
  #help,#learn{position:absolute;inset:0;z-index:40;display:none;overflow:auto;padding:22px;background:rgba(6,6,14,.93);}
  #help.show,#learn.show{display:block;}
  #help .card,#learn .card{max-width:880px;margin:0 auto;background:#0d0d1c;border:1px solid var(--line);border-radius:12px;padding:20px 26px 28px;}
  #help h1,#learn h1{font-size:18px;color:var(--mint);margin-bottom:2px;letter-spacing:.5px;}
  #help .sub,#learn .sub{color:var(--dim);font-size:11px;margin-bottom:6px;}
  #help h2,#learn h2{font-size:12px;color:var(--amber);margin:18px 0 7px;border-bottom:1px solid var(--line);padding-bottom:4px;letter-spacing:.5px;}
  #help p,#learn p{font-size:12.5px;line-height:1.55;color:#c8c8e0;margin:6px 0;}
  #help ul,#learn ul{list-style:none;} #help li,#learn li{font-size:12.5px;line-height:1.5;color:#c8c8e0;margin:6px 0;}
  #help .k,#learn .k{color:var(--mint);font-weight:bold;} #help .g,#learn .g{color:var(--gold);font-weight:bold;}
  #help kbd,#learn kbd{background:#20204a;border:1px solid #33335a;border-radius:4px;padding:1px 6px;color:#fff;font-size:11px;}
  #help .cols,#learn .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
  #help .close,#learn .close{position:sticky;top:0;float:right;z-index:2;}
</style>
</head>

<div id="app">
  <div id="bar">
    <span class="brand">DRIVE<b>SHOWDOWN</b> · SOLO + AI LAB</span>
    <span class="sep"></span>
    <button id="btnModePlay" class="on" data-tip="<b>Play mode</b> — drive the real single-player time trial yourself with keyboard or gamepad. Shortcut: <b>M</b> toggles modes.">🎮 PLAY</button>
    <button id="btnModeLab" data-tip="<b>Lab mode</b> — the neuroevolution trainer: watch a population of neural-net drivers evolve to beat the same course. Shortcut: <b>M</b>.">🤖 LAB</button>

    <button id="btnLearn" data-tip="<b>Learn</b> — six concrete, numbers-backed lessons about machine learning discovered while building this. Shortcut: <b>L</b>.">📖 Learn</button>

    </select>

      <option value="1.5">⚙ 1.5× sens</option>

    </span>
    <span id="barLab" style="display:none">
      <button id="btnPlay" class="on liveset" data-tip="<b>Play / Pause</b> the simulation (mint = safe to touch any time). Shortcut: <b>Space</b>.">⏸ Pause</button>
      <div class="ctl liveset" data-tip="<b>Simulation speed</b> (mint = live). Left end is SLOW MOTION (0.25×) — perfect for studying telemetry in Replay; right end is MAX fast-forward for training. Never changes results, only how fast you watch them.">

      </span>

      <button id="btnReset" data-tip="<b>New Run</b> — start a fresh evolution with the current (amber) settings. This is the ONLY thing that applies pending setting changes.">↺ New Run</button>
      <button id="btnReplay" class="gold" data-tip="<b>Replay Best</b> — deterministically re-run the champion. Combine with the 🐢 slow end of the speed slider and the ⏱ scrubber to study its telemetry. Shortcut: <b>R</b> (Lab mode).">🏁 Replay Best</button>
      <span class="sep"></span>
      <select id="selInput" class="runset" data-tip="<b>AI input model</b> (amber = applies at next run). Analog (continuous) is the theoretical fastest; Keyboard (digital on/off) is usually a bit slower.">

      <button id="btnTelem" class="on liveset" data-tip="<b>Telemetry ON/OFF</b> (mint = live) — records/shows control inputs. Pure observation; doesn't change how fast the AI can go.">📈 Telemetry</button>
      <span class="sep"></span>
      <button id="btnSaveRun" data-tip="<b>Save Run</b> — snapshot the current champion into a list you can compare later.">💾 Save Run</button>
      <button id="btnCompare" data-tip="<b>Compare Runs</b> — overlay every saved run + ghost and rank by time and training compute. Shortcut: <b>C</b>.">⚖ Compare</button>
      <button id="btnData" data-tip="<b>Export Data</b> — CSV of every saved run's settings + 30Hz telemetry. Shortcut: <b>D</b>.">📊 Export Data</button>
      <button id="btnGhost" data-tip="<b>Export Ghost</b> — download the AI's ideal path in the real game's ghost format.">👻 Ghost → game</button>
      <button id="btnImport" data-tip="<b>Import Human Ghost</b> — load a ghost exported from the real game; overlays with real-time playback and joins Compare.">📥 Import Human</button>
      <span class="sep"></span>
      <div class="ctl runset" data-tip="<b>Population size</b> (amber = applies at next run) — drivers per generation."><span>POP</span> <input id="pop" type="range" min="20" max="120" step="10" value="60"><span id="popV">60</span></div>
      <div class="ctl liveset" data-tip="<b>Mutation rate</b> (mint = live — evolution uses it from the next generation on) — exploration vs fine-tuning."><span>MUT</span> <input id="mut" type="range" min="1" max="60" step="1" value="18"><span id="mutV">0.18</span></div>
      <div class="ctl liveset" data-tip="<b>Live path</b> of the current best robot."><label>PATH <input id="pathToggle" type="checkbox" checked style="accent-color:var(--mint)"></label></div>
      <div class="ctl liveset" data-tip="<b>Optimal path</b> — the champion's ideal line, coloured by speed."><label>OPTIMAL <input id="optToggle" type="checkbox" checked style="accent-color:var(--gold)"></label></div>
      <div class="ctl liveset" data-tip="<b>Ghosts</b> — show/hide imported &amp; human runs overlay."><label>GHOSTS <input id="humanToggle" type="checkbox" checked style="accent-color:#fff"></label></div>
    </span>
    <button id="btnHelp" data-tip="Open the full controls reference. Shortcut: <b>?</b>">❔ Help</button>
  </div>
  <div id="canwrap">
    <canvas id="view"></canvas>
    <div id="hint">Push all 8 balls through the top gap, as fast as you can. Hover any control for what it does, or hit <b>❔ Help</b> / <b>📖 Learn</b>.</div>
    <div id="help"></div>
    <div id="learn"></div>
    <div id="tut"></div>
    <div id="chal"></div>
    <div id="konami"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   DriveShowdown Solo + AI Lab — a playable single-player time trial bundled
   with the neuroevolution trainer. Physics + geometry + scoring ported
   verbatim (behaviourally) from drive_showdown_v5.1.98.html legacy layout.
   ==========================================================================*/
const CV=document.getElementById('view'), G=CV.getContext('2d');
let W=0,H=0,DPR=1;

/* ---------- real-game constants (legacy 400x720 single-player) ---------- */
const FW=380, FH=628;
const WALL_Y=118, WALL_H=10, GAP_L=125, GAP_R=255;
const RR=17, BR=9;
const SPD=180, TSP=2.85;
const SCORE_Y=WALL_Y-BR-6;
const GAP_CX=(GAP_L+GAP_R)/2, GOAL_Y=WALL_Y-15;
const BALL_STARTS=[
  {x:55,y:175},{x:165,y:158},{x:290,y:172},
  {x:352,y:238},{x:195,y:268},{x:65,y:318},
  {x:250,y:400},{x:48,y:455}
];
const ROBOT_START={x:FW/2,y:FH-58,h:-Math.PI/2};
const PLOW_SEGS=[
  [RR+2,-(RR+5), RR+14,-(RR+13)], [RR+14,-(RR+13), RR+26,-(RR+20)],
  [RR+2, RR+5,   RR+14, RR+13],   [RR+14, RR+13,   RR+26, RR+20]
];
const TIMEOUT=56;                    // AI attempt cap; humans never auto-fail on time (see stepWorld)
const DT=1/60;

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=t=>t.toFixed(2)+'s';
let RNG=Math.random;
function gauss(){let u=0,v=0;while(u===0)u=RNG();while(v===0)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---- settings shared across modes ---- */
// Two kinds of settings, visually distinguished in the toolbar:
//   RUN settings (amber left border): drive, sensitivity, AI input model, POP.
//     Changing one NEVER interrupts the current run — it goes into `pending` and applies
//     the next time a run starts (▶ Start Run in Play, ↺ New Run in Lab).
//   LIVE settings (mint left border): speed, pause, telemetry, path/ghost toggles, MUT.
//     Safe to touch mid-run; they observe or pace, they don't define the experiment.
const DEADZONE=0.28;
let mode='play';                     // 'play' (you drive) | 'lab' (AI trains)
let inputMode='joystick';
let sensitivity=1;
let telemOn=true;
const pending={drive:null,sens:null,inputMode:null,pop:null};   // null = no change queued
function pendingCount(){return Object.values(pending).filter(v=>v!=null).length;}
function updatePendingBadge(){document.getElementById('pendingBadge').classList.toggle('show',pendingCount()>0);}
function applyPending(){
  if(pending.drive!=null){setDrive(pending.drive);pending.drive=null;}
  if(pending.sens!=null){sensitivity=pending.sens;pending.sens=null;}
  if(pending.inputMode!=null){inputMode=pending.inputMode;pending.inputMode=null;}
  if(pending.pop!=null){evo.pop=pending.pop;pending.pop=null;}
  updatePendingBadge();
}
let showOptimal=true;
let showCompare=false;
let savedRuns=[];
const CMP_PAL=['#ff5c6a','#5aa8ff','#ffce4d','#b98cff','#4dd2ff','#ff9f4d','#8affc0','#ff7ae0','#ff6a9f','#9fff6a'];
let humanGhosts=[];                  // shared ghost pool: imports, your PBs, AI champions — races live in Play, compares in Lab
let showHuman=true, ghostClock=0;
const HUMAN_PAL=['#ffffff','#ff9de0','#a0e0ff','#ffe08a','#c0ffb0','#e0b0ff'];

/* ============================== NEURAL NET ================================= */
// colors (c) ported from the real game's DRIVES table so each drive keeps its identity
const DRIVES={
  tank:   {label:'Tank',           model:'tank', in:10, out:2, key:'tank',           c:'#00e676', outLab:['steer','throttle'],       desc:'two tracks — can\'t floor-and-turn-max at once. ↑/↓ = left track, W/S = right track (two sticks on a pad)'},
  arcade: {label:'Arcade',         model:'diff', in:10, out:2, key:'arcade',         c:'#40c4ff', outLab:['steer','throttle'],       desc:'single stick — throttle and turn are independent. WASD or arrows'},
  swervB: {label:'Swerve · bot',   model:'holoR',in:10, out:3, key:'holo_swerve',    c:'#ffab40', outLab:['forward','strafe','rotate'],desc:'omnidirectional, robot-relative. WASD = move, ←/→ = rotate (left stick move, right stick rotate)'},
  swervF: {label:'Swerve · field', model:'holoF',in:16, out:2, key:'holo_swerve_fc', c:'#e040fb', outLab:['move X','move Y'],desc:'omnidirectional, field-relative with heading hold. WASD = move on the field — physically as capable as bot-centric but by far the hardest for the AI to learn (see 📖 Learn)'},
};
const DRIVE_ORDER=['tank','arcade','swervB','swervF'];
let drive='tank';
const IN_BASE=['b1x','b1y','b1·','b2x','b2y','g→x','g→y','R.x','R.y','n/8'];
function inLabels(){return DRIVES[drive].in>10?IN_BASE.concat(['s1','c1','s4','c4','s10','c10']):IN_BASE;}
function outLabels(){return DRIVES[drive].outLab;}
function genomeLength(s){let n=0;for(let i=0;i<s.length-1;i++)n+=s[i]*s[i+1]+s[i+1];return n;}
let NET=[DRIVES[drive].in,12,8,DRIVES[drive].out];
let GENOME_LEN=genomeLength(NET);
function setDrive(id){drive=id;NET=[DRIVES[id].in,12,8,DRIVES[id].out];GENOME_LEN=genomeLength(NET);}
function randomGenome(){
  const g=new Float32Array(GENOME_LEN);
  for(let i=0;i<GENOME_LEN;i++)g[i]=gauss()*0.8;
  const lastN=NET[NET.length-2]*NET[NET.length-1]+NET[NET.length-1];
  for(let i=GENOME_LEN-lastN;i<GENOME_LEN;i++)g[i]*=0.4;
  return g;
}
function reactiveGenome(){
  const g=new Float32Array(GENOME_LEN);
  for(let i=0;i<GENOME_LEN;i++)g[i]=gauss()*0.05;
  const a=0.9+RNG()*0.9, c=a*(0.06+RNG()*0.10);
  const L0=(o,i)=>o*(NET[0]+1)+i;
  const O1=NET[1]*(NET[0]+1),      L1=(o,i)=>O1+o*(NET[1]+1)+i;
  const O2=O1+NET[2]*(NET[1]+1),   L2=(o,i)=>O2+o*(NET[2]+1)+i;
  g[L0(0,0)]=a; g[L0(0,5)]=-c;
  g[L0(1,1)]=a; g[L0(1,6)]=-c;
  g[L1(0,0)]=1.4; g[L1(1,1)]=1.4;
  const m=DRIVES[drive].model;
  if(m==='tank'||m==='diff'){ g[L2(0,1)]=2.2; g[L2(1,0)]=2.2; }
  else                      { g[L2(0,0)]=2.2; g[L2(1,1)]=2.2; }
  return g;
}
const _A=new Float32Array(16),_B=new Float32Array(16);
function forward(genome,inputs){
  let cur=_A,nxt=_B;for(let i=0;i<inputs.length;i++)cur[i]=inputs[i];
  let p=0;
  for(let l=0;l<NET.length-1;l++){
    const inN=NET[l],outN=NET[l+1];
    for(let o=0;o<outN;o++){let s=0;for(let i=0;i<inN;i++)s+=genome[p++]*cur[i];s+=genome[p++];nxt[o]=Math.tanh(s);}
    const t=cur;cur=nxt;nxt=t;
  }
  return cur;
}

/* ============================== HUMAN CONTROLS ============================= */
// Keyboard clusters + gamepad sticks, ported from the real game's getInp() mappings:
//   Tank:   ↑/↓ = LEFT track, W/S = RIGHT track. Pad: right stick Y = left track,
//           left stick Y = right track (crossed to match the keyboard sides, like the game).
//   Arcade: WASD or arrows merged (Y = fwd/back, X = turn). Pad: either stick.
//   Swerve·bot:   WASD = translate (robot frame), ←/→ = rotate. Pad: L stick move, R stick X rotate.
//   Swerve·field: WASD = translate (field frame); heading hold, no rotate. Pad: L stick.
const heldKeys=new Set();
const k=s=>heldKeys.has(s)?1:0;
const GP_DEAD=0.12;
let gpConnected=false;
function gpAxes(){                                   // {lx,ly,rx,ry} with deadzone, or zeros
  const pads=(navigator.getGamepads&&navigator.getGamepads())||[];
  for(const p of pads){ if(!p||!p.connected)continue;
    const dz=v=>Math.abs(v)>GP_DEAD?v:0;
    gpConnected=true;
    return {lx:dz(p.axes[0]||0),ly:dz(p.axes[1]||0),rx:dz(p.axes[2]||0),ry:dz(p.axes[3]||0),pad:p};
  }
  gpConnected=false;
  return {lx:0,ly:0,rx:0,ry:0,pad:null};
}
// Returns [o0,o1,o2] in the SAME output space each drive's net produces, so telemetry and
// physics use one code path for both drivers. Keyboard is digital; pad axes are analog.
function humanControlVector(){
  const g=gpAxes();
  const m=DRIVES[drive].model;
  if(m==='tank'){
    const L=clamp(k('arrowup')-k('arrowdown')-g.ry,-1,1);        // arrows / right stick = LEFT track
    const R=clamp(k('w')-k('s')-g.ly,-1,1);                      // WASD / left stick = RIGHT track
    return [(R-L)/2, (L+R)/2, 0];   // stepWorld's tank model reconstructs exactly L=o1-o0, R=o1+o0
  }
  if(m==='holoR'){
    const fw=clamp(k('w')-k('s')-g.ly,-1,1);
    const st=clamp(k('d')-k('a')+g.lx,-1,1);
    const rot=clamp(k('arrowright')-k('arrowleft')+g.rx,-1,1);
    return [fw,st,rot];
  }
  if(m==='holoF'){
    const vx=clamp(k('d')-k('a')+g.lx,-1,1);
    const vy=clamp(k('s')-k('w')+g.ly,-1,1);
    return [vx,vy,0];
  }
  // arcade: WASD or arrows merged; either stick
  const jx=Math.abs(g.lx)+Math.abs(g.ly)>0.05?g.lx:g.rx;
  const jy=Math.abs(g.lx)+Math.abs(g.ly)>0.05?g.ly:g.ry;
  const f=clamp((k('w')||k('arrowup'))-(k('s')||k('arrowdown'))-jy,-1,1);
  const t=clamp((k('d')||k('arrowright'))-(k('a')||k('arrowleft'))+jx,-1,1);
  return [t,f,0];
}
function gpStartPressed(){                            // A button (or Start) begins a run from idle/done
  const g=gpAxes(); if(!g.pad)return false;
  const b=g.pad.buttons;
  return !!((b[0]&&b[0].pressed)||(b[9]&&b[9].pressed));
}

/* ============================== PHYSICS (ported) ========================== */
function wallCheckRobot(r){
  if(r.x<RR)r.x=RR; else if(r.x>FW-RR)r.x=FW-RR;
  if(r.y<RR)r.y=RR; else if(r.y>FH-RR)r.y=FH-RR;
  const hw=WALL_H/2;
  if(Math.abs(r.y-WALL_Y)<RR+hw && !(r.x>=GAP_L&&r.x<=GAP_R)){
    if(r.y>WALL_Y)r.y=WALL_Y+RR+hw; else r.y=WALL_Y-RR-hw;
  }
}
function wallCheckBall(b){
  if(b.x<BR){b.x=BR;if(b.vx<0)b.vx*=-0.38;} else if(b.x>FW-BR){b.x=FW-BR;if(b.vx>0)b.vx*=-0.38;}
  if(b.y<BR){b.y=BR;if(b.vy<0)b.vy*=-0.38;} else if(b.y>FH-BR){b.y=FH-BR;if(b.vy>0)b.vy*=-0.38;}
  const hw=WALL_H/2;
  if(Math.abs(b.y-WALL_Y)<BR+hw && !(b.x>=GAP_L&&b.x<=GAP_R)){
    if(b.y>WALL_Y){b.y=WALL_Y+BR+hw;if(b.vy<0)b.vy*=-0.28;} else {b.y=WALL_Y-BR-hw;if(b.vy>0)b.vy*=-0.28;}
  }
}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy; if(l2<1e-4)return[ax,ay];
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1); return[ax+t*dx,ay+t*dy];
}
function scoreIf(b,t){ if(b.y<SCORE_Y){b.sc=true;b.vx=0;b.vy=0;b.scT=t;} }

function stepWorld(car){
  if(car.done)return;
  const r=car.robot;
  const inp=senseSP(car);
  const raw=car.human?humanControlVector():forward(car.genome,inp);
  const model=DRIVES[drive].model, nOut=DRIVES[drive].out;
  const q=v=>(!car.human&&inputMode==='keyboard')?(Math.abs(v)>DEADZONE?Math.sign(v):0):v;
  const o0=q(raw[0]), o1=q(raw[1]), o2=nOut>2?q(raw[2]):0;
  car.out[0]=o0; car.out[1]=o1; car.out[2]=o2;
  const SS=SPD*sensitivity, TT=TSP*sensitivity;
  let rs;
  if(model==='tank'){
    const L=clamp(o1-o0,-1,1), R=clamp(o1+o0,-1,1), f=(L+R)/2, t=(R-L)/2; r.h+=t*TT*DT;
    const vx=Math.cos(r.h)*f*SS, vy=Math.sin(r.h)*f*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else if(model==='holoR'){
    r.h+=o2*TT*DT; const c=Math.cos(r.h),s=Math.sin(r.h);
    const vx=(c*o0-s*o1)*SS, vy=(s*o0+c*o1)*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else if(model==='holoF'){
    const vx=o0*SS, vy=o1*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else {
    r.h+=o0*TT*DT; const vx=Math.cos(r.h)*o1*SS, vy=Math.sin(r.h)*o1*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  }
  wallCheckRobot(r);
  const drag=Math.pow(0.87,DT*60);
  for(const b of car.balls){
    if(b.sc)continue;
    b.x+=b.vx*DT; b.y+=b.vy*DT; b.vx*=drag; b.vy*=drag;
    if(Math.abs(b.vx)<0.4)b.vx=0; if(Math.abs(b.vy)<0.4)b.vy=0;
    wallCheckBall(b); scoreIf(b,car.t);
  }
  const B=car.balls;
  for(let i=0;i<B.length;i++){ const a=B[i]; if(a.sc)continue;
    for(let j=i+1;j<B.length;j++){ const c=B[j]; if(c.sc)continue;
      let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy); if(d>0&&d<2*BR){
        const nx=dx/d,ny=dy/d,ov=(2*BR-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
        const va=a.vx*nx+a.vy*ny, vc=c.vx*nx+c.vy*ny, imp=(vc-va)*0.82;
        a.vx+=nx*imp;a.vy+=ny*imp;c.vx-=nx*imp;c.vy-=ny*imp;
      }
    }
  }
  for(const b of car.balls){ if(b.sc)continue;
    const dx=b.x-r.x,dy=b.y-r.y,d=Math.hypot(dx,dy)||0.01;
    if(d<RR+BR){ const nx=dx/d,ny=dy/d,ov=RR+BR-d;
      b.x+=nx*ov;b.y+=ny*ov; r.x-=nx*ov*0.055;r.y-=ny*ov*0.055; wallCheckRobot(r); wallCheckBall(b);
      const psp=Math.max(rs*0.88,55); b.vx+=nx*psp;b.vy+=ny*psp; scoreIf(b,car.t);
    }
  }
  const ch=Math.cos(r.h),sh=Math.sin(r.h);
  for(const b of car.balls){ if(b.sc)continue;
    const rdx=b.x-r.x,rdy=b.y-r.y, lx=ch*rdx+sh*rdy, ly=-sh*rdx+ch*rdy;
    let bestOv=0,bnx=0,bny=0,bd=Infinity;
    for(const s of PLOW_SEGS){
      const cp=closestOnSeg(lx,ly,s[0],s[1],s[2],s[3]);
      const ex=lx-cp[0],ey=ly-cp[1],dist=Math.hypot(ex,ey)||0.01;
      if(dist<BR&&dist<bd){bd=dist;bnx=ex/dist;bny=ey/dist;bestOv=BR-dist;}
    }
    if(bestOv>0){
      const wx=ch*bnx-sh*bny, wy=sh*bnx+ch*bny;
      b.x+=wx*bestOv;b.y+=wy*bestOv; wallCheckBall(b);
      const psp=Math.max(rs*0.92,60); b.vx+=wx*psp;b.vy+=wy*psp; scoreIf(b,car.t);
    }
  }
  car.t+=DT; car.steps++;
  if(car.steps%2===0){ car.ghost.push([Math.round(car.t*1000)/1000,Math.round(r.x*10)/10,Math.round(r.y*10)/10,Math.round(r.h*1000)/1000]); }
  if(car.path.length===0 || (r.x-car.path[car.path.length-1][0])**2+(r.y-car.path[car.path.length-1][1])**2>16) car.path.push([r.x,r.y]);
  let scored=0;
  for(const b of car.balls){ if(b.sc){scored++;} else {
    const cl=(1-clamp(Math.hypot(b.x-GAP_CX,b.y-GOAL_Y)/470,0,1))*(1-0.65*wallDanger(b.x,b.y));
    if(cl>b.close)b.close=cl; } }
  car.scored=scored;
  if(telemOn && car.steps%2===0){
    car.telem.push([Math.round(car.t*1000)/1000,Math.round(r.x*10)/10,Math.round(r.y*10)/10,Math.round(r.h*1000)/1000,
                    Math.round(o0*1000)/1000,Math.round(o1*1000)/1000,Math.round(o2*1000)/1000,Math.round(rs*10)/10,scored]);
  }
  let closeSum=0, ndS=1e9;
  for(const b of car.balls){ closeSum+=b.close;
    if(!b.sc){ const d=Math.hypot(b.x-r.x,b.y-r.y); if(d<ndS)ndS=d; } }
  if(car.steps-car.snapStep>=120){
    if(car.snap){ let disp=0;
      for(let i=0;i<car.balls.length;i++){ const b=car.balls[i];
        if(!b.sc) disp+=Math.abs(b.x-car.snap[i*2])+Math.abs(b.y-car.snap[i*2+1]); }
      car.ballsDisplaced=disp>3;
    } else car.snap=new Float32Array(car.balls.length*2);
    for(let i=0;i<car.balls.length;i++){ car.snap[i*2]=car.balls[i].x; car.snap[i*2+1]=car.balls[i].y; }
    car.snapStep=car.steps;
  }
  if(scored>car.lastScored){ car.lastScored=scored; car.bestApproach=1e9; }
  const prog=scored*1000+closeSum*300;
  if(prog>car.progMark+0.5){ car.progMark=prog; car.progStep=car.steps; }
  else if(car.ballsDisplaced) car.progStep=car.steps;
  else if(ndS<car.bestApproach-4){ car.bestApproach=ndS; car.progStep=car.steps; }
  if(scored===8){ car.done=true; car.finishT=car.t; }
  // AI attempts auto-fail on timeout/stall (training economy); a human never does — the real
  // game has no countdown timer either, it's a personal-best time trial, not a game-over clock.
  else if(!car.human && (car.t>=TIMEOUT || car.steps-car.progStep>=600)){ car.done=true; car.finishT=null; }
  car.fit=fitnessSP(car);
}
function pushPhase(arr,car){
  const p=2*Math.PI*car.t/TIMEOUT;
  arr.push(Math.sin(p),Math.cos(p),Math.sin(4*p),Math.cos(4*p),Math.sin(10*p),Math.cos(10*p));
}
function wallDanger(x,y){
  const d0=Math.min(x-BR, FW-BR-x, FH-BR-y);
  const d=(y<WALL_Y+40 && (x<GAP_L||x>GAP_R)) ? Math.min(d0,10) : d0;
  return 1-clamp(d/60,0,1);
}
function senseSP(car){
  const r=car.robot;
  let b1=null,b2=null,d1=1e9,d2=1e9;
  for(const b of car.balls){ if(b.sc)continue; const d=Math.hypot(b.x-r.x,b.y-r.y);
    if(d<d1){d2=d1;b2=b1;d1=d;b1=b;} else if(d<d2){d2=d;b2=b;} }
  if(!b1){const e=[0,0,0,0,0,0,0,r.x/FW*2-1,r.y/FH*2-1,1];
    if(DRIVES[drive].in>10)pushPhase(e,car); return e;}
  if(!b2){b2=b1;d2=d1;}
  const fieldFrame=DRIVES[drive].model==='holoF';
  const ch=fieldFrame?1:Math.cos(r.h), sh=fieldFrame?0:Math.sin(r.h);
  const l1x=ch*(b1.x-r.x)+sh*(b1.y-r.y), l1y=-sh*(b1.x-r.x)+ch*(b1.y-r.y);
  const l2x=ch*(b2.x-r.x)+sh*(b2.y-r.y), l2y=-sh*(b2.x-r.x)+ch*(b2.y-r.y);
  let gvx=GAP_CX-b1.x, gvy=GOAL_Y-b1.y; const gl=Math.hypot(gvx,gvy)||1; gvx/=gl; gvy/=gl;
  const glx=ch*gvx+sh*gvy, gly=-sh*gvx+ch*gvy;
  const base=[clamp(l1x/220,-1,1),clamp(l1y/220,-1,1),1-clamp(d1/300,0,1),
         clamp(l2x/260,-1,1),clamp(l2y/260,-1,1), glx,gly,
         r.x/FW*2-1, r.y/FH*2-1, car.scored/8];
  if(DRIVES[drive].in>10) pushPhase(base,car);
  return base;
}
function fitnessSP(car){
  let fit=0;
  for(const b of car.balls){ if(b.sc)fit+=b.val-clamp(b.scT,0,TIMEOUT)*12; else fit+=300*b.close; }
  let nd=1e9; const r=car.robot; for(const b of car.balls) if(!b.sc)nd=Math.min(nd,Math.hypot(b.x-r.x,b.y-r.y));
  if(nd<1e9)fit+=40*(1-clamp(nd/500,0,1));
  fit-=((car.done&&car.finishT==null)?TIMEOUT:car.t)*10;
  if(car.scored===8&&car.finishT!=null)fit+=5000+(TIMEOUT-car.finishT)*80;
  return fit;
}
function makeCar(genome){
  return {genome,human:false,out:[0,0,0],
    robot:{x:ROBOT_START.x,y:ROBOT_START.y,h:ROBOT_START.h},
    balls:BALL_STARTS.map(p=>({x:p.x,y:p.y,vx:0,vy:0,sc:false,scT:0,close:0,
      val:10000+500*wallDanger(p.x,p.y)})),
    t:0,steps:0,ghost:[],telem:[],path:[],done:false,scored:0,finishT:null,fit:0,progMark:-1,progStep:0,lastScored:0,bestApproach:1e9,snap:null,snapStep:0,ballsDisplaced:false};
}

/* ============================== EVOLUTION ================================= */
const evo={pop:60,mut:0.18,gen:1,cars:[],genomes:[],hist:[],totalSteps:0,championSteps:0,
  bestTime:Infinity,bestGhost:null,bestTelem:null,bestGenome:null,championGen:0,
  championMode:'joystick',championDrive:'tank',championSens:1,newRecord:0,stag:0,bestFitSeen:-1e18};
function seedPopulation(n){evo.genomes=[];for(let i=0;i<n;i++)evo.genomes.push(i%6===5?reactiveGenome():randomGenome());}
function spawnGeneration(){evo.cars=evo.genomes.map(g=>makeCar(g));}
function resetEvolution(){evo.gen=1;evo.bestTime=Infinity;evo.bestGhost=null;evo.bestTelem=null;evo.bestGenome=null;evo.hist=[];evo.newRecord=0;evo.totalSteps=0;evo.championSteps=0;evo.stag=0;evo.bestFitSeen=-1e18;seedPopulation(evo.pop);spawnGeneration();}
function tournament(sorted){let bi=1e9,best=null;for(let k=0;k<3;k++){const idx=(Math.pow(RNG(),1.7)*sorted.length)|0;if(idx<bi){bi=idx;best=sorted[idx];}}return best.genome;}
function crossover(a,b){const c=new Float32Array(GENOME_LEN);for(let i=0;i<GENOME_LEN;i++)c[i]=RNG()<0.5?a[i]:b[i];return c;}
function mutate(g){
  const boost=1+Math.min(1,evo.stag*0.08);
  const rate=Math.min(0.9,evo.mut*boost);
  const sig=0.35*(1+Math.min(0.5,evo.stag*0.04));
  for(let i=0;i<GENOME_LEN;i++){if(RNG()<rate){if(RNG()<0.1)g[i]=gauss()*0.8;else g[i]+=gauss()*sig;}}
  return g;
}
function nextGeneration(){
  const scored=evo.cars.slice().sort((a,b)=>b.fit-a.fit);
  const best=scored[0].fit, avg=scored.reduce((s,x)=>s+x.fit,0)/scored.length;
  let fastest=null;
  for(const c of evo.cars) if(c.finishT!=null && (fastest==null||c.finishT<fastest.finishT)) fastest=c;
  evo.hist.push({best,avg,time:fastest?fastest.finishT:null,scored:scored[0].scored});
  if(best>evo.bestFitSeen+1e-6){ evo.bestFitSeen=best; evo.stag=0; } else evo.stag++;
  if(evo.stag>=25){
    const P0=evo.genomes.length, keep=Math.min(2,scored.length), next=[];
    for(let i=0;i<keep;i++)next.push(Float32Array.from(scored[i].genome));
    while(next.length<P0)next.push(RNG()<0.35?reactiveGenome():randomGenome());
    evo.genomes=next; evo.stag=0; evo.gen++; spawnGeneration(); return;
  }
  if(fastest && fastest.finishT<evo.bestTime){
    evo.bestTime=fastest.finishT; evo.bestGhost=fastest.ghost.slice(); evo.bestTelem=fastest.telem.slice();
    evo.bestGenome=Float32Array.from(fastest.genome); evo.championGen=evo.gen; evo.championMode=inputMode;
    evo.championDrive=drive; evo.championSens=sensitivity; evo.championSteps=evo.totalSteps; evo.newRecord=90;
  }
  const P=evo.genomes.length;
  const elites=Math.max(2,Math.round(P*0.08));
  const immigrants=Math.max(1,Math.round(P*(evo.stag>=12?0.25:0.12)));
  const next=[]; for(let i=0;i<elites;i++)next.push(Float32Array.from(scored[i].genome));
  const seenPat=new Set(); let patEl=0;
  for(let i=0;i<elites&&i<scored.length;i++)seenPat.add(scored[i].balls.reduce((s,b,k)=>s|(b.sc?1<<k:0),0));
  for(const c of scored){
    if(patEl>=6||next.length>=P-immigrants-4)break;
    const pat=c.balls.reduce((s,b,k)=>s|(b.sc?1<<k:0),0);
    if(seenPat.has(pat))continue;
    seenPat.add(pat); next.push(Float32Array.from(c.genome)); patEl++;
  }
  while(next.length<P-immigrants){const ch=crossover(tournament(scored),tournament(scored));mutate(ch);next.push(ch);}
  while(next.length<P)next.push(RNG()<0.35?reactiveGenome():randomGenome());
  evo.genomes=next; evo.gen++; spawnGeneration();
}
function stepEvolution(){
  let any=false;
  for(const c of evo.cars){ if(!c.done){ stepWorld(c); evo.totalSteps++; any=true; } }
  if(!any) nextGeneration();
}

const replay={active:false,car:null,hold:0};
function startReplay(){
  if(!evo.bestGenome){flash('No champion yet — let it train until it finishes a run.');return;}
  replay.car=makeCar(evo.bestGenome); replay.active=true; replay.hold=0;
  document.getElementById('btnReplay').classList.add('on');
  document.getElementById('scrubWrap').classList.add('show');
  flash('Replay — drag the ⏱ scrubber to any instant, and drag the speed slider to 🐢 slow motion to study the telemetry.');
}
function stopReplay(){replay.active=false;document.getElementById('btnReplay').classList.remove('on');document.getElementById('scrubWrap').classList.remove('show');}
function stepReplay(){
  const c=replay.car;
  if(c.done){ replay.hold+=DT; if(replay.hold>2.2){ replay.car=makeCar(evo.bestGenome); replay.hold=0; } return; }

}

/* ============================== SOLO / PLAY MODE =========================== */
const solo={phase:'idle',car:null,cdN:3,cdT:0.82,best:{}};
function soloKey(){return DRIVES[drive].key+'_'+sensitivity+'x';}
function loadSoloBest(){try{solo.best=JSON.parse(localStorage.getItem('frcds_solo_best')||'{}');}catch(e){solo.best={};}}
function saveSoloBest(){try{localStorage.setItem('frcds_solo_best',JSON.stringify(solo.best));}catch(e){}}
function lockedForPlay(){return mode==='play'&&(solo.phase==='playing'||solo.phase==='countdown');}
function startSoloRun(){
  solo.car=makeCar(null); solo.car.human=true;
  solo.phase='countdown'; solo.cdN=3; solo.cdT=0.82;
  heldKeys.clear();
}
function stepSolo(){
  if(solo.phase==='countdown'){
    solo.cdT-=DT; if(solo.cdT<=0){ solo.cdN--; if(solo.cdN<0) solo.phase='playing'; else solo.cdT=0.82; }
    return;
  }
  if(solo.phase==='playing'){
    stepWorld(solo.car);
    if(solo.car.done && solo.car.finishT!=null){
      solo.phase='done';
      const k=soloKey(), prev=solo.best[k], isPB=!prev||solo.car.finishT<prev.t;
      if(isPB){ solo.best[k]={t:solo.car.finishT,samples:solo.car.ghost}; saveSoloBest(); }
      addGhostEntry(isPB?'YOU ★PB':'YOU', DRIVES[drive].key, solo.car.finishT, solo.car.ghost, '#ffffff');
      flash(isPB?('New personal best! '+fmt(solo.car.finishT)):('Finished in '+fmt(solo.car.finishT)+'. Your best is '+fmt(prev.t)+'.'));
    }
  }
}

/* ============================== RENDER ==================================== */
let fld={s:1,x0:0,y0:0};
function layoutField(view){
  const padX=16, topPad=30, botPad=14;
  const s=Math.min((view.w-2*padX)/FW,(view.h-topPad-botPad)/FH);
  fld.s=s; fld.x0=view.x+(view.w-FW*s)/2; fld.y0=view.y+topPad+(view.h-topPad-botPad-FH*s)/2;
}
const FX=x=>fld.x0+x*fld.s, FY=y=>fld.y0+y*fld.s;

const wSpin={l:0,r:0};

function drawRobot(r,bright,car){
  const col=DRIVES[drive].c, m=DRIVES[drive].model;
  G.save(); G.translate(fld.x0,fld.y0); G.scale(fld.s,fld.s);
  G.translate(r.x,r.y);

    G.globalAlpha=0.14; G.rotate(r.h);
    G.fillStyle='#1a1a2e'; G.fillRect(-RR,-RR,RR*2,RR*2);
    G.strokeStyle=col; G.lineWidth=2; G.strokeRect(-RR,-RR,RR*2,RR*2);
    G.globalAlpha=1; G.restore(); return;
  }
  // shadow (unrotated, like the game)
  G.beginPath(); G.ellipse(2,5,RR,RR*0.6,0,0,Math.PI*2);
  G.fillStyle='rgba(0,0,0,0.42)'; G.fill();

  const o=car?car.out:[0,0,0];
  const SS=SPD*sensitivity, S=0.065, M=6284;
  if(m==='tank'||m==='diff'){
    const st=o[0],th=o[1],L=clamp(th-st,-1,1),R=clamp(th+st,-1,1);
    wSpin.l=(wSpin.l+L*SS*DT*4*S*60+M)%M; wSpin.r=(wSpin.r+R*SS*DT*4*S*60+M)%M;
    drawTrackAnim(-RR+1,RR-1,-(RR+3),wSpin.l,col);
    drawTrackAnim(-RR+1,RR-1,(RR+3),wSpin.r,col);
  }
  // glow ring
  G.beginPath(); G.arc(0,0,RR+8,0,Math.PI*2); G.fillStyle=col+'14'; G.fill();
  // body: square with drive-colored border + front bumper stripe

  // scoop: filled pocket + arms with round caps
  G.save(); G.lineCap='round'; G.lineJoin='round';
  G.beginPath();
  G.moveTo(PLOW_SEGS[0][0],PLOW_SEGS[0][1]);

  G.closePath();
  G.fillStyle='rgba(60,60,90,0.35)'; G.fill();
  G.strokeStyle=col; G.lineWidth=4;
  G.beginPath(); G.moveTo(PLOW_SEGS[0][0],PLOW_SEGS[0][1]); G.lineTo(PLOW_SEGS[0][2],PLOW_SEGS[0][3]); G.lineTo(PLOW_SEGS[1][2],PLOW_SEGS[1][3]); G.stroke();
  G.beginPath(); G.moveTo(PLOW_SEGS[2][0],PLOW_SEGS[2][1]); G.lineTo(PLOW_SEGS[2][2],PLOW_SEGS[2][3]); G.lineTo(PLOW_SEGS[3][2],PLOW_SEGS[3][3]); G.stroke();
  G.restore();
  // swerve pods on top of the chassis, aiming along each module's velocity (like the game)
  if(m==='holoR'||m==='holoF'){
    let vlx,vly,vr;
    if(m==='holoR'){ vlx=o[0]*SS; vly=o[1]*SS; vr=(o[2]||0)*TSP*sensitivity; }
    else { const ch=Math.cos(r.h),sh=Math.sin(r.h); const wx=o[0]*SS,wy=o[1]*SS;
           vlx=ch*wx+sh*wy; vly=-sh*wx+ch*wy; vr=0; }

function drawNet(genome,inputs,x,y,w,h){

function poseAt(sm,tau){
  if(!sm.length)return null;
  if(tau<=sm[0][0])return sm[0];
  const L=sm[sm.length-1]; if(tau>=L[0])return L;
  for(let i=0;i<sm.length-1;i++){ if(tau>=sm[i][0]&&tau<=sm[i+1][0]){
    const a=sm[i],b=sm[i+1],f=(tau-a[0])/((b[0]-a[0])||1);
    let dh=b[3]-a[3]; while(dh>Math.PI)dh-=2*Math.PI; while(dh<-Math.PI)dh+=2*Math.PI;
    return [tau,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f,a[3]+dh*f]; } }
  return L;
}

  G.globalAlpha=1;G.restore();
}

/* ---- telemetry panel: control inputs (works for AI or human — same output shape) ---- */
function barBip(x,y,barW,label,val,color,right){
  const h=9,cx=x+barW/2,v=clamp(val,-1,1);
  G.fillStyle='#6a6a88';G.font='10px "Courier New",monospace';G.textAlign='left';G.fillText(label,x,y-3);
  G.fillStyle='#15152a';roundRect(x,y,barW,h,3);G.fill();
  G.strokeStyle='#33335a';G.lineWidth=1;G.beginPath();G.moveTo(cx,y);G.lineTo(cx,y+h);G.stroke();
  G.fillStyle=color;
  if(v>=0)roundRect(cx,y+1,(barW/2)*v,h-2,2); else roundRect(cx+(barW/2)*v,y+1,(barW/2)*-v,h-2,2);
  G.fill();
  G.fillStyle='#cfe';G.font='bold 11px "Courier New",monospace';G.textAlign='right';G.fillText(v.toFixed(2),right,y+h);
}
function drawStick(cx,cy,rad,steer,thr){
  G.strokeStyle='#33335a';G.lineWidth=1.5;G.beginPath();G.arc(cx,cy,rad,0,7);G.stroke();
  G.strokeStyle='#22223a';G.lineWidth=1;G.beginPath();G.moveTo(cx-rad,cy);G.lineTo(cx+rad,cy);G.moveTo(cx,cy-rad);G.lineTo(cx,cy+rad);G.stroke();
  const kx=cx+clamp(steer,-1,1)*rad, ky=cy-clamp(thr,-1,1)*rad;
  G.strokeStyle='rgba(68,255,170,.4)';G.beginPath();G.moveTo(cx,cy);G.lineTo(kx,ky);G.stroke();
  G.fillStyle='#44ffaa';G.beginPath();G.arc(kx,ky,5,0,7);G.fill();
}
// Per-drive control layout matching the REAL game's input scheme — most drives are
// genuinely two-stick (tank: one per track; swerves: translate + rotate), and the keyboard
// uses TWO clusters (WASD + arrows). Telemetry mirrors that honestly.
//   sticks: [{lab, x, y}]  (y up = +) — one or two of them
//   clusters: [{lab, keys:[[char,lit],...4 or 2]}] — WASD cluster and/or arrow cluster
function ctrlScheme(o){
  const dz=DEADZONE, m=DRIVES[drive].model;
  if(m==='tank'){ const st=o[0],th=o[1],L=clamp(th-st,-1,1),R=clamp(th+st,-1,1);
    return {bars:[{lab:'L track',val:L,col:'#44ffaa'},{lab:'R track',val:R,col:'#5aa8ff'}],
      sticks:[{lab:'L STICK → R trk',x:0,y:R},{lab:'R STICK → L trk',x:0,y:L}],
      clusters:[{lab:'W/S = R track',keys:[['W',R>dz],['S',R<-dz]]},
                {lab:'↑/↓ = L track',keys:[['↑',L>dz],['↓',L<-dz]]}]};
  }
  if(m==='holoR'){
    return {bars:[{lab:'forward',val:o[0],col:'#44ffaa'},{lab:'strafe',val:o[1],col:'#5aa8ff'},{lab:'rotate',val:o[2],col:'#ffce4d'}],
      sticks:[{lab:'L STICK move',x:o[1],y:o[0]},{lab:'R STICK rotate',x:o[2],y:0}],
      clusters:[{lab:'WASD move',keys:[['W',o[0]>dz],['A',o[1]<-dz],['S',o[0]<-dz],['D',o[1]>dz]]},
                {lab:'←/→ rotate',keys:[['←',o[2]<-dz],['→',o[2]>dz]]}]};
  }
  if(m==='holoF'){
    return {bars:[{lab:'move X',val:o[0],col:'#44ffaa'},{lab:'move Y',val:o[1],col:'#5aa8ff'}],
      sticks:[{lab:'L STICK move',x:o[0],y:-o[1]}],
      clusters:[{lab:'WASD move (field)',keys:[['W',o[1]<-dz],['A',o[0]<-dz],['S',o[1]>dz],['D',o[0]>dz]]}]};
  }
  return {bars:[{lab:'steer',val:o[0],col:'#44ffaa'},{lab:'throttle',val:o[1],col:'#5aa8ff'}],
    sticks:[{lab:'EITHER STICK',x:o[0],y:o[1]}],
    clusters:[{lab:'WASD or arrows',keys:[['W',o[1]>dz],['A',o[0]<-dz],['S',o[1]<-dz],['D',o[0]>dz]]}]};
}
function drawKeyCluster(x,y,cluster){
  const ks=16,gp=3;
  const key=(kx,ky,ch,lit)=>{G.fillStyle=lit?'#44ffaa':'#181830';roundRect(kx,ky,ks,ks,4);G.fill();
    G.strokeStyle='#33335a';G.lineWidth=1;G.stroke();G.fillStyle=lit?'#04120c':'#8a8ab0';G.font='bold 9px "Courier New",monospace';G.textAlign='center';G.fillText(ch,kx+ks/2,ky+ks/2+3.5);};
  const K=cluster.keys;
  if(K.length===4){ // WASD diamond
    key(x+ks+gp,y,K[0][0],K[0][1]); key(x,y+ks+gp,K[1][0],K[1][1]);
    key(x+ks+gp,y+ks+gp,K[2][0],K[2][1]); key(x+2*(ks+gp),y+ks+gp,K[3][0],K[3][1]);
  } else { // 2-key column (up/down or left/right pair)
    key(x+ks+gp,y,K[0][0],K[0][1]); key(x+ks+gp,y+ks+gp,K[1][0],K[1][1]);
  }
  G.fillStyle='#6a6a88';G.font='8px "Courier New",monospace';G.textAlign='center';
  G.fillText(cluster.lab,x+1.5*(ks+gp),y+2*(ks+gp)+9);
  return 3*(ks+gp)+6;   // width consumed
}
function outSpeed(o){const SS=SPD*sensitivity,m=DRIVES[drive].model;
  if(m==='holoR'||m==='holoF')return Math.hypot(o[0],o[1])*SS;
  if(m==='tank'){const L=clamp(o[1]-o[0],-1,1),R=clamp(o[1]+o[0],-1,1);return Math.abs((L+R)/2)*SS;}
  return Math.abs(o[1])*SS;}
function mini(x,y,label,val,color){
  G.textAlign='left';G.fillStyle='#6a6a88';G.font='9px "Courier New",monospace';G.fillText(label,x,y);
  G.fillStyle=color||'#cfe';G.font='bold 12px "Courier New",monospace';G.fillText(String(val),x,y+14);
}
function drawTelemetry(px,py,pw,ph,car){
  panel(px,py,pw,ph,car&&car.human?'TELEMETRY — your control inputs':'TELEMETRY — AI control inputs');
  const inX=px+12,inW=pw-24,right=px+pw-12;
  const o=car?car.out:[0,0,0];
  const sc=ctrlScheme(o);
  let y=py+36;
  for(const b of sc.bars){ barBip(inX,y,inW-42,b.lab,b.val,b.col,right); y+=22; }
  y+=6;
  // sticks row: one or TWO analog sticks, matching the drive's real control scheme
  const rowH=56, stickR=rowH/2-6;
  let sxCur=inX+stickR+2;
  for(const st of sc.sticks){
    drawStick(sxCur,y+rowH/2-4,stickR,st.x,st.y);
    G.fillStyle='#6a6a88';G.font='8px "Courier New",monospace';G.textAlign='center';
    G.fillText(st.lab,sxCur,y+rowH+2);
    sxCur+=stickR*2+16;
  }
  // key clusters (WASD + arrows) to the right of the sticks
  let kX=sxCur-stickR+4;
  for(const cl of sc.clusters){ kX+=drawKeyCluster(kX,y+4,cl); }
  G.textAlign='left';G.fillStyle='#8a8ab0';G.font='9px "Courier New",monospace';
  G.fillText(DRIVES[drive].label+' · '+(car&&car.human?(gpConnected?'🎮 pad':'⌨ you'):(inputMode==='keyboard'?'⌨ digital':'🎮 analog'))+' · '+sensitivity.toFixed(1)+'× sens',inX,y+rowH+14);
  y+=rowH+26;
  const spd=outSpeed(o), hdg=car?(((car.robot.h*180/Math.PI)%360)+360)%360:0, colW=inW/3;
  mini(inX,y,'SPEED px/s',spd.toFixed(0),'#44ffaa');
  mini(inX+colW,y,'HEADING',hdg.toFixed(0)+'°','#cfe');
  mini(inX+2*colW,y,'BALLS',(car?car.scored:0)+'/8','#ffd740');
  y+=30;
  mini(inX,y,'TIME',fmt(car?car.t:0),'#cfe');
  mini(inX+colW,y,'POS',car?(car.robot.x|0)+','+(car.robot.y|0):'-','#9a9ac0');
  mini(inX+2*colW,y,'STEPS',car?car.steps:0,'#9a9ac0');
  y+=22;
  const oscH=py+ph-y-12; if(oscH<40)return;
  G.fillStyle='#0b0b16';roundRect(inX,y,inW,oscH,4);G.fill();G.strokeStyle='#22223a';G.lineWidth=1;G.stroke();
  const midY=y+oscH/2, amp=oscH/2-6;
  G.strokeStyle='#22223a';G.setLineDash([3,3]);G.beginPath();G.moveTo(inX,midY);G.lineTo(inX+inW,midY);G.stroke();G.setLineDash([]);
  const OL=DRIVES[drive].outLab, cols=['#44ffaa','#5aa8ff','#ffce4d'];
  const series=[]; for(let i=0;i<DRIVES[drive].out;i++) series.push([4+i,cols[i],OL[i]]);
  G.textAlign='left';G.font='9px "Courier New",monospace';let lx=inX+4;
  for(const s of series){ G.fillStyle=s[1]; G.fillText(s[2],lx,y+11); lx+=s[2].length*6+10; }
  const tel=car?car.telem:null;
  if(tel&&tel.length>1){
    const M=Math.min(tel.length,200),start=tel.length-M;
    for(const s of series){ G.strokeStyle=s[1];G.lineWidth=1.2;G.beginPath();
      for(let k=0;k<M;k++){const v=tel[start+k][s[0]],xx=inX+4+(inW-8)*(k/(M-1||1)),yy=midY-v*amp;k?G.lineTo(xx,yy):G.moveTo(xx,yy);}G.stroke(); }
  }else{ G.fillStyle='#55556e';G.textAlign='center';G.fillText('recording…',inX+inW/2,midY+3); }
}

/* ---- Lab HUD ---- */
function stat(x,y,label,val,color,size){
  G.textAlign='left';G.fillStyle='#6a6a88';G.font='10px "Courier New",monospace';G.fillText(label,x,y-14);
  G.fillStyle=color||'#fff';G.font='bold '+size+'px "Courier New",monospace';G.fillText(String(val),x,y+size-8);
}
function drawHUD(view,leader){
  G.textAlign='center';G.fillStyle='#dde';G.font='bold '+(20)+'px "Courier New",monospace';
  G.fillText(fmt(leader?leader.t:0),FX(FW/2),FY(0)-8);
  const sc=leader?leader.scored:0;
  G.textAlign='right';G.font='bold '+(15)+'px "Courier New",monospace';G.fillStyle=sc===8?'#00e676':'#ffd740';
  G.fillText(sc+'/8',FX(FW),FY(0)-8);
  const mx=view.x+14; let my=view.y+34;
  if(replay.active){
    stat(mx,my,'MODE','REPLAY','#ffce4d',20); my+=44;
    stat(mx,my,'CHAMPION','gen '+evo.championGen,'#fff',16); my+=36;
    stat(mx,my,'IDEAL TIME',isFinite(evo.bestTime)?fmt(evo.bestTime):'—','#44ffaa',20); my+=42;
    G.fillStyle='#7a7a98';G.font='11px "Courier New",monospace';G.textAlign='left';
    G.fillText('Re-running the best brain',mx,my); G.fillText('deterministically.',mx,my+15);
  }else{
    stat(mx,my,'GENERATION',evo.gen,'#fff',24); my+=46;
    stat(mx,my,'BEST TIME',isFinite(evo.bestTime)?fmt(evo.bestTime):'no finish yet','#44ffaa',isFinite(evo.bestTime)?22:14); my+=42;
    if(isFinite(evo.bestTime)){ G.fillStyle='#6a6a88';G.font='10px "Courier New",monospace';G.textAlign='left';G.fillText('g'+evo.championGen+' · '+DRIVES[evo.championDrive].label+' '+evo.championSens+'×',mx+100,my-28); }
    const done=evo.cars.filter(c=>c.done).length;
    stat(mx,my,'ATTEMPTS DONE',done+' / '+evo.cars.length,'#5aa8ff',16); my+=34;
    stat(mx,my,'LEADER',(leader?leader.scored:0)+'/8 balls','#ffd740',16); my+=32;
    stat(mx,my,'COMPUTE',fmtCompute(evo.totalSteps)+' steps','#8a8ab0',13); my+=32;
    if(evo.newRecord>0){
      G.globalAlpha=clamp01(evo.newRecord/90);G.fillStyle='#ffce4d';G.font='bold 22px "Courier New",monospace';G.textAlign='left';
      G.fillText('🏁 NEW RECORD',mx,my+6);G.globalAlpha=1;evo.newRecord--;
    }
  }
}

/* ============================== MAIN LOOP ================================= */
// speed slider: left end is SLOW MOTION for studying telemetry (0.25x = one physics step
// every 4 frames via fractional accumulation), right end is MAX training fast-forward.
const SPEED_STEPS=[{lbl:'🐢¼×',n:0.25},{lbl:'½×',n:0.5},{lbl:'1×',n:1},{lbl:'4×',n:4},{lbl:'10×',n:10},{lbl:'30×',n:30},{lbl:'75×',n:75},{lbl:'MAX',n:150}];
let speedIdx=3, simAcc=0, playing=true, showPaths=true;
function simIters(){ simAcc+=SPEED_STEPS[speedIdx].n; const it=Math.floor(simAcc); simAcc-=it; return it; }
function speedN(){return SPEED_STEPS[speedIdx].n;}
// replay scrubber: deterministic re-sim of the champion to any instant (cheap: <=3360 steps of one car)
function scrubTo(frac){
  if(!replay.active||!evo.bestGenome)return;
  const T=isFinite(evo.bestTime)?evo.bestTime:TIMEOUT;
  const c=makeCar(evo.bestGenome);
  let guard=0; const target=frac*T;
  while(c.t<target && !c.done && guard<TIMEOUT*60+10){ stepWorld(c); guard++; }
  replay.car=c; replay.hold=0;
  playing=false;
  const bp=document.getElementById('btnPlay'); bp.textContent='▶ Play'; bp.classList.remove('on');
  document.getElementById('scrubV').textContent=c.t.toFixed(2)+'s';
}
function currentLeader(){
  let best=null;
  for(const c of evo.cars){ if(!best||c.fit>best.fit) best=c; }
  return best;
}
function frameLab(fieldView,SB){
  if(playing){
    const iters=simIters();
    for(let k=0;k<iters;k++){ if(replay.active)stepReplay(); else stepEvolution(); }
    if(replay.active&&replay.car){ // keep the scrubber tracking the live replay position
      const T=isFinite(evo.bestTime)?evo.bestTime:TIMEOUT;
      document.getElementById('scrub').value=Math.round(clamp01(replay.car.t/T)*1000);
      document.getElementById('scrubV').textContent=replay.car.t.toFixed(2)+'s';
    }
  }
  drawField();
  if(showOptimal) drawOptimalPath();
  if(showCompare) drawCompare();
  let leader;
  if(replay.active){
    leader=replay.car;
    if(showPaths) drawPath(leader.path,'rgba(68,255,170,.85)',2);
    for(const b of leader.balls) drawBall(b);
    drawRobot(leader.robot,true,leader);
  }else{
    leader=currentLeader();
    for(const c of evo.cars) if(c!==leader) drawRobot(c.robot,false);
    if(leader){
      if(showPaths) drawPath(leader.path,'rgba(68,255,170,.8)',2);
      for(const b of leader.balls) drawBall(b);
      drawRobot(leader.robot,true,leader);
    }
  }
  drawHUD(fieldView,leader);
  if(telemOn){
    const marginW=fld.x0-fieldView.x-16;
    if(marginW>=150){
      const tX=fieldView.x+12, tW=clamp(marginW,150,252), tY=fieldView.y+248, tH=Math.min(370,H-tY-14);
      if(tH>150) drawTelemetry(tX,tY,tW,tH, replay.active?replay.car:leader);
    }
  }
  const sx=W-SB+10, sw=SB-20;
  const netH=Math.min(H*0.40,290), graphH=Math.min(H*0.28,180);
  const brain=(replay.active?replay.car:leader);
  const inp=brain?senseSP(brain):new Array(NET[0]).fill(0);
  drawNet(replay.active?evo.bestGenome:(evo.bestGenome||(brain&&brain.genome)||randomGenome()), inp, sx,10,sw,netH);
  drawGraph(sx,10+netH+10,sw,graphH);
  const ly=10+netH+10+graphH+10, lh=H-ly-10;
  if(lh>60 && showCompare){
    compareTable(sx,ly,sw,lh);
  } else if(lh>60){
    panel(sx,ly,sw,lh,'LEADERBOARD — balls · time');
    G.font='11px "Courier New",monospace';G.textAlign='left';
    if(replay.active){
      G.fillStyle='#9a9ac0';
      const lines=['This is the fastest path the','evolution found — the AI\'s','ideal racing line through all','8 balls. 🏆 Race AI in Play','mode to race it live.'];
      lines.forEach((t,i)=>G.fillText(t,sx+10,ly+34+i*16));
    }else{
      const top=evo.cars.slice().sort((a,b)=>b.fit-a.fit).slice(0,Math.min(8,Math.floor((lh-30)/16)));
      top.forEach((c,i)=>{const yy=ly+34+i*16;
        G.fillStyle=(c===leader)?'#44ffaa':(c.done?(c.finishT!=null?'#8affc0':'#77778f'):'#c8c8e0');
        G.fillText('#'+(i+1),sx+10,yy);
        G.fillText(c.scored+'/8',sx+42,yy);
        G.fillText(c.finishT!=null?fmt(c.finishT):(c.done?'DNF':'…'+fmt(c.t)),sx+92,yy);
      });
    }
  }
}
function frameSolo(fieldView,SB){
  if(solo.phase==='countdown'||solo.phase==='playing') stepSolo();
  drawField();
  drawHumanGhosts();
  if(solo.car){
    drawPath(solo.car.path,'rgba(68,255,170,.8)',2);
    for(const b of solo.car.balls) drawBall(b);
    drawRobot(solo.car.robot,true,solo.car);
  } else {                            // idle preview: show the real starting layout, not an empty box
    for(const p of BALL_STARTS) drawBall({x:p.x,y:p.y,sc:false});
    drawRobot(ROBOT_START,true,null);
  }
  drawSoloHUD(fieldView);
  const marginW=fld.x0-fieldView.x-16;
  if(marginW>=150 && solo.car){
    const tX=fieldView.x+12, tW=clamp(marginW,150,252), tY=fieldView.y+178, tH=Math.min(300,H-tY-14);
    if(tH>150) drawTelemetry(tX,tY,tW,tH, solo.car);
  }
  drawSoloSidebar(W-SB+10,10,SB-20,H-20);
  if(solo.phase==='idle') drawSoloIdleOverlay();
  else if(solo.phase==='countdown') drawSoloCountdown();
  else if(solo.phase==='done') drawSoloDoneOverlay();
}
let gpStartLatch=false, gpBadgeTick=0;
function frame(){
  requestAnimationFrame(frame);
  const SB=clamp(W*0.30,280,380);
  const fieldView={x:0,y:0,w:W-SB,h:H};
  layoutField(fieldView);
  // gamepad: badge + A/Start begins a run from idle/done in Play mode
  if(++gpBadgeTick%20===0){ gpAxes();
    const b=document.getElementById('gpBadge');
    b.classList.toggle('on',gpConnected); b.textContent=gpConnected?'🎮 pad ✓':'🎮 no pad';
  }
  if(mode==='play'&&(solo.phase==='idle'||solo.phase==='done')){
    const p=gpStartPressed();
    if(p&&!gpStartLatch){gpStartLatch=true;beginNewRun(false);startSoloRun();}
    if(!p)gpStartLatch=false;
  }
  checkChallenges();
  const _maxD=humanGhosts.reduce((m,g)=>Math.max(m,g.t),0);
  if(mode==='lab'&&replay.active) ghostClock=replay.car.t;
  else if(mode==='play'&&solo.car&&solo.phase==='playing') ghostClock=solo.car.t;
  else if(_maxD>0){ const step=(mode==='lab'&&playing)?DT*speedN():DT; ghostClock+=step; if(ghostClock>_maxD+1.2)ghostClock=0; }
  G.fillStyle='#07070e'; G.fillRect(0,0,W,H);
  if(mode==='lab') frameLab(fieldView,SB); else frameSolo(fieldView,SB);
}

function persistRuns(){try{localStorage.setItem('frcds_ai_runs',JSON.stringify(savedRuns));}catch(e){}}
function loadRuns(){try{const s=localStorage.getItem('frcds_ai_runs');if(s)savedRuns=JSON.parse(s)||[];}catch(e){savedRuns=[];}}
function saveRun(){
  if(!evo.bestGhost||!isFinite(evo.bestTime)){flash('No completed run yet — let the AI finish scoring all 8 first.');return;}
  const run={id:savedRuns.length+1,ts:new Date().toISOString(),drive:evo.championDrive,sens:evo.championSens,inputMode:evo.championMode,pop:evo.pop,mut:evo.mut,
    championGen:evo.championGen,steps:evo.championSteps,time:evo.bestTime,telem:evo.bestTelem||[],ghost:evo.bestGhost};
  savedRuns.push(run); persistRuns();
  flash('Run #'+run.id+' saved: '+fmt(evo.bestTime)+' ('+DRIVES[evo.championDrive].label+', '+evo.championMode+', '+evo.championSens+'×). '+savedRuns.length+' run(s) stored.');
}
function exportData(){
  const runs=savedRuns.slice();
  if(evo.bestGhost&&isFinite(evo.bestTime)&&!runs.some(r=>r.time===evo.bestTime&&r.championGen===evo.championGen&&r.inputMode===evo.championMode&&r.drive===evo.championDrive)){
    runs.push({id:'current',drive:evo.championDrive,sens:evo.championSens,inputMode:evo.championMode,pop:evo.pop,mut:evo.mut,championGen:evo.championGen,steps:evo.championSteps,time:evo.bestTime,telem:evo.bestTelem||[],ghost:evo.bestGhost});
  }
  if(!runs.length){flash('No runs to export yet — finish a run (or 💾 Save Run) first.');return;}
  const rows=[['run_id','drive','sensitivity','input_mode','pop','mut','champion_gen','agent_steps','finish_time_s','t_s','x','y','heading_deg','ctrl0','ctrl1','ctrl2','speed_pxps','balls_scored']];
  let total=0;
  for(const r of runs){
    const dl=r.drive?DRIVES[r.drive].label:'', sn=r.sens||1;
    const tel=(r.telem&&r.telem.length)?r.telem:null;
    if(tel){ for(const s of tel){ rows.push([r.id,dl,sn,r.inputMode,r.pop,r.mut,r.championGen,r.steps||'',r.time,s[0],s[1],s[2],(s[3]*180/Math.PI).toFixed(1),s[4],s[5],s[6],s[7],s[8]]); total++; } }
    else if(r.ghost){ for(const g of r.ghost){ rows.push([r.id,dl,sn,r.inputMode,r.pop,r.mut,r.championGen,r.steps||'',r.time,g[0],g[1],g[2],(g[3]*180/Math.PI).toFixed(1),'','','','','']); total++; } }
  }
  downloadFile('driveshowdown_AI_runs_'+runs.length+'.csv','text/csv',rows.map(r=>r.join(',')).join('\n'));
  flash('Exported '+runs.length+' run(s), '+total+' telemetry rows → CSV.');
}
function importGhostFile(text,filename){
  const d=JSON.parse(text); const src=d.ghosts||d; if(typeof src!=='object'||!src)return 0;
  const base=(filename||'').replace(/\.json$/i,'').replace(/^frc_ghosts_?/i,'').slice(0,18);
  let n=0;
  for(const [k,g] of Object.entries(src)){
    if(!g||!Array.isArray(g.samples)||typeof g.t!=='number')continue;
    addGhostEntry((base?base+'·':'')+k, k, g.t, g.samples);
    n++;
  }
  return n;
}

/* ============================== LEARN OVERLAY =============================== */
function buildLearn(){
  document.getElementById('learn').innerHTML=`
  <div class="card">
    <button class="close" id="learnClose">✕ Close</button>
    <h1>📖 WHAT WE LEARNED BUILDING THIS</h1>
    <div class="sub">Six real lessons about machine learning, discovered the hard way while getting an AI to drive this game. Every number below is from an actual training run of this tool.</div>
    <div class="cols">
    <div>
      <h2>1. RANDOM ≠ RANDOM BEHAVIOR</h2>
      <p>How you represent the world to a neural net shapes what its <i>random</i> attempts look like — and evolution only has random attempts to work with at the start. Feed a tiny random network robot-relative sensors, and it curls and sweeps as it drives. Feed the SAME network field-relative sensors, and it becomes a near-constant function — a dead-straight ballistic plow.</p>
      <p><span class="g">Field-centric swerve froze at 3/8 balls for 100+ generations</span> because every random policy was a straight line. Redesigning its inputs (and adding Fourier phase features so near-constant policies become curved sweeps) got it to 7/8.</p>
      <h2>2. REWARDS CAN LIE</h2>
      <p>Early fitness paid 1,000 points per ball scored minus 12 points per second survived. A <i>fast</i> 6-ball run could out-score a <i>slow</i> 7-ball run — so evolution rationally learned to stop trying for the 7th ball. <span class="g">Populations froze at 6/8 for 70+ generations</span>, optimizing a ceiling instead of climbing past it.</p>
      <p>Fix: ball count must dominate <i>absolutely</i> (10,000/ball — a margin of at least +1,624 over any possible time-bonus spread), with full speed pressure preserved <i>within</i> each ball-count tier. This is a classic "deceptive reward" — a very common trap.</p>
      <h2>3. PHYSICALLY POSSIBLE ≠ LEARNED</h2>
      <p>When field-swerve got stuck, the first question was: can this robot even do it? A hand-coded controller (no learning at all, just careful geometry) cleared all 8 balls in <span class="g">27.97 seconds</span> — under the exact same physics the stuck AI was using. The robot was never the problem. The <i>search</i> was.</p>
      <p>Separating "is this achievable" from "did my method find it" is one of the most useful habits in ML debugging.</p>
    </div>
    <div>
      <h2>4. POPULATIONS GET STUCK</h2>
      <p>A population that's been copying its best genome for 25 generations straight has converged onto one idea — usually a fragile one. Three fixes work together: <b>stagnation-adaptive mutation</b> (strength doubles while frozen, resets on improvement), <b>cataclysmic restarts</b> (keep the champions, reroll everyone else — a fresh lottery ticket beats endless small nudges to a dead end), and <b>route-diversity elites</b> (keep the best genome for every distinct pattern of balls scored, so different partial solutions survive side by side).</p>
      <h2>5. DON'T KILL YOUR OWN BOOTSTRAP</h2>
      <p>An optimization meant to speed up training — auto-failing any attempt with zero progress for 10 seconds — accidentally killed the lucky random policies that occasionally bumped a ball forward. That's exactly the raw material evolution needs to get started. Fix: only kill true non-interactors; anything actively touching a ball, or setting a new best approach toward one, keeps going.</p>
      <p>Lesson: an optimization that looks purely mechanical can quietly change <i>what your algorithm is able to discover</i>.</p>
      <h2>6. EASY FOR HUMANS ≠ EASY FOR MACHINES</h2>
      <p>Ask any FRC driver: field-centric swerve is the <i>easiest</i> drivetrain — forward is always screen-forward, no mental rotation required. It's also, by a wide margin, the <i>hardest</i> for this AI to learn (see #1 and #3). A human brings perception, planning, and years of spatial intuition to the controls for free. A neural net starts with none of that — only the numbers you feed it, and the shape those numbers make when nudged at random.</p>
      <p><span class="g">The interface that minimizes human effort and the parameterization that maximizes machine learnability are different questions.</span> That gap is the most interesting thing this project found. Try it yourself: 🎮 Play field-swerve (easy!), then 🤖 Lab-train it (hard!).</p>
    </div>
    </div>
    <p style="margin-top:16px;color:#7a7a98"><kbd>L</kbd> reopens this panel, <kbd>Esc</kbd> closes it.</p>
  </div>`;
  document.getElementById('learnClose').onclick=()=>toggleLearn(false);
}

  const n=CHALLENGES.filter(c=>chalState.done[c.id]).length;
  el.innerHTML='<h3>🏆 CHALLENGES — '+n+' / '+CHALLENGES.length+'</h3>'+
    CHALLENGES.map(c=>'<div class="c'+(chalState.done[c.id]?' done':'')+'"><b>'+c.icon+' '+c.name+(chalState.done[c.id]?' ✓':'')+'</b><p>'+c.desc+'</p></div>').join('')+
    '<p style="font-size:10px;color:#6a6a88;margin-top:6px">Progress saves in this browser. Settings for each goal are up to you — that\'s the game.</p>';
}
let chalTick=0;
function checkChallenges(){
  if(++chalTick%30)return;                              // ~2x per second is plenty
  if(isFinite(evo.bestTime)&&!chalState.drivesCleared.includes(evo.championDrive)){
    chalState.drivesCleared.push(evo.championDrive); saveChal();
  }
  let changed=false;
  for(const c of CHALLENGES){
    if(chalState.done[c.id])continue;
    let ok=false; try{ok=c.check();}catch(e){}
    if(ok){chalState.done[c.id]=true;changed=true;flash('🏆 CHALLENGE COMPLETE: '+c.icon+' '+c.name+'!');}
  }
  if(changed){saveChal();chalRender();}
}

/* ============================== KONAMI CODE =============================== */
const KONAMI=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let konBuf=[];
function konamiFeed(key){
  konBuf.push(key); if(konBuf.length>KONAMI.length)konBuf.shift();
  if(konBuf.length===KONAMI.length&&konBuf.every((k2,i)=>k2===KONAMI[i])){konBuf=[];showKonami();}
}
function showKonami(){
  const el=document.getElementById('konami');
  el.innerHTML='<div class="card">'+
    '<h1>✦ YOU FOUND IT ✦</h1>'+
    '<p>I haven\'t figured out what goes here yet.</p>'+
    '<p>But while you\'re here — <b>thank you Ethan</b> for prompting me to build this,<br>and <b>thank you Claude</b> for actually building it.</p>'+
    '<p style="margin-top:14px;font-size:11px;color:#7a7a98">built with <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a><br><span style="color:#55556e">(referral code goes here someday, maybe)</span></p>'+
    '<div style="margin-top:16px"><button id="konClose" class="on">✕ back to the robots</button></div></div>';
  el.classList.add('show');
  document.getElementById('konClose').onclick=()=>el.classList.remove('show');
}

/* ============================== TOOLTIPS ================================= */
const TIP=document.getElementById('tooltip');
function positionTip(mx,my){
  const r=TIP.getBoundingClientRect();let x=mx+14,y=my+16;
  if(x+r.width>window.innerWidth-8)x=mx-r.width-14;
  if(y+r.height>window.innerHeight-8)y=my-r.height-16;
  TIP.style.left=Math.max(6,x)+'px';TIP.style.top=Math.max(6,y)+'px';
}
function bindTips(){
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',e=>{TIP.innerHTML=el.getAttribute('data-tip');TIP.style.opacity='1';positionTip(e.clientX,e.clientY);});
    el.addEventListener('mousemove',e=>positionTip(e.clientX,e.clientY));
    el.addEventListener('mouseleave',()=>{TIP.style.opacity='0';});
  });
}

/* ============================== UI WIRING ================================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const wrap=document.getElementById('canwrap'); W=wrap.clientWidth; H=wrap.clientHeight;
  CV.width=Math.round(W*DPR); CV.height=Math.round(H*DPR); G.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
function setMode(m){
  mode=m;
  document.getElementById('btnModePlay').classList.toggle('on',m==='play');
  document.getElementById('btnModeLab').classList.toggle('on',m==='lab');
  document.getElementById('barPlay').style.display=m==='play'?'contents':'none';
  document.getElementById('barLab').style.display=m==='lab'?'contents':'none';
}
document.getElementById('btnModePlay').onclick=()=>setMode('play');
document.getElementById('btnModeLab').onclick=()=>setMode('lab');
document.getElementById('btnLearn').onclick=()=>toggleLearn(!document.getElementById('learn').classList.contains('show'));
// ---- RUN settings (amber): queue into `pending`, applied only when a new run starts ----
function syncSettingUI(){
  document.getElementById('selDrive').value=pending.drive!=null?pending.drive:drive;
  document.getElementById('selSens').value=String(pending.sens!=null?pending.sens:sensitivity);
  document.getElementById('selInput').value=pending.inputMode!=null?pending.inputMode:inputMode;
  const p=pending.pop!=null?pending.pop:evo.pop;
  document.getElementById('pop').value=p; document.getElementById('popV').textContent=p;
  updatePendingBadge();
  try{localStorage.setItem('frcds_solo_settings',JSON.stringify({drive:pending.drive??drive,sens:pending.sens??sensitivity,inputMode:pending.inputMode??inputMode,pop:pending.pop??evo.pop}));}catch(e){}
}
document.getElementById('selDrive').onchange=function(){
  pending.drive=this.value===drive?null:this.value; updatePendingBadge(); syncSettingUI();
  if(pending.drive)flash('Drive → '+DRIVES[this.value].label+': '+DRIVES[this.value].desc+'. ⏳ Applies when you start a new run — your current run is untouched.'+(this.value==='swervF'?' (Lab tip: POP 120 + patience.)':''));
};
document.getElementById('selSens').onchange=function(){
  const v=parseFloat(this.value);
  pending.sens=v===sensitivity?null:v; updatePendingBadge(); syncSettingUI();
  if(pending.sens!=null)flash('Sensitivity → '+v+'× '+(v>1?'(faster & twitchier).':'(base speed).')+' ⏳ Applies at the next run.');
};
document.getElementById('selInput').onchange=function(){
  pending.inputMode=this.value===inputMode?null:this.value; updatePendingBadge(); syncSettingUI();
  if(pending.inputMode)flash('AI input model → '+(this.value==='joystick'?'ANALOG (continuous — theoretical fastest).':'KEYBOARD (digital on/off — usually a bit slower).')+' ⏳ Applies at the next run.');
};
// applies pending settings; resets evolution only when something actually changed (or forced)
function beginNewRun(force){
  const had=pendingCount()>0;
  if(had)applyPending();
  syncSettingUI();
  if(had||force){ stopReplay(); resetEvolution();
    if(had)flash('Settings applied — fresh run. (Drive/sens are shared, so the Lab population restarted too.)'); }
  return had;
}
document.getElementById('btnStart').onclick=function(){ beginNewRun(false); startSoloRun(); };
document.getElementById('btnAddAIGhost').onclick=function(){
  if(!evo.bestGenome){flash('No AI champion yet — switch to 🤖 LAB and let it train until it finishes a run.');return;}
  addGhostEntry('AI '+DRIVES[evo.championDrive].label+' g'+evo.championGen, DRIVES[evo.championDrive].key, evo.bestTime, evo.bestGhost, '#ffce4d');
  flash('AI champion added as a ghost ('+fmt(evo.bestTime)+', '+DRIVES[evo.championDrive].label+'). Start your run to race it live!');
};
document.getElementById('btnExportMyGhost').onclick=exportMyGhost;
document.getElementById('btnImportPlayGhost').onclick=()=>document.getElementById('ghostFile').click();
document.getElementById('btnPlay').onclick=function(){playing=!playing;this.textContent=playing?'⏸ Pause':'▶ Play';this.classList.toggle('on',playing);};
document.getElementById('speedSlider').oninput=function(){
  speedIdx=+this.value; document.getElementById('speedV').textContent=SPEED_STEPS[speedIdx].lbl;
};
document.getElementById('scrub').oninput=function(){ scrubTo(+this.value/1000); };
document.getElementById('btnReset').onclick=function(){
  const had=beginNewRun(true);
  if(!had)flash('New run — fresh random population with the current settings.');
};
document.getElementById('btnReplay').onclick=function(){if(replay.active)stopReplay();else startReplay();};
document.getElementById('btnTelem').onclick=function(){
  telemOn=!telemOn; this.classList.toggle('on',telemOn);
  flash(telemOn?'Telemetry ON.':'Telemetry OFF — nothing recorded, trains a hair faster. Never limited AI top speed.');
};
document.getElementById('btnSaveRun').onclick=saveRun;
document.getElementById('btnCompare').onclick=function(){showCompare=!showCompare;this.classList.toggle('on',showCompare);};
document.getElementById('btnData').onclick=exportData;
document.getElementById('btnGhost').onclick=exportGhost;
document.getElementById('btnHelp').onclick=()=>toggleHelp(!document.getElementById('help').classList.contains('show'));
document.getElementById('pop').oninput=function(){document.getElementById('popV').textContent=this.value;};
document.getElementById('pop').onchange=function(){
  const v=+this.value;
  pending.pop=v===evo.pop?null:v; updatePendingBadge();
  if(pending.pop!=null)flash('Population → '+v+'. ⏳ Applies at the next ↺ New Run — the current population keeps evolving untouched.');
};
document.getElementById('mut').oninput=function(){evo.mut=+this.value/100;document.getElementById('mutV').textContent=evo.mut.toFixed(2);};
document.getElementById('pathToggle').onchange=function(){showPaths=this.checked;};
document.getElementById('optToggle').onchange=function(){showOptimal=this.checked;};
document.getElementById('humanToggle').onchange=function(){showHuman=this.checked;};
document.getElementById('btnImport').onclick=()=>document.getElementById('ghostFile').click();
document.getElementById('ghostFile').onchange=function(e){
  const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const n=importGhostFile(rd.result,f.name);
    if(n){showHuman=true;document.getElementById('humanToggle').checked=true;flash('Imported '+n+' ghost'+(n>1?'s':'')+' — racing live in Play, ranked in Lab Compare.');}
    else flash('No valid ghosts found in that file.'); }
    catch(err){ flash('Could not read that file — expected a ghost exported from Drive Showdown (frc_ghosts JSON).'); } };
  rd.readAsText(f); e.target.value='';
};
document.getElementById('btnTut').onclick=startTutorial;
document.getElementById('btnChal').onclick=function(){const el=document.getElementById('chal');chalRender();el.classList.toggle('show');};
function normKey(e){return e.key.toLowerCase();}
window.addEventListener('keydown',e=>{
  konamiFeed(normKey(e));                                // ↑↑↓↓←→←→BA, always listening
  const helpOpen=document.getElementById('help').classList.contains('show');
  const learnOpen=document.getElementById('learn').classList.contains('show');
  if((helpOpen||learnOpen)&&e.key==='Escape'){toggleHelp(false);toggleLearn(false);return;}
  if(document.getElementById('konami').classList.contains('show')&&e.key==='Escape'){document.getElementById('konami').classList.remove('show');return;}
  if(document.getElementById('chal').classList.contains('show')&&e.key==='Escape'){document.getElementById('chal').classList.remove('show');return;}
  if(e.target&&/input|textarea/i.test(e.target.tagName))return;
  if(e.key==='l'||e.key==='L'){toggleLearn(!document.getElementById('learn').classList.contains('show'));return;}
  if(e.key==='m'||e.key==='M'){setMode(mode==='play'?'lab':'play');return;}
  if(e.key==='?'||e.key==='/'){toggleHelp(!document.getElementById('help').classList.contains('show'));return;}
  if(mode==='play'){
    const k=normKey(e);
    if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
    if(k==='r'){beginNewRun(false);startSoloRun();return;}
    heldKeys.add(k);
    return;
  }
  if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click();}
  else if(e.key==='r'||e.key==='R')document.getElementById('btnReplay').click();
  else if(e.key==='t'||e.key==='T')document.getElementById('btnTelem').click();
  else if(e.key==='c'||e.key==='C')document.getElementById('btnCompare').click();
  else if(e.key==='d'||e.key==='D')document.getElementById('btnData').click();
});
window.addEventListener('keyup',e=>{heldKeys.delete(normKey(e));});

/* ---- boot ---- */
loadRuns(); loadSoloBest(); loadChal(); buildHelp(); buildLearn(); bindTips();
try{ const s=JSON.parse(localStorage.getItem('frcds_solo_settings')||'null');   // restore last session's setup
  if(s){ if(DRIVES[s.drive])setDrive(s.drive); if([1,1.5,2].includes(s.sens))sensitivity=s.sens;
         if(['joystick','keyboard'].includes(s.inputMode))inputMode=s.inputMode;
         if(s.pop>=20&&s.pop<=120)evo.pop=s.pop; } }catch(e){}
resize(); resetEvolution(); syncSettingUI(); setMode('play'); frame();
</script>
