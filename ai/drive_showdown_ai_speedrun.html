<!DOCTYPE html>
<!--
  file: ai/drive_showdown_ai_speedrun.html
  version: 1.0.0
  author: Sam Cao (AI Lab addon)
  created: 2026-07-16
  description: Adversarial neuroevolution SPEEDRUN OPTIMIZER for the ORIGINAL single-player
    portrait ("legacy" 400x720) Drive Showdown time trial — push all 8 balls through the
    center gap as fast as possible. Faithfully re-implements the real game's field geometry,
    kinematic robot + scoop-plow physics, ball drag/collisions, and scoring rule (ported from
    drive_showdown_v5.1.98.html). A population of neural-net drivers competes; the fittest
    breed; over generations the fleet discovers the ideal racing line and drops its best time.
    The champion's run exports as a GAME-COMPATIBLE GHOST (frcds-ghosts JSON) so you can import
    it into the real game and race the AI's optimal path. No build, no libraries, offline.
  ai_update: Patch with targeted edits only. Bump version + changelog at bottom. JS syntax check after edits.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070e">
<title>DriveShowdown · AI Speedrun</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#07070e;--panel:#0e0e1c;--line:#1d1d33;--mint:#44ffaa;--blue:#5aa8ff;--amber:#ffce4d;--red:#ff5c6a;--dim:#7a7a98;--ball:#ffd740;--gold:#ffce4d;}
  html,body{height:100%;background:var(--bg);color:#e8e8ff;font-family:'Courier New',monospace;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100dvh;}
  #bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;background:linear-gradient(180deg,#101024,#0a0a16);
       border-bottom:1px solid var(--line);user-select:none;}
  #bar .brand{font-weight:bold;letter-spacing:1px;color:var(--mint);text-shadow:0 0 10px rgba(68,255,170,.4);margin-right:4px;white-space:nowrap;}
  #bar .brand b{color:#fff;}
  #bar .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap;}
  button{font-family:inherit;font-size:12px;color:#dfe;background:#161630;border:1px solid #2a2a4a;border-radius:6px;
          padding:6px 10px;cursor:pointer;transition:.12s;white-space:nowrap;}
  button:hover{background:#20204a;border-color:var(--mint);color:#fff;}
  button.on{background:var(--mint);color:#04120c;border-color:var(--mint);font-weight:bold;}
  button.gold{border-color:#4a3a1a;}
  button.gold.on{background:var(--gold);color:#1a1204;border-color:var(--gold);}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  .ctl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);}
  .ctl input[type=range]{width:82px;accent-color:var(--mint);}
  #canwrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;}
  #hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim);pointer-events:none;text-shadow:0 1px 3px #000;max-width:60%;}
  #tooltip{position:fixed;z-index:50;max-width:270px;background:#141428;border:1px solid var(--mint);color:#dfe;
    font-size:11px;line-height:1.4;padding:7px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .1s;
    box-shadow:0 6px 22px rgba(0,0,0,.55);}
  #tooltip b{color:var(--mint);}
  #help{position:absolute;inset:0;z-index:40;display:none;overflow:auto;padding:22px;background:rgba(6,6,14,.93);}
  #help.show{display:block;}
  #help .card{max-width:880px;margin:0 auto;background:#0d0d1c;border:1px solid var(--line);border-radius:12px;padding:20px 26px 28px;}
  #help h1{font-size:18px;color:var(--mint);margin-bottom:2px;letter-spacing:.5px;}
  #help .sub{color:var(--dim);font-size:11px;margin-bottom:6px;}
  #help h2{font-size:12px;color:var(--amber);margin:18px 0 7px;border-bottom:1px solid var(--line);padding-bottom:4px;letter-spacing:.5px;}
  #help p{font-size:12.5px;line-height:1.55;color:#c8c8e0;margin:6px 0;}
  #help ul{list-style:none;} #help li{font-size:12.5px;line-height:1.5;color:#c8c8e0;margin:6px 0;}
  #help .k{color:var(--mint);font-weight:bold;} #help .g{color:var(--gold);font-weight:bold;}
  #help kbd{background:#20204a;border:1px solid #33335a;border-radius:4px;padding:1px 6px;color:#fff;font-size:11px;}
  #help .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
  #help .close{position:sticky;top:0;float:right;z-index:2;}
</style>

<body>
<div id="app">
  <div id="bar">
    <span class="brand">DRIVE<b>SHOWDOWN</b> · AI SPEEDRUN</span>
    <span class="tag" id="modeTag">EVOLVE</span>
    <span class="sep"></span>
    <button id="btnPlay" class="on" data-tip="<b>Play / Pause</b> the whole simulation. Shortcut: <b>Space</b>.">⏸ Pause</button>
    <button id="btnSpeed" data-tip="<b>Simulation speed</b> — how many physics steps per frame. Crank to <b>MAX</b> to fast-forward training; it does not change the result, only how fast you get there.">▶ 4×</button>
    <span class="sep"></span>
    <button id="btnReset" data-tip="<b>Reset Evolution</b> — throw away the population and start over from fresh random brains (new random search from scratch).">↺ Reset</button>
    <button id="btnReplay" class="gold" data-tip="<b>Replay Best</b> — deterministically re-run the champion so you can watch the ideal line (with the balls) at any speed. Shortcut: <b>R</b>.">🏁 Replay Best</button>
    <span class="sep"></span>
    <button id="btnDrive" data-tip="<b>Drive type</b> — the robot's control model: <b>Tank</b> (two tracks, can't floor-and-turn-max at once), <b>Arcade</b> (single stick, throttle+turn independent), <b>Swerve · bot</b> (omni, robot-relative) and <b>Swerve · field</b> (omni, field-relative). Each has its own optimal path; the two swerves reach a similar best time but can train at different rates. Switching restarts evolution.">🚗 Tank</button>
    <button id="btnSens" data-tip="<b>Sensitivity</b> — the real game's speed &amp; turn lever. <b>2×</b> makes the robot twice as fast and turny, so the theoretical best time is faster. Switching restarts evolution.">⚙ 1× sens</button>
    <button id="btnInput" data-tip="<b>AI input model.</b> <b>Analog (joystick)</b>: continuous steer/throttle — the theoretical fastest. <b>Keyboard (digital)</b>: the AI may only press W/A/S/D (full on/off), like a keyboard player — usually a bit slower. Switching restarts evolution so each is a fair, separate search.">🎮 Analog</button>
    <button id="btnTelem" class="on" data-tip="<b>Telemetry ON/OFF.</b> Telemetry only *observes* the AI — it never limits how fast it can go. Turning it OFF just declutters and trains a hair faster (nothing to record). The real lever for a faster theoretical best is Input = <b>Analog</b>.">📈 Telemetry</button>
    <span class="sep"></span>

    <button id="btnCompare" data-tip="<b>Compare Runs</b> — overlay every saved run's ghost on the field (colour-coded) and rank them by finish time and training compute, so you can see which settings were most efficient. Shortcut: <b>C</b>.">⚖ Compare</button>
    <button id="btnData" data-tip="<b>Export Data</b> — download a CSV of every saved run (and the current champion): settings, training compute, then time, position, heading, steer, throttle, speed and balls scored at 30 Hz. Opens in Excel/Sheets.">📊 Export Data</button>
    <button id="btnGhost" data-tip="<b>Export Ghost</b> — download the ideal path in the real game's own ghost format. In Drive Showdown: Single Player → high scores → Ghosts → import, then race the AI's line.">👻 Ghost → game</button>
    <button id="btnImport" data-tip="<b>Import Human Ghost</b> — load a ghost you exported from the real game (Single Player → high scores → Ghosts → export). It overlays on the field and <b>plays back in real time</b> so you can watch a human run against the AI's line, and it joins the ⚖ Compare ranking.">📥 Import Human</button>
    <span class="sep"></span>
    <div class="ctl" data-tip="<b>Population size</b> — how many AI drivers attempt the course each generation. Bigger = broader search per generation but slower. Changing it restarts evolution."><span>POP</span> <input id="pop" type="range" min="20" max="120" step="10" value="60"><span id="popV">60</span></div>
    <div class="ctl" data-tip="<b>Mutation rate</b> — how much offspring brains randomly change each generation. Higher = more exploration (noisier), lower = finer tuning."><span>MUT</span> <input id="mut" type="range" min="1" max="60" step="1" value="18"><span id="mutV">0.18</span></div>
    <div class="ctl" data-tip="<b>Live path</b> — show the mint trail of the current best robot as it drives."><label>PATH <input id="pathToggle" type="checkbox" checked style="accent-color:var(--mint)"></label></div>
    <div class="ctl" data-tip="<b>Optimal path</b> — show the champion's ideal racing line, coloured by speed (red = slow, green = fast)."><label>OPTIMAL <input id="optToggle" type="checkbox" checked style="accent-color:var(--gold)"></label></div>
    <div class="ctl" data-tip="<b>Human ghosts</b> — show/hide imported human runs and their live real-time playback."><label>HUMAN <input id="humanToggle" type="checkbox" checked style="accent-color:#fff"></label></div>
    <button id="btnHelp" data-tip="Open the full controls &amp; telemetry reference. Shortcut: <b>?</b>">❔ Help</button>
  </div>
  <div id="canwrap">
    <canvas id="view"></canvas>
    <div id="hint">The bright robot is the current best of a whole population of neural nets, all racing to push the 8 balls through the top gap. Fittest breed each generation → the best time keeps dropping. Hover any control for what it does, or hit <b>❔ Help</b>.</div>
    <div id="help"></div>
  </div>
</div>
<div id="tooltip"></div>
<input id="ghostFile" type="file" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ============================================================================
   DriveShowdown AI Speedrun — neuroevolution for the single-player portrait
   time trial. Physics + geometry + scoring ported verbatim (behaviourally) from
   drive_showdown_v5.1.98.html legacy layout. Goal: score all 8 balls fastest.
   ==========================================================================*/
const CV=document.getElementById('view'), G=CV.getContext('2d');
let W=0,H=0,DPR=1;

/* ---------- real-game constants (legacy 400x720 single-player) ---------- */
const FW=380, FH=628;                                  // field-local play area
const WALL_Y=118, WALL_H=10, GAP_L=125, GAP_R=255;     // scoring wall + gap
const RR=17, BR=9;                                     // robot / ball radii
const SPD=180, TSP=2.85;                               // max linear / angular speed
const SCORE_Y=WALL_Y-BR-6;                             // a ball with y<103 has scored
const GAP_CX=(GAP_L+GAP_R)/2, GOAL_Y=WALL_Y-15;        // aim point at the gap mouth
const BALL_STARTS=[
  {x:55,y:175},{x:165,y:158},{x:290,y:172},
  {x:352,y:238},{x:195,y:268},{x:65,y:318},
  {x:250,y:400},{x:48,y:455}
];
const ROBOT_START={x:FW/2,y:FH-58,h:-Math.PI/2};
// scoop arms in robot-local coords (+x forward), RR=17 -> matches setRobotScale(1)
const PLOW_SEGS=[
  [RR+2,-(RR+5), RR+14,-(RR+13)], [RR+14,-(RR+13), RR+26,-(RR+20)],
  [RR+2, RR+5,   RR+14, RR+13],   [RR+14, RR+13,   RR+26, RR+20]
];
const TIMEOUT=56;                                      // seconds cap per attempt (headroom for diff drives' first sloppy full-clears)
const DT=1/60;

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=t=>t.toFixed(2)+'s';
let RNG=Math.random;
function gauss(){let u=0,v=0;while(u===0)u=RNG();while(v===0)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---- settings the user can toggle ---- */
const DEADZONE=0.28;                 // keyboard-mode: |output|>DEADZONE counts as a key press
let inputMode='joystick';            // 'joystick' (analog, continuous) | 'keyboard' (digital, on/off)
let sensitivity=1;                   // real-game sensitivity lever — scales speed AND turn rate (2x = twice as fast/turny)
let telemOn=true;                    // record + show telemetry (pure observation; off = trains slightly faster)
let showOptimal=true;                // draw the champion's ideal racing line (speed-coloured)
let showCompare=false;               // overlay every saved run's ghost to compare settings
let savedRuns=[];                    // snapshots of champions across runs, for multi-run data export
const CMP_PAL=['#ff5c6a','#5aa8ff','#ffce4d','#b98cff','#4dd2ff','#ff9f4d','#8affc0','#ff7ae0','#ff6a9f','#9fff6a'];
let humanGhosts=[];                  // ghosts imported from the real game (frcds-ghosts), overlaid + played back
let showHuman=true, ghostClock=0;    // real-time playback clock for human ghosts
const HUMAN_PAL=['#ffffff','#ff9de0','#a0e0ff','#ffe08a','#c0ffb0','#e0b0ff'];

/* ============================== NEURAL NET ================================= */
// inputs: nearest-ball local (x,y,closeness), 2nd-ball local (x,y),
//         ball->gap unit dir in robot frame (x,y), robot pos (x,y), fraction scored
// Drive types (control models) — ported behaviourally from the real game's DRIVES/HOLO/STEER.
// model: diff = differential (drive along heading + turn); car = Ackermann (turn scales with speed,
// no pivot); holoR = omnidirectional robot-relative (swerve); holoF = omnidirectional field-relative.
const DRIVES={
  tank:   {label:'Tank',           model:'tank', in:10, out:2, key:'tank',           outLab:['steer','throttle'],       desc:'two tracks (steer+throttle → clamped L/R) — can\'t floor-and-turn-max at once, so a touch slower than arcade'},
  arcade: {label:'Arcade',         model:'diff', in:10, out:2, key:'arcade',         outLab:['steer','throttle'],       desc:'single stick — throttle and turn are independent (square control envelope), so slightly freer than tank'},
  swervB: {label:'Swerve · bot',   model:'holoR',in:10, out:3, key:'holo_swerve',    outLab:['forward','strafe','rotate'],desc:'omnidirectional, robot-relative — strafe any direction + rotate independently'},
  swervF: {label:'Swerve · field', model:'holoF',in:12, out:3, key:'holo_swerve_fc', outLab:['move X','move Y','rotate'],desc:'omnidirectional, field-relative — the same capability as bot-centric, just a different control frame (sees its own heading, like a real field-centric driver)'},
};
const DRIVE_ORDER=['tank','arcade','swervB','swervF'];
let drive='tank';
const IN_BASE=['b1x','b1y','b1·','b2x','b2y','g→x','g→y','R.x','R.y','n/8'];
function inLabels(){return DRIVES[drive].in>10?IN_BASE.concat(['sinθ','cosθ']):IN_BASE;}
function outLabels(){return DRIVES[drive].outLab;}
function genomeLength(s){let n=0;for(let i=0;i<s.length-1;i++)n+=s[i]*s[i+1]+s[i+1];return n;}
let NET=[DRIVES[drive].in,12,8,DRIVES[drive].out];     // in = task sensors (+heading for field-swerve); out = drive DOF
let GENOME_LEN=genomeLength(NET);
function setDrive(id){drive=id;NET=[DRIVES[id].in,12,8,DRIVES[id].out];GENOME_LEN=genomeLength(NET);}
function randomGenome(){
  const g=new Float32Array(GENOME_LEN);
  for(let i=0;i<GENOME_LEN;i++)g[i]=gauss()*0.8;
  // small final-layer init: gentle initial outputs (less bang-bang spinning) bootstrap ball-
  // pushing far better than saturated controls — especially for the swerves' rotate channel
  const lastN=NET[NET.length-2]*NET[NET.length-1]+NET[NET.length-1];
  for(let i=GENOME_LEN-lastN;i<GENOME_LEN;i++)g[i]*=0.4;
  return g;
}
const _A=new Float32Array(16),_B=new Float32Array(16);
function forward(genome,inputs){
  let cur=_A,nxt=_B;for(let i=0;i<inputs.length;i++)cur[i]=inputs[i];
  let p=0;
  for(let l=0;l<NET.length-1;l++){
    const inN=NET[l],outN=NET[l+1];
    for(let o=0;o<outN;o++){let s=0;for(let i=0;i<inN;i++)s+=genome[p++]*cur[i];s+=genome[p++];nxt[o]=Math.tanh(s);}
    const t=cur;cur=nxt;nxt=t;
  }
  return cur;
}

/* ============================== PHYSICS (ported) ========================== */
function wallCheckRobot(r){                              // robot: kinematic, position-only clamp
  if(r.x<RR)r.x=RR; else if(r.x>FW-RR)r.x=FW-RR;
  if(r.y<RR)r.y=RR; else if(r.y>FH-RR)r.y=FH-RR;
  const hw=WALL_H/2;
  if(Math.abs(r.y-WALL_Y)<RR+hw && !(r.x>=GAP_L&&r.x<=GAP_R)){
    if(r.y>WALL_Y)r.y=WALL_Y+RR+hw; else r.y=WALL_Y-RR-hw;
  }
}
function wallCheckBall(b){                               // balls carry velocity -> bounce
  if(b.x<BR){b.x=BR;if(b.vx<0)b.vx*=-0.38;} else if(b.x>FW-BR){b.x=FW-BR;if(b.vx>0)b.vx*=-0.38;}
  if(b.y<BR){b.y=BR;if(b.vy<0)b.vy*=-0.38;} else if(b.y>FH-BR){b.y=FH-BR;if(b.vy>0)b.vy*=-0.38;}
  const hw=WALL_H/2;
  if(Math.abs(b.y-WALL_Y)<BR+hw && !(b.x>=GAP_L&&b.x<=GAP_R)){
    if(b.y>WALL_Y){b.y=WALL_Y+BR+hw;if(b.vy<0)b.vy*=-0.28;} else {b.y=WALL_Y-BR-hw;if(b.vy>0)b.vy*=-0.28;}
  }
}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy; if(l2<1e-4)return[ax,ay];
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1); return[ax+t*dx,ay+t*dy];
}
function scoreIf(b,t){ if(b.y<SCORE_Y){b.sc=true;b.vx=0;b.vy=0;b.scT=t;} }

function stepWorld(car){
  if(car.done)return;
  const r=car.robot;
  // ---- neural driver -> arcade/tank kinematics (vx,vy along heading; vr turn) ----
  const inp=senseSP(car);
  const o=forward(car.genome,inp), model=DRIVES[drive].model, nOut=DRIVES[drive].out;
  const q=v=>inputMode==='keyboard'?(Math.abs(v)>DEADZONE?Math.sign(v):0):v;  // keyboard = digital on/off
  const o0=q(o[0]), o1=q(o[1]), o2=nOut>2?q(o[2]):0;
  car.out[0]=o0; car.out[1]=o1; car.out[2]=o2;
  const SS=SPD*sensitivity, TT=TSP*sensitivity;          // sensitivity scales BOTH speed and turn rate
  let rs;
  if(model==='tank'){                                    // net gives steer(o0)/throttle(o1); tank clamps to tracks
    const L=clamp(o1-o0,-1,1), R=clamp(o1+o0,-1,1), f=(L+R)/2, t=(R-L)/2; r.h+=t*TT*DT;
    const vx=Math.cos(r.h)*f*SS, vy=Math.sin(r.h)*f*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else if(model==='holoR'){                            // swerve, robot-relative: forward + strafe + rotate
    r.h+=o2*TT*DT; const c=Math.cos(r.h),s=Math.sin(r.h);
    const vx=(c*o0-s*o1)*SS, vy=(s*o0+c*o1)*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else if(model==='holoF'){                            // swerve, field-relative: move X/Y + rotate
    r.h+=o2*TT*DT; const vx=o0*SS, vy=o1*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  } else {                                               // diff (arcade): steer + throttle, independent
    r.h+=o0*TT*DT; const vx=Math.cos(r.h)*o1*SS, vy=Math.sin(r.h)*o1*SS; r.x+=vx*DT; r.y+=vy*DT; rs=Math.hypot(vx,vy);
  }
  wallCheckRobot(r);
  // ---- free ball motion + drag + scoring ----
  const drag=Math.pow(0.87,DT*60);
  for(const b of car.balls){
    if(b.sc)continue;
    b.x+=b.vx*DT; b.y+=b.vy*DT; b.vx*=drag; b.vy*=drag;
    if(Math.abs(b.vx)<0.4)b.vx=0; if(Math.abs(b.vy)<0.4)b.vy=0;
    wallCheckBall(b); scoreIf(b,car.t);
  }
  // ---- ball-ball separation (restitution ~0.82) ----
  const B=car.balls;
  for(let i=0;i<B.length;i++){ const a=B[i]; if(a.sc)continue;
    for(let j=i+1;j<B.length;j++){ const c=B[j]; if(c.sc)continue;
      let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy); if(d>0&&d<2*BR){
        const nx=dx/d,ny=dy/d,ov=(2*BR-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
        const va=a.vx*nx+a.vy*ny, vc=c.vx*nx+c.vy*ny, imp=(vc-va)*0.82;
        a.vx+=nx*imp;a.vy+=ny*imp;c.vx-=nx*imp;c.vy-=ny*imp;
      }
    }
  }
  // ---- robot body push ----
  for(const b of car.balls){ if(b.sc)continue;
    const dx=b.x-r.x,dy=b.y-r.y,d=Math.hypot(dx,dy)||0.01;
    if(d<RR+BR){ const nx=dx/d,ny=dy/d,ov=RR+BR-d;
      b.x+=nx*ov;b.y+=ny*ov; r.x-=nx*ov*0.055;r.y-=ny*ov*0.055; wallCheckRobot(r); wallCheckBall(b);
      const psp=Math.max(rs*0.88,55); b.vx+=nx*psp;b.vy+=ny*psp; scoreIf(b,car.t);
    }
  }
  // ---- scoop-arm plow ----
  const ch=Math.cos(r.h),sh=Math.sin(r.h);
  for(const b of car.balls){ if(b.sc)continue;
    const rdx=b.x-r.x,rdy=b.y-r.y, lx=ch*rdx+sh*rdy, ly=-sh*rdx+ch*rdy;
    let bestOv=0,bnx=0,bny=0,bd=Infinity;
    for(const s of PLOW_SEGS){
      const cp=closestOnSeg(lx,ly,s[0],s[1],s[2],s[3]);
      const ex=lx-cp[0],ey=ly-cp[1],dist=Math.hypot(ex,ey)||0.01;
      if(dist<BR&&dist<bd){bd=dist;bnx=ex/dist;bny=ey/dist;bestOv=BR-dist;}
    }
    if(bestOv>0){
      const wx=ch*bnx-sh*bny, wy=sh*bnx+ch*bny;
      b.x+=wx*bestOv;b.y+=wy*bestOv; wallCheckBall(b);
      const psp=Math.max(rs*0.92,60); b.vx+=wx*psp;b.vy+=wy*psp; scoreIf(b,car.t);
    }
  }
  // ---- bookkeeping ----
  car.t+=DT; car.steps++;
  if(car.steps%2===0){ car.ghost.push([Math.round(car.t*1000)/1000,Math.round(r.x*10)/10,Math.round(r.y*10)/10,Math.round(r.h*1000)/1000]); } // 30 Hz, matches the game's ghost format
  if(car.path.length===0 || (r.x-car.path[car.path.length-1][0])**2+(r.y-car.path[car.path.length-1][1])**2>16) car.path.push([r.x,r.y]);
  let scored=0;
  for(const b of car.balls){ if(b.sc){scored++;} else { const cl=1-clamp(Math.hypot(b.x-GAP_CX,b.y-GOAL_Y)/470,0,1); if(cl>b.close)b.close=cl; } }
  car.scored=scored;
  // telemetry: the AI's theoretical control inputs + pose, 30 Hz (only when telemetry is on)
  if(telemOn && car.steps%2===0){
    car.telem.push([Math.round(car.t*1000)/1000,Math.round(r.x*10)/10,Math.round(r.y*10)/10,Math.round(r.h*1000)/1000,
                    Math.round(o0*1000)/1000,Math.round(o1*1000)/1000,Math.round(o2*1000)/1000,Math.round(rs*10)/10,scored]);
  }
  // ball-progress metric (monotone): scoring, or pushing any ball nearer the gap, raises it.
  // The stall timer also resets while ANY ball is in motion — a policy actively dribbling balls
  // is learning material and keeps its full run; only true non-interactors (wall-sitters,
  // spinners) get killed early. Killing ball-touchers amputates evolution's bootstrap path.
  let closeSum=0, ballsMoving=false, ndS=1e9;
  for(const b of car.balls){ closeSum+=b.close;
    if(!b.sc){ if(Math.abs(b.vx)>1||Math.abs(b.vy)>1) ballsMoving=true;
      const d=Math.hypot(b.x-r.x,b.y-r.y); if(d<ndS)ndS=d; } }
  if(scored>car.lastScored){ car.lastScored=scored; car.bestApproach=1e9; } // new ball down -> fresh approach budget for the next one
  const prog=scored*1000+closeSum*300;
  if(prog>car.progMark+0.5){ car.progMark=prog; car.progStep=car.steps; }
  else if(ballsMoving) car.progStep=car.steps;
  else if(ndS<car.bestApproach-4){ car.bestApproach=ndS; car.progStep=car.steps; } // setting a new approach record toward an unscored ball counts as progress — late exploration finds ball 7
  if(scored===8){ car.done=true; car.finishT=car.t; }
  else if(car.t>=TIMEOUT || car.steps-car.progStep>=600){ car.done=true; car.finishT=null; } // 10s with no ball interaction at all -> hopeless; stop early
  car.fit=fitnessSP(car);
}
function senseSP(car){
  const r=car.robot;
  let b1=null,b2=null,d1=1e9,d2=1e9;
  for(const b of car.balls){ if(b.sc)continue; const d=Math.hypot(b.x-r.x,b.y-r.y);
    if(d<d1){d2=d1;b2=b1;d1=d;b1=b;} else if(d<d2){d2=d;b2=b;} }
  if(!b1){const e=[0,0,0,0,0,0,0,r.x/FW*2-1,r.y/FH*2-1,1];
    if(DRIVES[drive].in>10)e.push(Math.sin(r.h),Math.cos(r.h)); return e;}
  if(!b2){b2=b1;d2=d1;}
  // Sensor frame matches the drive's CONTROL frame: field-centric swerve senses in FIELD
  // coordinates (translation is directly learnable, heading never scrambles the ball inputs);
  // everything else senses in the robot frame. Field-swerve ALSO gets sinθ/cosθ — its heading
  // still aims the scoop, and without observing it the fitness landscape is chaotic (any
  // mutation diverges the open-loop heading drift → the elite froze at 3/8 for 70 gens).
  // A real field-centric driver has eyes on their robot's orientation; so does this net.
  const fieldFrame=DRIVES[drive].model==='holoF';
  const ch=fieldFrame?1:Math.cos(r.h), sh=fieldFrame?0:Math.sin(r.h);
  const l1x=ch*(b1.x-r.x)+sh*(b1.y-r.y), l1y=-sh*(b1.x-r.x)+ch*(b1.y-r.y);
  const l2x=ch*(b2.x-r.x)+sh*(b2.y-r.y), l2y=-sh*(b2.x-r.x)+ch*(b2.y-r.y);
  let gvx=GAP_CX-b1.x, gvy=GOAL_Y-b1.y; const gl=Math.hypot(gvx,gvy)||1; gvx/=gl; gvy/=gl;
  const glx=ch*gvx+sh*gvy, gly=-sh*gvx+ch*gvy;
  const base=[clamp(l1x/220,-1,1),clamp(l1y/220,-1,1),1-clamp(d1/300,0,1),
         clamp(l2x/260,-1,1),clamp(l2y/260,-1,1), glx,gly,
         r.x/FW*2-1, r.y/FH*2-1, car.scored/8];
  if(DRIVES[drive].in>10)base.push(Math.sin(r.h),Math.cos(r.h));
  return base;
}
function fitnessSP(car){
  // TRUE lexicographic fitness. Two properties must hold at once:
  //  (1) ball count dominates ABSOLUTELY: base 10000/ball exceeds the max possible
  //      intra-class spread (8x672 time bonuses + 2400 close + 40 prox + 560 DNF < 8400),
  //      so any slow 7-ball run beats any fast 6-ball run (margin >= +1624). At 1000/ball
  //      the ordering inverted and evolution froze at 6/8 for 70+ generations.
  //  (2) strong speed pressure WITHIN a class: the full 12/s per-ball discount, so
  //      6-ball routines keep compressing — which frees the time needed to reach ball 7.
  //      (Weakening it to 3/s froze fitness solid: nobody had time left to explore.)
  let fit=0;
  for(const b of car.balls){ if(b.sc)fit+=10000-clamp(b.scT,0,TIMEOUT)*12; else fit+=300*b.close; }
  let nd=1e9; const r=car.robot; for(const b of car.balls) if(!b.sc)nd=Math.min(nd,Math.hypot(b.x-r.x,b.y-r.y));
  if(nd<1e9)fit+=40*(1-clamp(nd/500,0,1));
  fit-=((car.done&&car.finishT==null)?TIMEOUT:car.t)*10; // speed pressure; every DNF pays the full-time cost so an early-killed staller can't outrank a slow progresser
  if(car.scored===8&&car.finishT!=null)fit+=5000+(TIMEOUT-car.finishT)*80;
  return fit;
}
function makeCar(genome){
  return {genome,out:[0,0,0],
    robot:{x:ROBOT_START.x,y:ROBOT_START.y,h:ROBOT_START.h},
    balls:BALL_STARTS.map(p=>({x:p.x,y:p.y,vx:0,vy:0,sc:false,scT:0,close:0})),
    t:0,steps:0,ghost:[],telem:[],path:[],done:false,scored:0,finishT:null,fit:0,progMark:-1,progStep:0,lastScored:0,bestApproach:1e9};
}

/* ============================== EVOLUTION ================================= */
const evo={pop:60,mut:0.18,gen:1,cars:[],genomes:[],hist:[],totalSteps:0,championSteps:0,
  bestTime:Infinity,bestGhost:null,bestTelem:null,bestGenome:null,championGen:0,
  championMode:'joystick',championDrive:'tank',championSens:1,newRecord:0,stag:0,bestFitSeen:-1e18};
function seedPopulation(n){evo.genomes=[];for(let i=0;i<n;i++)evo.genomes.push(randomGenome());}
function spawnGeneration(){evo.cars=evo.genomes.map(g=>makeCar(g));}
function resetEvolution(){evo.gen=1;evo.bestTime=Infinity;evo.bestGhost=null;evo.bestTelem=null;evo.bestGenome=null;evo.hist=[];evo.newRecord=0;evo.totalSteps=0;evo.championSteps=0;evo.stag=0;evo.bestFitSeen=-1e18;seedPopulation(evo.pop);spawnGeneration();}
function tournament(sorted){let bi=1e9,best=null;for(let k=0;k<3;k++){const idx=(Math.pow(RNG(),1.7)*sorted.length)|0;if(idx<bi){bi=idx;best=sorted[idx];}}return best.genome;}
function crossover(a,b){const c=new Float32Array(GENOME_LEN);for(let i=0;i<GENOME_LEN;i++)c[i]=RNG()<0.5?a[i]:b[i];return c;}
function mutate(g){
  const boost=1+Math.min(1,evo.stag*0.08);              // stagnation-adaptive: rate up to 2x while stuck on a plateau
  const rate=Math.min(0.9,evo.mut*boost);
  const sig=0.35*(1+Math.min(0.5,evo.stag*0.04));       // creep sigma up to 1.5x (too-hot mutation wrecks elites' offspring)
  for(let i=0;i<GENOME_LEN;i++){if(RNG()<rate){if(RNG()<0.1)g[i]=gauss()*0.8;else g[i]+=gauss()*sig;}}
  return g;
}
function nextGeneration(){
  const scored=evo.cars.slice().sort((a,b)=>b.fit-a.fit);
  const best=scored[0].fit, avg=scored.reduce((s,x)=>s+x.fit,0)/scored.length;
  // fastest *finisher* this generation
  let fastest=null;
  for(const c of evo.cars) if(c.finishT!=null && (fastest==null||c.finishT<fastest.finishT)) fastest=c;
  evo.hist.push({best,avg,time:fastest?fastest.finishT:null,scored:scored[0].scored});
  if(best>evo.bestFitSeen+1e-6){ evo.bestFitSeen=best; evo.stag=0; } else evo.stag++;  // plateau detector -> adaptive mutation
  if(fastest && fastest.finishT<evo.bestTime){
    evo.bestTime=fastest.finishT; evo.bestGhost=fastest.ghost.slice(); evo.bestTelem=fastest.telem.slice();
    evo.bestGenome=Float32Array.from(fastest.genome); evo.championGen=evo.gen; evo.championMode=inputMode;
    evo.championDrive=drive; evo.championSens=sensitivity; evo.championSteps=evo.totalSteps; evo.newRecord=90;
  }
  const P=evo.genomes.length;
  const elites=Math.max(2,Math.round(P*0.08));
  const immigrants=Math.max(1,Math.round(P*0.12));      // fresh random blood every gen -> escapes plateaus
  const next=[]; for(let i=0;i<elites;i++)next.push(Float32Array.from(scored[i].genome));
  while(next.length<P-immigrants){const ch=crossover(tournament(scored),tournament(scored));mutate(ch);next.push(ch);}
  while(next.length<P)next.push(randomGenome());
  evo.genomes=next; evo.gen++; spawnGeneration();
}
function stepEvolution(){
  let any=false;
  for(const c of evo.cars){ if(!c.done){ stepWorld(c); evo.totalSteps++; any=true; } }  // totalSteps = agent-steps of compute
  if(!any) nextGeneration();
}

// Deterministic re-run of the champion genome (reproduces the ideal line WITH balls).
const replay={active:false,car:null,hold:0};
function startReplay(){
  if(!evo.bestGenome){flash('No champion yet — let it train until it finishes a run.');return;}
  replay.car=makeCar(evo.bestGenome); replay.active=true; replay.hold=0;
  document.getElementById('modeTag').textContent='REPLAY BEST';
  document.getElementById('btnReplay').classList.add('on');
}
function stopReplay(){replay.active=false;document.getElementById('modeTag').textContent='EVOLVE';document.getElementById('btnReplay').classList.remove('on');}
function stepReplay(){
  const c=replay.car;
  if(c.done){ replay.hold+=DT; if(replay.hold>2.2){ replay.car=makeCar(evo.bestGenome); replay.hold=0; } return; }
  stepWorld(c);
}

let fld={s:1,x0:0,y0:0};                                // field-local -> screen
function layoutField(view){
  const padX=16, topPad=30, botPad=14;                  // reserve headroom for the over-field timer/counter
  const s=Math.min((view.w-2*padX)/FW,(view.h-topPad-botPad)/FH);
  fld.s=s; fld.x0=view.x+(view.w-FW*s)/2; fld.y0=view.y+topPad+(view.h-topPad-botPad-FH*s)/2;
}
const FX=x=>fld.x0+x*fld.s, FY=y=>fld.y0+y*fld.s;
function roundRect(x,y,w,h,r){G.beginPath();G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath();}

function drawField(){

  // wall (two solid segments, gap in the middle)

  G.beginPath(); G.moveTo(FX(GAP_L),FY(WALL_Y)); G.lineTo(FX(GAP_L),FY(0)); G.moveTo(FX(GAP_R),FY(WALL_Y)); G.lineTo(FX(GAP_R),FY(0)); G.stroke();
  G.fillStyle='rgba(68,255,170,.6)'; G.font=(11)+'px "Courier New",monospace'; G.textAlign='center';

function drawBall(b){

function drawRobot(r,bright){

  G.globalAlpha=bright?1:0.14;

function drawPath(path,color,width){

function compareTable(sx,ly,sw,lh){

/* ---- human ghosts imported from the real game (frcds-ghosts): overlay + real-time playback ---- */
function poseAt(sm,tau){
  if(!sm.length)return null;
  if(tau<=sm[0][0])return sm[0];
  const L=sm[sm.length-1]; if(tau>=L[0])return L;
  for(let i=0;i<sm.length-1;i++){ if(tau>=sm[i][0]&&tau<=sm[i+1][0]){
    const a=sm[i],b=sm[i+1],f=(tau-a[0])/((b[0]-a[0])||1);
    let dh=b[3]-a[3]; while(dh>Math.PI)dh-=2*Math.PI; while(dh<-Math.PI)dh+=2*Math.PI;
    return [tau,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f,a[3]+dh*f]; } }
  return L;
}
function drawGhostRobot(p,color){
  const s=fld.s;G.save();G.translate(FX(p[1]),FY(p[2]));G.rotate(p[3]);
  G.globalAlpha=.9;G.strokeStyle=color;G.lineWidth=2;G.beginPath();G.arc(0,0,RR*s*0.92,0,7);G.stroke();
  G.fillStyle=color;G.globalAlpha=.5;G.beginPath();G.moveTo(RR*s*0.85,0);G.lineTo(-RR*s*0.4,RR*s*0.5);G.lineTo(-RR*s*0.4,-RR*s*0.5);G.closePath();G.fill();
  G.globalAlpha=1;G.restore();
}
function drawHumanGhosts(){
  if(!showHuman||!humanGhosts.length)return;
  for(const hg of humanGhosts){
    G.strokeStyle=hg.color;G.globalAlpha=.45;G.lineWidth=1.5;G.setLineDash([2,4]);

    G.setLineDash([]);G.globalAlpha=1;
    const p=poseAt(hg.samples,Math.min(ghostClock,hg.t)); if(p)drawGhostRobot(p,hg.color);
  }

}

/* ---- telemetry panel: the AI's theoretical control inputs (analog + digital) ---- */
function barBip(x,y,barW,label,val,color,right){
  const h=9,cx=x+barW/2,v=clamp(val,-1,1);
  G.fillStyle='#6a6a88';G.font='10px "Courier New",monospace';G.textAlign='left';G.fillText(label,x,y-3);
  G.fillStyle='#15152a';roundRect(x,y,barW,h,3);G.fill();
  G.strokeStyle='#33335a';G.lineWidth=1;G.beginPath();G.moveTo(cx,y);G.lineTo(cx,y+h);G.stroke();
  G.fillStyle=color;
  if(v>=0)roundRect(cx,y+1,(barW/2)*v,h-2,2); else roundRect(cx+(barW/2)*v,y+1,(barW/2)*-v,h-2,2);
  G.fill();
  G.fillStyle='#cfe';G.font='bold 11px "Courier New",monospace';G.textAlign='right';G.fillText(v.toFixed(2),right,y+h);
}
function drawStick(cx,cy,rad,steer,thr){
  G.strokeStyle='#33335a';G.lineWidth=1.5;G.beginPath();G.arc(cx,cy,rad,0,7);G.stroke();
  G.strokeStyle='#22223a';G.lineWidth=1;G.beginPath();G.moveTo(cx-rad,cy);G.lineTo(cx+rad,cy);G.moveTo(cx,cy-rad);G.lineTo(cx,cy+rad);G.stroke();
  const kx=cx+clamp(steer,-1,1)*rad, ky=cy-clamp(thr,-1,1)*rad;      // throttle up = forward
  G.strokeStyle='rgba(68,255,170,.4)';G.beginPath();G.moveTo(cx,cy);G.lineTo(kx,ky);G.stroke();
  G.fillStyle='#44ffaa';G.beginPath();G.arc(kx,ky,5,0,7);G.fill();
}
// Per-drive control scheme → how to visualize the AI's outputs (bars, stick, keys) for THIS drive type.
function ctrlScheme(o){
  const OL=DRIVES[drive].outLab, dz=DEADZONE, m=DRIVES[drive].model;
  if(m==='tank'){ const st=o[0],th=o[1],L=clamp(th-st,-1,1),R=clamp(th+st,-1,1);
    return {bars:[{lab:'L track',val:L,col:'#44ffaa'},{lab:'R track',val:R,col:'#5aa8ff'}],
      sx:st,sy:th,rot:null,stickLab:'stick→tracks',keys:[['W',th>dz],['A',st<-dz],['S',th<-dz],['D',st>dz]]}; }
  if(m==='holoR'){
    return {bars:[{lab:OL[0],val:o[0],col:'#44ffaa'},{lab:OL[1],val:o[1],col:'#5aa8ff'},{lab:OL[2],val:o[2],col:'#ffce4d'}],
      sx:o[1],sy:o[0],rot:o[2],stickLab:'TRANSLATE',keys:[['W',o[0]>dz],['A',o[1]<-dz],['S',o[0]<-dz],['D',o[1]>dz]]}; }
  if(m==='holoF'){
    return {bars:[{lab:OL[0],val:o[0],col:'#44ffaa'},{lab:OL[1],val:o[1],col:'#5aa8ff'},{lab:OL[2],val:o[2],col:'#ffce4d'}],
      sx:o[0],sy:-o[1],rot:o[2],stickLab:'TRANSLATE',keys:[['W',o[1]<-dz],['A',o[0]<-dz],['S',o[1]>dz],['D',o[0]>dz]]}; }
  return {bars:[{lab:OL[0],val:o[0],col:'#44ffaa'},{lab:OL[1],val:o[1],col:'#5aa8ff'}],   // diff (arcade)
    sx:o[0],sy:o[1],rot:null,stickLab:'JOYSTICK',keys:[['W',o[1]>dz],['A',o[0]<-dz],['S',o[1]<-dz],['D',o[0]>dz]]};
}
function drawKeysArr(x,y,keys,rot){
  const ks=18,gp=3,c1=x+ks+gp;
  const key=(kx,ky,ch,lit)=>{G.fillStyle=lit?'#44ffaa':'#181830';roundRect(kx,ky,ks,ks,4);G.fill();
    G.strokeStyle='#33335a';G.lineWidth=1;G.stroke();G.fillStyle=lit?'#04120c':'#8a8ab0';G.font='bold 10px "Courier New",monospace';G.textAlign='center';G.fillText(ch,kx+ks/2,ky+ks/2+4);};
  key(c1,y,keys[0][0],keys[0][1]);key(x,y+ks+gp,keys[1][0],keys[1][1]);key(c1,y+ks+gp,keys[2][0],keys[2][1]);key(x+2*(ks+gp),y+ks+gp,keys[3][0],keys[3][1]);
  if(rot!=null){key(x+3*(ks+gp)+6,y,'Q',rot<-DEADZONE);key(x+3*(ks+gp)+6,y+ks+gp,'E',rot>DEADZONE);}
}
function outSpeed(o){const SS=SPD*sensitivity,m=DRIVES[drive].model;
  if(m==='holoR'||m==='holoF')return Math.hypot(o[0],o[1])*SS;
  if(m==='tank'){const L=clamp(o[1]-o[0],-1,1),R=clamp(o[1]+o[0],-1,1);return Math.abs((L+R)/2)*SS;}
  return Math.abs(o[1])*SS;}

  const OL=DRIVES[drive].outLab, cols=['#44ffaa','#5aa8ff','#ffce4d'];

/* ============================== MAIN LOOP ================================= */
const SPEEDS=[{lbl:'▶ 1×',n:1},{lbl:'▶ 4×',n:4},{lbl:'▶ 10×',n:10},{lbl:'⏩ 30×',n:30},{lbl:'⏩ MAX',n:150}];
let speedIdx=1, playing=true, showPaths=true;
function currentLeader(){
  let best=null;
  for(const c of evo.cars){ if(!best||c.fit>best.fit) best=c; }
  return best;
}
function frame(){
  requestAnimationFrame(frame);
  const SB=clamp(W*0.30,280,380);
  const fieldView={x:0,y:0,w:W-SB,h:H};
  layoutField(fieldView);
  // ---- simulate ----
  if(playing){
    const iters=SPEEDS[speedIdx].n;
    for(let k=0;k<iters;k++){ if(replay.active)stepReplay(); else stepEvolution(); }
  }
  // human-ghost real-time playback clock (synced to the champion in Replay, free-running otherwise)
  const _maxD=humanGhosts.reduce((m,g)=>Math.max(m,g.t),0);
  if(replay.active) ghostClock=replay.car.t;
  else if(playing && _maxD>0){ ghostClock+=DT*SPEEDS[speedIdx].n; if(ghostClock>_maxD+1.2)ghostClock=0; }
  // ---- draw ----
  G.fillStyle='#07070e'; G.fillRect(0,0,W,H);
  drawField();
  if(showOptimal) drawOptimalPath();                 // champion's ideal line, under everything
  if(showCompare) drawCompare();                     // overlay every saved run's ghost, colour-coded
  let leader;
  if(replay.active){
    leader=replay.car;
    if(showPaths) drawPath(leader.path,'rgba(68,255,170,.85)',2);
    for(const b of leader.balls) drawBall(b);
    drawRobot(leader.robot,true);
  }else{
    leader=currentLeader();
    // faint swarm of every robot (conveys the population), balls only for the leader
    for(const c of evo.cars) if(c!==leader) drawRobot(c.robot,false);
    if(leader){
      if(showPaths) drawPath(leader.path,'rgba(68,255,170,.8)',2);
      for(const b of leader.balls) drawBall(b);
      drawRobot(leader.robot,true);
    }
  }
  drawHUD(fieldView,leader);
  // telemetry panel in the left margin (below the stat stack), only when telemetry is on
  if(telemOn){
    const marginW=fld.x0-fieldView.x-16;
    if(marginW>=150){
      const tX=fieldView.x+12, tW=clamp(marginW,150,252), tY=fieldView.y+248, tH=Math.min(370,H-tY-14);
      if(tH>150) drawTelemetry(tX,tY,tW,tH, replay.active?replay.car:leader);
    }
  }
  // ---- sidebar ----
  const sx=W-SB+10, sw=SB-20;
  const netH=Math.min(H*0.40,290), graphH=Math.min(H*0.28,180);
  const brain=(replay.active?replay.car:leader);
  const inp=brain?senseSP(brain):new Array(NET[0]).fill(0);
  drawNet(replay.active?evo.bestGenome:(evo.bestGenome||(brain&&brain.genome)||randomGenome()), inp, sx,10,sw,netH);
  drawGraph(sx,10+netH+10,sw,graphH);
  const ly=10+netH+10+graphH+10, lh=H-ly-10;
  if(lh>60 && showCompare){
    compareTable(sx,ly,sw,lh);
  } else if(lh>60){
    panel(sx,ly,sw,lh,'LEADERBOARD — balls · time');
    G.font='11px "Courier New",monospace';G.textAlign='left';
    if(replay.active){
      G.fillStyle='#9a9ac0';
      const lines=['This is the fastest path the','evolution found — the AI\'s','ideal racing line through all','8 balls. Export it as a ghost','and load it into the real','game to race against it.'];
      lines.forEach((t,i)=>G.fillText(t,sx+10,ly+34+i*16));
    }else{
      const top=evo.cars.slice().sort((a,b)=>b.fit-a.fit).slice(0,Math.min(8,Math.floor((lh-30)/16)));
      top.forEach((c,i)=>{const yy=ly+34+i*16;
        G.fillStyle=(c===leader)?'#44ffaa':(c.done?(c.finishT!=null?'#8affc0':'#77778f'):'#c8c8e0');
        G.fillText('#'+(i+1),sx+10,yy);
        G.fillText(c.scored+'/8',sx+42,yy);
        G.fillText(c.finishT!=null?fmt(c.finishT):(c.done?'DNF':'…'+fmt(c.t)),sx+92,yy);
      });
    }
  }
}

function persistRuns(){try{localStorage.setItem('frcds_ai_runs',JSON.stringify(savedRuns));}catch(e){}}
function loadRuns(){try{const s=localStorage.getItem('frcds_ai_runs');if(s)savedRuns=JSON.parse(s)||[];}catch(e){savedRuns=[];}}
function saveRun(){
  if(!evo.bestGhost||!isFinite(evo.bestTime)){flash('No completed run yet — let the AI finish scoring all 8 first.');return;}
  const run={id:savedRuns.length+1,ts:new Date().toISOString(),drive:evo.championDrive,sens:evo.championSens,inputMode:evo.championMode,pop:evo.pop,mut:evo.mut,
    championGen:evo.championGen,steps:evo.championSteps,time:evo.bestTime,telem:evo.bestTelem||[],ghost:evo.bestGhost};

function exportData(){
  const runs=savedRuns.slice();
  if(evo.bestGhost&&isFinite(evo.bestTime)&&!runs.some(r=>r.time===evo.bestTime&&r.championGen===evo.championGen&&r.inputMode===evo.championMode&&r.drive===evo.championDrive)){
    runs.push({id:'current',drive:evo.championDrive,sens:evo.championSens,inputMode:evo.championMode,pop:evo.pop,mut:evo.mut,championGen:evo.championGen,steps:evo.championSteps,time:evo.bestTime,telem:evo.bestTelem||[],ghost:evo.bestGhost});
  }
  if(!runs.length){flash('No runs to export yet — finish a run (or 💾 Save Run) first.');return;}
  const rows=[['run_id','drive','sensitivity','input_mode','pop','mut','champion_gen','agent_steps','finish_time_s','t_s','x','y','heading_deg','ctrl0','ctrl1','ctrl2','speed_pxps','balls_scored']];
  let total=0;
  for(const r of runs){
    const dl=r.drive?DRIVES[r.drive].label:'', sn=r.sens||1;
    const tel=(r.telem&&r.telem.length)?r.telem:null;
    if(tel){ for(const s of tel){ rows.push([r.id,dl,sn,r.inputMode,r.pop,r.mut,r.championGen,r.steps||'',r.time,s[0],s[1],s[2],(s[3]*180/Math.PI).toFixed(1),s[4],s[5],s[6],s[7],s[8]]); total++; } }
    else if(r.ghost){ for(const g of r.ghost){ rows.push([r.id,dl,sn,r.inputMode,r.pop,r.mut,r.championGen,r.steps||'',r.time,g[0],g[1],g[2],(g[3]*180/Math.PI).toFixed(1),'','','','','']); total++; } }
  }
  downloadFile('driveshowdown_AI_runs_'+runs.length+'.csv','text/csv',rows.map(r=>r.join(',')).join('\n'));
  flash('Exported '+runs.length+' run(s), '+total+' telemetry rows → CSV (open in Excel / Google Sheets).');
}
function importGhostFile(text,filename){
  const d=JSON.parse(text); const src=d.ghosts||d; if(typeof src!=='object'||!src)return 0;
  const base=(filename||'').replace(/\.json$/i,'').replace(/^frc_ghosts_?/i,'').slice(0,18);
  let n=0;
  for(const [k,g] of Object.entries(src)){
    if(!g||!Array.isArray(g.samples)||typeof g.t!=='number')continue;
    humanGhosts.push({name:(base?base+'·':'')+k, key:k, t:g.t, samples:g.samples, color:HUMAN_PAL[humanGhosts.length%HUMAN_PAL.length]});
    n++;
  }
  return n;
}

function toggleHelp(on){document.getElementById('help').classList.toggle('show',on);}

/* ============================== TOOLTIPS ================================= */
const TIP=document.getElementById('tooltip');
function positionTip(mx,my){
  const r=TIP.getBoundingClientRect();let x=mx+14,y=my+16;
  if(x+r.width>window.innerWidth-8)x=mx-r.width-14;
  if(y+r.height>window.innerHeight-8)y=my-r.height-16;
  TIP.style.left=Math.max(6,x)+'px';TIP.style.top=Math.max(6,y)+'px';
}
function bindTips(){
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',e=>{TIP.innerHTML=el.getAttribute('data-tip');TIP.style.opacity='1';positionTip(e.clientX,e.clientY);});
    el.addEventListener('mousemove',e=>positionTip(e.clientX,e.clientY));
    el.addEventListener('mouseleave',()=>{TIP.style.opacity='0';});
  });
}

/* ============================== UI WIRING ================================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const wrap=document.getElementById('canwrap'); W=wrap.clientWidth; H=wrap.clientHeight;
  CV.width=Math.round(W*DPR); CV.height=Math.round(H*DPR); G.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
document.getElementById('btnPlay').onclick=function(){playing=!playing;this.textContent=playing?'⏸ Pause':'▶ Play';this.classList.toggle('on',playing);};
document.getElementById('btnSpeed').onclick=function(){speedIdx=(speedIdx+1)%SPEEDS.length;this.textContent=SPEEDS[speedIdx].lbl;};
document.getElementById('btnReset').onclick=function(){stopReplay();resetEvolution();flash('Evolution reset — fresh random population on the real single-player field.');};
document.getElementById('btnReplay').onclick=function(){if(replay.active)stopReplay();else startReplay();};
document.getElementById('btnDrive').onclick=function(){
  setDrive(DRIVE_ORDER[(DRIVE_ORDER.indexOf(drive)+1)%DRIVE_ORDER.length]);
  this.textContent='🚗 '+DRIVES[drive].label;
  stopReplay(); resetEvolution();
  flash('Drive type → '+DRIVES[drive].label+': '+DRIVES[drive].desc+'. Evolution restarted (💾 Save Run first to keep the old champion).');
};
document.getElementById('btnSens').onclick=function(){
  const opts=[1,1.5,2]; sensitivity=opts[(opts.indexOf(sensitivity)+1)%opts.length];
  this.textContent='⚙ '+sensitivity+'× sens';
  stopReplay(); resetEvolution();
  flash('Sensitivity → '+sensitivity+'× '+(sensitivity>1?'(faster & twitchier → a lower theoretical best time).':'(base game speed).')+' Evolution restarted.');
};
document.getElementById('btnInput').onclick=function(){
  inputMode=inputMode==='joystick'?'keyboard':'joystick';
  this.textContent=inputMode==='joystick'?'🎮 Analog':'⌨ Keyboard';
  stopReplay(); resetEvolution();
  flash('AI input model → '+(inputMode==='joystick'?'ANALOG (joystick), continuous — the theoretical fastest.':'KEYBOARD (digital), W/A/S/D on-off — usually a little slower.')+' Evolution restarted (💾 Save Run first to keep the old champion).');
};
document.getElementById('btnTelem').onclick=function(){
  telemOn=!telemOn; this.classList.toggle('on',telemOn);
  flash(telemOn?'Telemetry ON — recording the AI\'s control inputs.':'Telemetry OFF — nothing recorded, so training runs a touch faster. It never limited the AI\'s top speed; Input = Analog is that lever.');
};
document.getElementById('btnSaveRun').onclick=saveRun;
document.getElementById('btnCompare').onclick=function(){showCompare=!showCompare;this.classList.toggle('on',showCompare);};
document.getElementById('btnData').onclick=exportData;
document.getElementById('btnGhost').onclick=exportGhost;
document.getElementById('btnHelp').onclick=()=>toggleHelp(!document.getElementById('help').classList.contains('show'));
document.getElementById('pop').oninput=function(){evo.pop=+this.value;document.getElementById('popV').textContent=this.value;};
document.getElementById('pop').onchange=function(){if(!replay.active){seedPopulation(evo.pop);evo.gen=1;evo.hist=[];evo.totalSteps=0;evo.championSteps=0;spawnGeneration();flash('Population resized to '+evo.pop+' — restarting evolution.');}};
document.getElementById('mut').oninput=function(){evo.mut=+this.value/100;document.getElementById('mutV').textContent=evo.mut.toFixed(2);};
document.getElementById('pathToggle').onchange=function(){showPaths=this.checked;};
document.getElementById('optToggle').onchange=function(){showOptimal=this.checked;};
document.getElementById('humanToggle').onchange=function(){showHuman=this.checked;};
document.getElementById('btnImport').onclick=()=>document.getElementById('ghostFile').click();
document.getElementById('ghostFile').onchange=function(e){
  const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const n=importGhostFile(rd.result,f.name);
    if(n){showHuman=true;document.getElementById('humanToggle').checked=true;flash('Imported '+n+' human ghost'+(n>1?'s':'')+' — overlaying + playing back in real time. Toggle HUMAN to hide, or ⚖ Compare to rank vs the AI.');}
    else flash('No valid ghosts found in that file.'); }
    catch(err){ flash('Could not read that file — expected a ghost exported from Drive Showdown (frc_ghosts JSON).'); } };
  rd.readAsText(f); e.target.value='';
};
window.addEventListener('keydown',e=>{
  if(document.getElementById('help').classList.contains('show')&&e.key==='Escape'){toggleHelp(false);return;}
  if(e.target&&/input|textarea/i.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();document.getElementById('btnPlay').click();}
  else if(e.key==='r'||e.key==='R')document.getElementById('btnReplay').click();
  else if(e.key==='t'||e.key==='T')document.getElementById('btnTelem').click();
  else if(e.key==='i'||e.key==='I')document.getElementById('btnInput').click();
  else if(e.key==='c'||e.key==='C')document.getElementById('btnCompare').click();
  else if(e.key==='d'||e.key==='D')document.getElementById('btnData').click();
  else if(e.key==='?'||e.key==='/')toggleHelp(!document.getElementById('help').classList.contains('show'));
});

/* ---- boot ---- */
loadRuns(); buildHelp(); bindTips();
resize(); resetEvolution(); frame();
</script>
