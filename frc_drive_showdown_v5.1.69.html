  v5.1.57 (2026-06-15): TANK 3v3 — the 6-seat CLAIM GRID (finish 3v3 human, mixed CPU optional). Replaced the 2-card tank claim with a 2×3 seat grid (RED left / BLUE right): each cell is EMPTY / a HUMAN device / a CPU(+tier), with a per-seat DRIVE picker (◀▶) and ✕ release. Each side is independently 1–3 bots → 1v1/2v2/3v3 AND uneven 1v3/3v1/2v3, in any human/CPU mix (cap 3/side, ≥1/side to start). Up to 6 device binds (1 keyboard + gamepads + 2 touch halves): click a seat to select it, then press a key/pad (or +TOUCH) to claim it there; an unclaimed pad's face button claims the selected seat and its D-pad cycles that seat's drive once claimed; B releases, START launches. Live "RED: 2 humans + 1 CPU" readout. The ENEMY/ALLY TANKS settings rows are gone (the grid sets team composition; tankfight settings = FORMAT / LIVES-or-TIME / BEST OF / MAP). Drive picking is OPEN (repeats allowed); drive-diversity (no-repeat / per-team / per-category) is a future toggle. Wiring: m2.tseats[6] → tankGridToSeats() → tankRosterFromSeats(); startP2Tank maps seats → playerBind/m2.drive per seat; tournaments + 1v1 still use the legacy claim shim. smoke56 +12 (grid 2v2-mixed / 3v3 / 1v3 rosters, device dedup, canStart, draw-no-throw); tankfight row asserts re-baselined to 4 across smoke38/54/55/56 → smoke56 89. Grid render is eyeball-only (no-op canvas). Full battery green. Single file, no assets.
  v5.1.56 (2026-06-15): TANK 3v3 step 1 — seat model behind the roster (no behavior change yet). Refactored startP2Tank's roster build into two helpers: tankSeatsFromClaim() turns the current claim + ENEMY/ALLY-TANKS levers into per-side seat lists, and tankRosterFromSeats() turns per-side seat lists into the flat tank roster (skips empty seats; a side with none auto-fills one VETERAN CPU). This is the spine for the upcoming 6-seat claim grid: it already supports uneven sides and mixed human/CPU per side (1v3, 3v1, 2v2-with-a-CPU, etc.) — the only thing still gating that is the claim UI (next step). Behavior is identical today (the shim reproduces the legacy roster exactly; tank input/fire key off ctl.bind/side, not array order). smoke56 +8 (seat→roster for 1v1/mixed-2v2/1v3/3v1/empty-fill/null-skip + shim reproduces the legacy claim) → 77. Full battery green. Single file, no assets.
  v5.1.55 (2026-06-15): CAP CPU SPEED cheat — choose who the MAX SENSITIVITY boost applies to. The ball/shooter CPU couples its drive speed to the human opponent's sensitivity so it keeps pace at any setting — which meant cranking MAX SENSITIVITY also turbo-charged the CPU. New CAP CPU SPEED toggle: ON clamps the CPU's inherited sensitivity to the normal 2× ceiling so only YOU go super-fast; OFF (default) lets the CPU keep pace for everyone-is-fast chaos. (Tank/race/BattleBots CPUs never inherited the boost — they already stay at normal speed regardless of MAX SENSITIVITY.) Wired through a new cpuPaceSens(p) helper at the ball CPU pace site; TURN OFF ALL resets it. smoke54 +3 (chaos vs cap clamp, all-off resets it). Full battery green. Single file, no assets.
  v5.1.54 (2026-06-15): FIX — gamepad B on the PAUSE screen now RESUMES instead of quitting to the main menu. Pressing B while paused called pauseToMenu() (all the way back to the menu), an easy way to lose a match by accident; B is the universal back/cancel and the natural read is "close this overlay." B now just unpauses (same as Start); the MENU action is still available as an explicit item in the pause list (and on the endgame nav). Logic-only one-liner. Full battery green. Single file, no assets.
  v5.1.53 (2026-06-15): FIX — beating single-player with cheats on froze the game. On an SP course completion the done screen drew the saved best time, but a cheated run never saves a best (records are disabled), so best[k] was undefined and fmt(undefined) threw inside drawDone — and the rAF loop had no try/catch, so the thrown frame never re-armed requestAnimationFrame and the whole game locked up. (1) drawDone now falls back to THIS run's time (playT) when there's no saved best, and shows "⚠ cheats on — not recorded" instead of "Best time saved." (2) Hardened the main loop: update()/draw() run in a try/catch so a single bad frame can never hard-freeze the game again (it logs and re-arms rAF). smoke54 +1 (cheated SP completion: drawDone doesn't throw). Full battery green. Single file, no assets.
  v5.1.52 (2026-06-15): CHEAT MENU — EXIT + TURN-OFF-ALL BUTTONS, ICE MERGE, SLIDERS GROUPED. The Konami cheat panel now does a lot (sliders, multi-state toggles), so click-away alone felt risky. (1) Added a visible ✕ EXIT button (top-right) that closes the panel — Esc and gamepad B already closed it and tap-away still works; this is just an explicit affordance. (2) Added a ⟲ TURN OFF ALL CHEATS button (top-left, greens up when any cheat is on) that resets every cheat to default in one tap, leaving the panel open so you watch them clear. (3) Merged the old ICE SKATING toggle + ICE SLIP slider into ONE 'ICE SKATING' slider where 1.0× = OFF (no ice) and higher = more slide / less control (iceMode is now derived: on iff slip>1, fri=0.4/slip) — one control instead of two. (4) Re-laid the panel so all TOGGLE cheats sit in the LEFT column and all SLIDER cheats in the RIGHT column (was split by index), grouped by type for a cleaner read. smoke54 updated (ICE-merge + 1.0×=off, type-grouped fits check, EXIT closes, TURN-OFF-ALL clears every cheat). Full battery green. Single file, no assets.
  v5.1.51 (2026-06-15): MODE-PICKER DESCRIPTION WRAP. The 2P mode-select cards drew each mode's one-line `desc` centered at a fixed Y, so the longer BATTLEBOTS copy ("combat — ram the rear, guard your front") spilled past its card edge once the picker grew to 5 modes (~230px cards). The description now word-wraps to fit the card width (measureText against r.w−24) and the wrapped block is vertically centered, so a single-line desc stays exactly where it was (short descs byte-identical) while long copy flows onto a second line inside the card. Render-only (harness canvas is a no-op proxy); full battery green. Single file, no assets.
  v5.1.50 (2026-06-14): BATTLEBOTS — RAM/DASH (completes P1). The always-available RAM dash is now wired into BattleBots: LT (gamepad) / Shift (keyboard) fires a short forward burst (reuses BOOST dur/mul/cd, scaled by the RAM COOLDOWN cheat), multiplying translation so a dash-ram lands much more closing speed → more damage on the foe's rear/side. Human-only in P1; can't dash while immobilized (mobility 0). Per-bot boostT/boostCd, `bbDashHeld` reads LT/Shift. HUD hint updated. smoke57 +2 (dash engage + cooldown). Full battery green. Single file, no assets.
  v5.1.49 (2026-06-14): NEW MODE — BATTLEBOTS (P1: directional armor + two bars). A 5th 2P mode (`battlebots`, phase `p2bb`, `bb2` state) on the TANK FIGHT arena: a combat duel where positioning is everything. Every bot has a MOBILITY bar and an HP bar plus DIRECTIONAL ARMOR — keep your FRONT to the foe and kinetic ram hits are shrugged off; their REAR takes HP directly; their SIDE drains MOBILITY first (and once a bot's mobility hits 0 it's IMMOBILIZED — can't drive — and further side hits spill into HP). Damage = closing-speed (`p2ImpactMag`) × hit-location; brief per-contact cooldown; recoil knockback to both. KO (HP→0) = last side standing wins. P1 weapon is the always-on RAM (drive into their weak spots). Reuses the drive system (`withBot`/`getInp`/`obsCheck`), per-bot warm/cool team shades, the best-of series + result nav, and the new pause menu. A simple BattleBots CPU keeps its front to you while circling to your rear. HUD: per-bot MOBILITY + HP bars + a FRONT-armor arc indicator. The 2P mode picker now lays out N modes dynamically (was hard-coded to 4) + full gamepad nav. Settings: BEST OF + ARENA. Later phases (PRD_TABLED_MODES.md): weapons/loadouts (spinner/piston/flamethrower/wedge), hazards, flame blow-up, judges' decision, rumble. New smoke57 (23 asserts: mode wiring, hit-location, front-immune/rear-HP/side-mobility/spillover/immobile, mobility→speed, KO, draw-no-throw). Full battery green. Single file, no assets.
  v5.1.48 (2026-06-14): TANK 3v3 — ALLY TANKS + WARM/COOL PER-BOT RINGS (queue item 10, phase 1). (1) New ALLY TANKS lever (×0–2) on the TANK FIGHT MATCH SETTINGS adds CPU teammates to the player's side, composing with ENEMY TANKS to build 2v2 / 3v3 (e.g. you + 2 allies vs 3 CPUs). Ally CPUs inherit P1's drive (bind 0), each get their own brain (`cpuTankBrainsInit`), default to VETERAN tier (`allyTier`), and target the enemy side. In human-vs-human, ALLY TANKS gives each player CPU teammates. tallies=0 stays byte-identical 1v1. `cpuTierParams` refactored to `tierParamsByIdx` so a tank's brain uses its own `ctl.tier` (allies have no human bind); `cpuTankUpdate` now reads `me.ctl.tier`. (2) PER-BOT RING SHADES: teammates that share a drive base are now told apart by colour — side 0 wears a WARM family (red→orange→amber→rose, `TF2_RED_COLS`), side 1 a COOL family (blue→cyan→violet→teal, `TF2_BLUE_COLS`), each seat a distinct shade via `teamShade(side,idx)`; seat 0 keeps the classic red/blue so 1v1 is unchanged. Bullets/ring/tag/HUD all read the per-bot shade. NOTE phase 1: humans still limited to the 2 device binds (1 human + CPU allies, or 2 humans as rivals each with allies); a single TEAM SIZE lever + ≥3-human seats + claim-screen seat visualization is the next phase. smoke56 +13 (3v3 roster/sides, ally brains+drive+tier, enemy tier, warm/cool distinct shades, byte-identical default); smoke55/56 settings rows → 6. Full battery green. Single file, no assets.
  v5.1.47 (2026-06-14): PAUSE MENU — ENDGAME-STYLE NAV + TURN-RATE RATIO. (1) The pause overlay is no longer just RESUME/SETTINGS/QUIT — it now offers the same "how far back do you want to go" choices as the end-of-match screen: RESUME · RESTART (relaunch the current match/run) · SETUP (2P → claim screen) · MODE (mode select) · SETTINGS · MENU. Context-aware (SETUP only in 2P; SP shows RESTART/MODE/SETTINGS/QUIT). List-driven render + click + full D-pad/A/B/Start gamepad nav (B → menu). pauseResumeRect/pauseQuitRect kept (derive from the list) so existing tests/handlers hold. (2) TURN RATE knob: a rotation-vs-translation ratio stepper lives in the pause menu (◀▶ click or D-pad L/R, A resets to 1:1, persisted frcds_rot). The single simple sensitivity lever (slider + LB/RB bumpers) is unchanged; this just biases turn vs drive — `vr` is now scaled by `rotRatio` at the input return while translation stays on sensitivity. Pairs with the v5.1.46 MAX SENSITIVITY cheat so you can crank speed and still keep a sane turn rate. smoke54 +7 (pause nav items + destinations, RESTART, rotRatio scaling + stepper). Full battery green. Single file, no assets.
  v5.1.46 (2026-06-14): CHEATS — MAX SENSITIVITY (replaces DRIFT) + RAM COOLDOWN. The tabled/WIP DRIFT cheat is retired and replaced by two new Konami sliders. (1) MAX SENSITIVITY: uncaps the sensitivity ceiling — SENS_MAX is now a live `let` (base 2.0) that this slider raises to 2×–8×, so the normal SENS slider/bumpers (SP + per-player claim) can crank far past the old 2× wall; pair with the upcoming pause RATIO knob to keep extreme values drivable. (2) RAM COOLDOWN: scales the RAM dash cooldown `BOOST.cd` (0.1×–1×) at every boost trigger (ball + tank + race), so with RAMMING on you can spam the dash; the slider reads out the resulting seconds. Both taint records via `anyCheat()` (SENS_MAX!==base or ramCdMult!==1). DRIFT's `driftMode`/momModeFor wiring removed (ICE SKATING remains the lone momentum cheat; the MOM.drift infra is left dormant). smoke54 retargeted (DRIFT asserts → MAX SENSITIVITY + RAM COOLDOWN). Full battery green. Single file, no assets.
  v5.1.45 (2026-06-14): FRIENDLY FIRE TOGGLE. New FRIENDLY FIRE option in the ⚙ SETTINGS screen (opens from the main menu and from the pause overlay → "pause settings"), default OFF, persisted (frcds_ff). OFF = hits only land on the OPPOSING alliance/side (the long-standing behavior); ON = your own team is fair game too. One shared `friendlyFire` flag gates every contact/damage path it makes sense for: the tank bullet→tank collision and `tf2Explode` (their same-side skip is now `&&!friendlyFire`), the tank arcade RAM (`arcadeTackle` target list includes squadmates when ON), and the ball-mode arcade RAM (now also staggers your own main/support bots when ON). Note the enemy-side RAM in ball mode was already wired (`arcadeTackle` ran on `ballFoes`, which includes the opposing main + support bots) and the ram already scatters a victim's carried balls — FF just unlocks hitting your own side. Kill credit stays cross-side only, so a friendly-fire teamkill deals damage/eliminates but never scores (keeps TIMED kill counts honest). smoke56 +2 (same-side bullet damages with FF on, skipped with FF off). Full battery green. Single file, no assets.
  v5.1.44 (2026-06-14): SWERVE VISIBILITY — PODS ON TOP + LARGER SEE-THROUGH TEAM RING. Two visual tweaks (no physics change) so the swerve drive reads clearly — you can see all four pods steer to the same angle when translating and splay tangentially when the chassis spins. (1) The square/rectangular chassis body was painted AFTER the wheels, burying the corner swerve modules (they sit at ±0.7·RR, well inside the ±RR body). drawWheels is now a two-pass renderer: an UNDER pass draws every non-swerve drive as before, and a new OVER pass (called from drawRobot after the body) re-draws the swerve pods ON TOP of the chassis so all four are fully visible. Pod angle/spin state still advances once per frame (in the over pass). (2) The red/blue alliance team ring (p2AllianceRing) is kept dashed but is now a touch larger (r=RR+10→RR+13, sits further out and reveals more of the pods) and slightly see-through (dashed team-color stroke at ~0.72 alpha over a lighter dark underlay) — Sam's call from the preview (see-through, not a solid tint). Applies across ball/tank/race main bots. Full battery green (draw-only; harness canvas is a no-op proxy). Single file, no assets.
  v5.1.43 (2026-06-14): MULTI-TANK PHASE 3 — TIMED / MOST-KILLS (queue item 4 complete). TANK FIGHT MATCH SETTINGS gain a FORMAT lever: LIVES — last standing (the existing mode) or TIMED — most kills wins. In TIMED the LIVES PER TANK row becomes MATCH TIME (60/90/120/180s) and the match is a DEATHMATCH: every tank has infinite lives and always respawns, you rack up kills against the clock, and the side with the most kills when time expires wins. An exact tie enters SUDDEN DEATH — the next kill wins (golden-goal), per Sam's tie-break call. Kill scoring sums per side (tf2SideKills, built on the Phase-1 kill credit); tf2TimeUp decides the winner at expiry; tf2Damage routes the sudden-death golden kill. TIMED HUD: a center COUNTDOWN flanked by a live RED n – n BLUE kills scoreboard, and each tank card shows ☠kills instead of hearts (the ∞-lives guard from Phase 2 keeps the heart strip from blowing up). The result overlay reports the winning side, the KILLS line (w–l), and flags SUDDEN DEATH when it went to golden kill. LIVES mode is unchanged (still byte-identical at 1v1). This completes the 3-phase multi-tank item: ENEMY TANKS ×1–4 (Phase 2) compose freely with LIVES/TIMED (Phase 3) — e.g. 1 human vs 3 CPU, TIMED 120s. smoke56 +10 (FORMAT row swap, 5-row overflow guard, infinite-lives respawn, kill credit in TIMED, most-kills expiry, tie→sudden-death→golden kill); smoke55 updated for the new FORMAT row (5 rows). Full battery green. Single file, no assets.
  v5.1.42 (2026-06-14): MULTI-TANK PHASE 2 — ENEMY TANKS ×1–4 (queue item 4). The TANK FIGHT MATCH SETTINGS gain an ENEMY TANKS lever (×1–4) — face a whole squad of CPU tanks. Two teams: side 0 = the player(s), side 1 = the CPU squad. With a CPU claim, 1+ humans take on N enemy CPU tanks; two human claims stay legacy 1v1 rivals (the lever is ignored). The roster build spawns players down the LEFT column and the CPU squad down the RIGHT, Y-spread symmetric about mid (±120 / ±160,mid / ±180,±60), clamped in-bounds; tcpus=1 collapses to the exact legacy 1v1 spawn (byte-identical). Each CPU tank now carries its OWN brain (cpuTankBrainsInit → ctl.brain) so the squad thinks independently instead of moving in lockstep; every CPU inherits P2's drive (m2.drive[1]) and shares P2's claimed tier. NO FRIENDLY FIRE between squadmates (bullet + explosion skip same-side). Each enemy tank gets a distinct shade (TF2_CPU_COLS: blue/cyan/violet/teal) on its ring/tag/bullets; eliminated tanks leave the field. HUD stacks the player card(s) on the left and the squad's cards on the right; the LIVES win is decided by tf2CheckResult (last SIDE standing) and the result overlay shows the winning TEAM + survivors when >2 tanks. The CPU brain now keys its tier/drive/dodge off each tank's control bind (not its array index), so indices 2+ no longer read undefined. smoke56 +23 (N-tank roster/sides, independent brains, spawn fairness, distinct colors, squad no-friendly-fire, last-side-standing with 3 enemies, tcpus=1 byte-identical, 2-human rivals); smoke38/55 updated for the per-tank brain + the new ENEMY TANKS row. Phase 3 (TIMED / most-kills) is next. Full battery green. Single file, no assets.
  v5.1.41 (2026-06-14): MULTI-TANK PHASE 1 — ROSTER PLUMBING (behavior-identical at 2 tanks). Internal refactor toward "multiple enemy tanks + TIMED mode" (queue item 4). The tank engine no longer assumes exactly two tanks at indices 0/1: each tank now carries its own identity (side, ctl:{type,bind,tier}, kills, dead), and a set of roster helpers (tankCtl/tankSide/tankBrain/tankFoes/tankNearestFoe/tankFire/tankMgOn/withTank) resolve every per-tank value through that identity. All the 1v1-hardcoded loops were generalized to N tanks: cpuTankUpdate (each CPU targets its nearest live opposite-side foe; dodge skips same-side fire), updateP2Tank (per-tank update, pickup pickup, O(N²) tank-tank push, arcadeTackle), the bullet→tank collision (loops all tanks, skips dead & same-side = NO FRIENDLY FIRE; pierce damages each once and flies through), tf2Explode (damages every opposite-side tank in radius, owner side immune), tf2Shoot AUTO-AIM (nearest foe). New tf2Damage cascade adds kill credit + a dead flag; new tf2CheckResult decides LIVES (last side standing) — for 2 tanks the side index equals the tank index, so the result/HUD are byte-identical. No settings or visible behavior change yet (still 1v1); Phase 2 adds the ENEMY TANKS 1–4 lever + per-CPU brains, Phase 3 adds TIMED/most-kills. New smoke56 (21 asserts: roster model, helpers, kill credit, dead flag, last-side-standing, no-friendly-fire, side-aware explosion). Full battery green incl. smoke38/55. Single file, no assets.
  v5.1.40 (2026-06-14): PER-PUP SUB-SCREEN + SWERVE HOUSING REMOVED + PLOW SCALE FIX. (1) TANK FIGHT POWER-UPS: new per-pup sub-screen (⚡ POWER-UPS button on MATCH SETTINGS, replaces the old POW/HPK rows) lets you toggle each of the 7 pickups ON/OFF individually (puHp/puRapid/puSpeed/puShield/puExpl/puPierce/puAim keys, all true by default). tf2AllowedPups() now gates per-pup within the existing pow/hpk master flags (backward-compat: smoke38/55 still green). smoke55 +14 assertions (per-pup gating, sub-screen open/close/toggle). (2) SWERVE HOUSING REMOVED: the fixed housing square + corner pips around each swerve module are removed — only the animated rotating wheel and direction arrow remain, leaving the alliance ring clearly visible. (3) PLOW SCALE BUG FIX: PLOW_SEGS was a const array initialized once at startup; when ROBOT SIZE cheat changed RR, the collision geometry stayed at the original size. Now let PLOW_SEGS and setRobotScale() rebuilds it — plow contact is correct at 0.5×/1.5× robot scale. Full battery green. Single file, no assets.
  v5.1.39 (2026-06-14): ICE SLIP REWORK (direction fixed). The v5.1.36 'ICE GRIP' slider was backwards and too subtle. Replaced with 'ICE SLIP' (1×–5×, step 0.5, default 1× = the LOWEST/least-slide setting = the original fun glide, as requested): higher = MORE slipping/sliding. It drives MOM.ice.fri = 0.4/iceSlip, so 1×→0.40 (current feel) and 5×→0.08 (long uncontrollable glides) — a clearly perceptible range, in the right direction. Sits inline right under ICE SKATING in the cheat menu. smoke54 retargeted (ICE SLIP range + higher-slip-is-lower-friction). Full battery green. Single file, no assets.
  v5.1.38 (2026-06-14): ALLIANCE RING VISIBILITY (SWERVE) + DRIFT TABLED. (1) The red/blue team ring on the two main H2H bots was being drawn UNDER the bot body, so in swerve drives the light, drive-colored corner wheel-modules buried it (read as a 'light frame' hiding the alliance color). The ring now draws ON TOP of the bot, at a slightly larger radius (RR+10) that clears the module housings, with a dark underlay stroke so it pops against the light modules — works across ball/tank/race. (2) DRIFT cheat renamed 'DRIFT (WIP)' and tabled: its description now warns it's in development and doesn't really work yet (the slide-out-on-turns model needs rework). Pure render/label changes — full battery green. Single file, no assets.
  v5.1.37 (2026-06-14): CHEAT-MENU SLIDER DRAG + ALLIANCE SPEED UNIFIED. (1) Cheat-menu sliders (ICE GRIP, EXTRA BALLS, BALL/ROBOT SIZE) now CLICK-AND-DRAG, not just click-to-set — drag wired for mouse and touch (konamiDrag state + shared applyKonamiSlider helper); the konami menu also now takes touches from any phase (mid-match drag works on mobile). (2) The MATCH SETTINGS 'ALLIANCE CPU SPEED' slider is now the SAME value as the 'SPEED' slider inside ALLIANCE CPU AI (both edit cpuSpeedMult) — no more two conflicting speeds; range 0.25–3.0 in 0.25 steps, DEFAULT 100% (was a separate 0.4–1.2 allySpd defaulting to 80%). Slider rows gained optional get/set binding (setRowGet/setRowSet) so a row can drive a global var. RESET DEFAULTS also returns the speed to 100%. smoke54 +5 (ICE GRIP slider range + drag-set + non-slider guard); smoke52 retargeted to cpuSpeedMult (26). Full battery green. Single file, no assets.
  v5.1.36 (2026-06-14): GLOBAL SETTINGS MENU + ICE GRIP SLIDER + PAUSE GAMEPAD NAV. (1) New ⚙ SETTINGS screen (phase='settings'): opens from the main menu (bottom-right button) and from the pause overlay. Houses Sound toggle (sfxOn/sfxToggle), Mouse-Aim toggle (mouseAim/toggleMouseAim), and a link to CPU AI Settings (cpuSettingsReturn='settings'). Back returns to caller (menu or resumes the paused game). Full D-pad + A/B/Esc gamepad nav. (2) ICE GRIP slider added to the cheat menu (after ICE SKATING): drag left for max slide (default 0.40, the original fun level), right for more traction up to 2.50. Mutates MOM.ice.fri live. (3) Pause menu gamepad nav: D-pad up/down now highlights RESUME / SETTINGS / QUIT (yellow dashed ring). A activates the focused button; Start always resumes; B quits. DRIFT description updated to note it works in all modes. Full battery green. Single file, no assets.
  v5.1.18 (2026-06-14): PISTON RUN RACE-CPU FIX + RAMMING ON RIGHT BUMPER. (1) On the PISTON RUN race course with MOVING HAZARDS on, the H2H race CPU froze at the start (it climbed ~6px and stopped). Cause: the moving-wall trajectory probe looked 0.72s ahead and a piston permanently occupied the lane ahead, so the bot held forever from across the course. Fix: it now only holds when impact is imminent (≤0.30s), climbing to the rim; and at the rim it DODGES laterally — scanning the static gap for a column whose climb-path clears soon and punching through — which solves the shelf+piston compound crossing the CPU previously couldn't (hands-off CHAMPION now finishes PISTON RUN with hazards on). (2) RAMMING boost-tackle moved from Right Trigger to RIGHT BUMPER (gamepad), so it no longer collides with RT fire — you can RAM and MACHINE-GUN at once in tank; RT/A still fire (RT is no longer stolen for boost). Keyboard boost stays on Shift. Full battery green. Single file, no assets.
  v5.1.17 (2026-06-14): MACHINE-GUN CRASH FIX + CHEAT-MENU CONTROLLER/LAYOUT + MG TRI-STATE + 2P FRISBEE VISUAL. (1) CRASH FIX: with MACHINE GUN on (shooter), the bot's hopper exceeds 4, and the shooter MAG HUD did '○'.repeat(4-len) — a negative count throws RangeError in the browser ('Invalid count value') and crashes the render. The harness never caught it because its canvas mock no-ops; the real browser does not. Clamped that repeat and hardened the other HUD repeat()s (series dots, SP tank HP). (2) MACHINE GUN is now a 3-state toggle OFF / YOU / BOTH — YOU gives full-auto only to the human side(s), BOTH to everyone (so the CPU opponent doesn't have to get it). (3) Cheat menu CONTROLLER nav: the left stick (and hat) now move/adjust/select in the menu, not just the D-pad (same gap as the konami-entry fix) — the joystick couldn't navigate it before. (4) Cheat menu LAYOUT: with five cheats the rows now collided with the rambots/instagram link buttons and the description; the Stussy logo moved up & smaller, rows start higher, the focused-cheat description has its own clear brighter line, and the link buttons flow below it (no overlap). (5) ULTIMATE ASCENT now renders flying 2P-shooter shots as 🥏 frisbees (2P only tinted them before; the SP path already did). smoke54 +5 (MG hopper crash-regression, MG tri-state OFF/YOU/BOTH). Full battery green. Single file, no assets.
  v5.1.16 (2026-06-14): SILENT SINGLE-PLAYER + RESET DEFAULTS + SMALLER TEAM RING + STRONGER TANK DODGE + RACE TIME-COMPARE. (1) Single-player is now fully silent: sfx() only fires during 2P (H2H) phases, so the SP menu, SP gameplay (shoot blip, bumps), and the SP results screen make no sound; the menu/2P mute toggle and [M] still govern 2P SFX. (2) RESET DEFAULTS button on the 2P MATCH SETTINGS screen (bottom-right, mirrors ALLIANCE CPU AI) restores all match settings to M2_SET_DEFAULTS — clickable, touchable, and in the gamepad nav ring. The defaults are now a shared const. (3) The red/blue team ring on the two MAIN H2H bots is back to a clean DASHED ring just outside the chassis (RR+7, like the alliance-bot ring) instead of the oversized plow-encircling disc from v5.1.10. (4) Tank-fight bullet dodge is WAY stronger at CHAMPION and trickled down every tier (scaled by sharpness): it now commits hard to the single most-imminent threatening bullet with a perpendicular sidestep whose urgency rises as the shot nears (CHAMPION sees ~408px out, ~101px lateral catch, sidesteps ~4×), so a sharp tank reliably clears fire instead of drifting into it; lower/adaptive tiers still flinch. (5) H2H OBSTACLE RACE no longer ends the instant the first racer finishes — both racers complete and the LOWER finish time wins (the slower racer gets a recorded time, not an automatic DNF). The laggard DNFs only if it exceeds DOUBLE the first finisher's time, so an idle/stuck bot can't stall the match. smoke52 +1 (reset defaults); smoke38's race now exercises the 2× DNF path. Full battery green. Single file, no assets.
  v5.1.15 (2026-06-14): PER-MODE CPU TIER TABLES. Splits the single shared tier table into per-mode tables so tuning one mode no longer disturbs the others: CPU_TIERS stays the canonical ball table (names, claim picker, ease lever, plow arrays all key off it) and CPU_TIERS_SHOOTER/TANK/RACE are clones selected by the current mode via modeTiers(); cpuTierParams now reads the active mode's table. Ball/tank/race are behavior-preserving (identical clones, ready to tune). SHOOTER is tuned now: CHAMPION and WINNER regain a top-tier speed edge (1.15/1.04) that the normal-ball speed clamp had removed — the clamp is mode-aware so shooter allows the edge while normal ball still caps every tier at the player's drive speed. The adaptive band (CPU_ADLO/ADHI) is shared across modes for now. smoke54 +1 (per-mode: shooter CHAMPION edge vs normal clamp). Full battery green. Single file, no assets.
  v5.1.14 (2026-06-14): SP MUTE PILL REMOVED. Single-player has no SFX wired (the only SP sound is the shooter launch blip), so the on-HUD speaker pill served no purpose and overlapped the score/ball counter (ball), the tank-fight HUD, and the obstacle HUD. Removed the pill from all three SP HUDs (drawHUD/drawTFHUD/drawOCHUD) and the SP click/touch toggles for it; the [M] hotkey and the menu / 2P-setup mute button (where SFX actually play) are unchanged. Full battery green. Single file, no assets.
  v5.1.13 (2026-06-14): SHOOTER CHEATS FIXED + MACHINE GUN + EXTRA BALLS (cheat menu). All cheats are independent and stack freely. (1) BOUNCY BALLS and ULTIMATE ASCENT now actually affect 2P shooter: the H2H field is so narrow that shots always hit a wall before the old 230px range cap, so neither was visible. Shots fired with either cheat now RICOCHET off the non-scoring walls (gaps still score) instead of dying — ULTIMATE ASCENT keeps them alive indefinitely, BOUNCY makes them pinball. (2) NEW cheat MACHINE GUN: full-auto fire in BOTH 2P tank (reload ~0.05s) and 2P shooter (shootCd ~0.05s, a big 99-shot hopper, and a faster ~480px/s muzzle), with a per-shot rumble. (3) NEW cheat EXTRA BALLS: a slider (1x-6x, ◀▶ on keyboard/gamepad or click/drag the track) that multiplies the balls in play in 2P ball+shooter (capped at 72). The cheat menu now supports slider rows alongside the on/off toggles. New suite smoke54 (5 asserts: extra-balls multiply, machine-gun hopper+rapid fire in shooter and tank, ricochet survival with stacked cheats). Full battery green. Single file, no assets.
  v5.1.12 (2026-06-14): CLASSIC COURSE SWEEPER REMOVED + CHAMPION TANK DODGE + SETUP CARD FIT. (1) The CLASSIC race course no longer has a sweeper hazard (it is now the plain obstacle course; sweepers live in SWEEPER ALLEY). (2) CHAMPION tank bullet-dodging was too easy to beat: the sharp-tier dodge now scales its detection range, lateral catch width, and sidestep strength with tier sharpness, so CHAMPION sees shots ~337px out, reacts to ~54px near-misses, and sidesteps ~2.7x (WINNER roughly unchanged). (3) The 2P setup card was trimmed (height 548->516) so it no longer overlaps the START / ADD-CPU / SWAP buttons along the bottom. Full battery green. Single file, no assets.
  v5.1.11 (2026-06-14): SKILL-TIER REWORK (5->4). Retires the FINALIST label and shelves the weak fixed ROOKIE and the old VETERAN (target 1.2) brains (both kept commented for easy revert). The four selectable tiers are now: ROOKIE = the old FINALIST adaptive brain (plays you dead-even) PLUS a defense back-off lever — once it has scored ~3 it eases off (retreats clear of its gap, stops scoring) unless the player is up by 2+, so a beginner ultimately wins; VETERAN (NEW DEFAULT) = the same old FINALIST brain with NO back-off, a true even, beatable, fun match; WINNER and CHAMPION unchanged. All tier-indexed data moved to four entries — CARRY_CAP [2,2,3,5], capture reach/lateral, the per-tier movement-drop — and the claim stepper, the default CPU pick (now VETERAN), and the all-tiers achievement now key off CPU_TIERS.length. NOTE: tiers are shared across ball/tank/race, so in race/tank the new ROOKIE is the competent adaptive brain (the ball-only back-off does not apply there) — by design. Suites re-baselined for the 4-tier layout (smoke38/40/42/43/45/46/47/48/50; smoke53 rewritten, 9 asserts). Full battery green; own goals zero at every tier; CHAMPION still clears 30+/90s. Single file, no assets.
  v5.1.10 (2026-06-14): ALLIANCE CPU SPEED SLIDER + BIGGER TEAM RINGS + ROOKIE BALL SPEED. (1) ALLIANCE SKILL (a tier-name stepper that only changed speed) is replaced by an ALLIANCE CPU SPEED slider on the MATCH SETTINGS screen — a real draggable track (click anywhere on it or grab-and-drag), mouse + touch + gamepad ◀▶, 40%–120% of the player's drive speed in 5% steps (default 80%), matching the claim-screen sensitivity slider. It sets m2.set.allySpd directly (the alliance support bots run at that fraction). (2) The red/blue team rings on the two MAIN H2H bots (human and CPU alike) are much bigger — radius RR+44, large enough to encircle the bot AND its plow/scoop — so it's always clear which side a robot is on. (Alliance support bots keep their small dashed ring.) (3) ROOKIE ball speed 0.42->0.55 (it was a touch too easy); scoped to ball mode via a new ballSpd field so race/tank ROOKIE keep 0.42 and the race ROOKIE-is-slower invariant holds. smoke52 +5 (slider: row type, drag-to-set, min/max clamp, click-sets-no-dropdown). Full battery green; own goals zero at every tier. Single file, no assets.
  v5.1.9 (2026-06-14): ROOKIE SCORING FLOOR + ALLIANCE CPU AI LINK. (1) ROOKIE rubberband now has a small scoring FLOOR: it plays normal (weak) offense until it has scored ~3 goals, THEN eases off (the v5.1.8 ease-off otherwise left it fully idle and a 0-0 game possible if the kid also did nothing). It still eases as soon as it's past the floor and not behind by ~4, so kids still build a comfortable lead — it's just no longer completely passive. (2) ALLIANCE CPU AI now reachable from 2P: a new "⚙ ALLIANCE CPU AI" button on the MATCH SETTINGS screen (ball modes only, where alliance support bots exist) opens the shared CPU-behavior settings (disrupt/guard balance, standoff, speed, presets) and the Back button returns you to MATCH SETTINGS instead of the SP menu; gamepad-navigable (it joins the settings focus ring, B/Back returns too). Note: ALLIANCE SKILL stays as-is — it scales the alliance bots' drive speed; the new link is where you tune their brain. smoke52 +4 asserts (open/return nav, ball-mode gating); smoke53 ROOKIE asserts re-baselined for the floor (11). Full battery green; own goals zero at every tier. Single file, no assets.
  v5.1.8 (2026-06-14): GAMEPAD KONAMI (JOYSTICK) + CHAMPION SPEED CLAMP + RUBBERBAND. (1) The gamepad Konami code now reads directions from the LEFT STICK and the 8-way hat axis, not just the D-pad buttons (12-15) — it was only watching the D-pad, so entering it on the joystick did nothing. A(0)/B(1) unchanged; works on Xbox/PlayStation under the standard mapping regardless of how the pad reports the D-pad. (2) CHAMPION speed/turn edge REMOVED: spd/turn 1.12 -> 1.00, clamped to the player like every other tier (the edge read as obviously unfair). Difficulty now rests on reactions, aim, the 5-ball carry, and zero lapses — hands-off CHAMPION still clears ~35 goals/90s vs a passive opponent, zero own goals. (3) RUBBERBANDING via ease-off (adaptive low tiers): ROOKIE eases off — retreats to its own half clear of its gap and stops scoring — UNLESS the player is already up ~4 goals, so kids reliably build a comfortable lead and win; VETERAN eases off whenever IT goes up by 2+, letting the player catch up for a back-and-forth game. The eased bot hugs a side wall away from its gap mouth so it NEVER blocks the opponent (that would defeat the catch-up). FINALIST/WINNER/CHAMPION never ease (FINALIST left alone pending playtest). New suite smoke53 (rubberband, 10 asserts: ROOKIE/VETERAN ease thresholds + clear-of-gap + FINALIST/CHAMPION never ease); smoke40 re-baselined for the CHAMPION clamp. Full battery green; own goals zero at every tier. Single file, no assets.
  v5.1.7 (2026-06-14): KONAMI-ANYWHERE + RAMMING TUNING + BOUNCY FAIRNESS. (1) The Konami code now opens the cheat menu from ANY screen (menu, 2P setup, mid-match) — keyboard sequence is tracked in every phase, the menu renders as a top overlay, gameplay FREEZES while it's open, and closing it returns you exactly where you were (phase never changes). Gamepad already worked anywhere. (2) ARCADE MODE renamed RAMMING, and it's now HUMAN-ONLY — the CPU never rams (it was too effective); tackle stun trimmed 2.0s->1.2s. (3) BOUNCY BALLS fairness: the CPU loses its sticky plow (push-only) and cannot ram in bouncy mode, so it no longer hoards balls in the chaos. (4) MATCH SETTINGS rows: the ◀ cycle hint is now positioned by the value's text width, so long values (e.g. 'AUTO — scales with bots') no longer cover it. smoke51 now also asserts the CPU never rams (10 asserts). Full battery green. Single file, no assets.
  v5.1.6 (2026-06-14): REVERT CHAMPION DEFENSE GOALIE. The v5.1.4 goalie-defense branch is removed — in playtest it pulled CHAMPION off offense to get stuck defending, LOWERING its scoring (a 40-38 player win). Main CPU bots are pure offense again. The other two CHAMPION buffs stay: the top-tier speed edge (spd/turn 1.12, past the player cap) and the higher AUTO ball count. (Defense may return later as a RUBBERBANDING behavior for the adaptive tiers when they're ahead, not as a fixed-tier buff.) smoke43 re-baselined to the pure-offense own-goal-safety check; own goals 0 at every tier. Full battery green. Single file, no assets.
