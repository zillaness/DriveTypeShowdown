}

function draw(){drawInner();if(paused)drawPause();drawAchToast();}
function drawInner(){
  ctx.setTransform(C._dpr||1,0,0,C._dpr||1,0,0);
  ctx.fillStyle='#07070e';ctx.fillRect(0,0,CW,CH);
  if(konamiActive){drawKonami();return;} // cheat menu overlays from ANY screen; closing returns you here (phase is unchanged)
  if(phase==='holoMenu'){drawHoloMenu();return;}
  if(phase==='steerMenu'){drawSteerMenu();return;}
  if(phase==='highscores'){drawHighScores();return;}
  if(phase==='ghosts'){drawGhosts();return;}
  if(phase==='achievements'){drawAchievements();return;}
  if(phase==='layoutPreview'){drawLayoutPreview();return;}
  if(phase&&phase.indexOf('p2')===0){p2Draw();p2Overlays();return;}
  if(phase==='settings'){drawSettings();return;}
  if(phase==='cpuSettings'){drawCpuSettings();return;}
  if(phase==='menu'){drawMenu();if(gpShowMap)drawControllerMap();return;}
  if(phase==='results'){drawResults();return;}
  if(tankFight){drawTankFight();return;}
  if(obstacleCourse){drawObstacleCourse();return;}
  drawField();drawWall();drawBalls();
  if(cpuRobots.length)cpuRobots.forEach(drawCPURobot);
  drawSpGhost();
  if(robot)drawRobot();
  drawProjectiles();
  drawHUD();
  drawJoysticks();
  if(phase==='countdown')drawCD();
  if(phase==='done')drawDone();
}

function drawField(plain){
  ctx.save();ctx.translate(FX,FY);
  ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,FW,FH);
  // Grid
  ctx.strokeStyle='#14221488';ctx.lineWidth=1;
  for(let x=0;x<=FW;x+=46){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,FH);ctx.stroke();}
  for(let y=0;y<=FH;y+=46){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(FW,y);ctx.stroke();}
  const wY=inverted?FH-WALL_Y:WALL_Y;
  if(plain){ // mirrored 2P draws its own zones/labels — skip the SP top/bottom decorations
    ctx.strokeStyle='#1e3a1e';ctx.lineWidth=4;ctx.strokeRect(0,0,FW,FH);
    ctx.restore();return;
  }
  // Zone tints
  if(inverted){
    ctx.fillStyle='rgba(20,80,255,0.04)';ctx.fillRect(0,0,FW,wY);
    ctx.fillStyle='rgba(255,60,40,0.04)';ctx.fillRect(0,wY,FW,FH-wY);
  }else{
    ctx.fillStyle='rgba(255,60,40,0.04)';ctx.fillRect(0,0,FW,wY);
    ctx.fillStyle='rgba(20,80,255,0.04)';ctx.fillRect(0,wY,FW,FH-wY);
  }
  // Border
  ctx.strokeStyle='#1e3a1e';ctx.lineWidth=4;ctx.strokeRect(0,0,FW,FH);
  // Labels
  ctx.font='12px Courier New';ctx.textAlign='center';
  if(inverted){
    ctx.fillStyle='rgba(60,100,255,0.28)';ctx.fillText('↑  PUSH FROM HERE  ↑',FW/2,wY/2+6);
    ctx.fillStyle='rgba(255,80,60,0.28)';ctx.fillText('↓  SCORING ZONE  ↓',FW/2,FH-16);
  }else{
    ctx.fillStyle='rgba(255,80,60,0.28)';ctx.fillText('↑  SCORING ZONE  ↑',FW/2,wY/2+6);
    ctx.fillStyle='rgba(60,100,255,0.28)';ctx.fillText('↓  PUSH FROM HERE  ↓',FW/2,FH-16);
  }
  ctx.restore();
}

function drawWall(){
  ctx.save();ctx.translate(FX,FY);
  const wY=inverted?FH-WALL_Y:WALL_Y;
  const wy=wY-WALL_H/2;
  const arr=inverted?'↓':'↑';
  // Wall segments (left and right of gap)
  ctx.fillStyle='#b4bcc8';
  ctx.fillRect(0,wy,GAP_L,WALL_H);
  ctx.fillRect(GAP_R,wy,FW-GAP_R,WALL_H);
  // Subtle edge highlight
  ctx.strokeStyle='rgba(200,215,255,0.45)';ctx.lineWidth=1;
  ctx.strokeRect(0,wy,GAP_L,WALL_H);ctx.strokeRect(GAP_R,wy,FW-GAP_R,WALL_H);
  // Gap dashed line
  ctx.strokeStyle='#00e87888';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(GAP_L+2,wY);ctx.lineTo(GAP_R-2,wY);ctx.stroke();
  ctx.setLineDash([]);
  // Gap arrow
  ctx.fillStyle='#00e878';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
  ctx.fillText(arr,(GAP_L+GAP_R)/2,wY+7);
  // Gap bracket marks
  ctx.strokeStyle='#00e87855';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GAP_L,wY-20);ctx.lineTo(GAP_L,wY+20);
  ctx.moveTo(GAP_R,wY-20);ctx.lineTo(GAP_R,wY+20);ctx.stroke();
  ctx.restore();
}

function drawBalls(){
  ctx.save();ctx.translate(FX,FY);
  for(const b of balls){
    if(b.intaken||b.proj)continue;
    ctx.globalAlpha=b.sc?0.3:1;
    if(frisbeeMode&&shooterMode){
      // Frisbee emoji replace
      ctx.font=(BR*2.2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🥏',b.x,b.y);
      ctx.textBaseline='alphabetic';
    }else{
      // Shadow
      ctx.beginPath();ctx.arc(b.x+2,b.y+3,BR,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fill();
      // Body gradient
      const g=ctx.createRadialGradient(b.x-BR*0.3,b.y-BR*0.35,BR*0.08,b.x,b.y,BR);
      g.addColorStop(0,'#fff59d');g.addColorStop(0.4,'#ffe000');g.addColorStop(1,'#d84000');
      ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      // Gloss
      ctx.beginPath();ctx.arc(b.x-BR*0.32,b.y-BR*0.38,BR*0.21,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.38)';ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}


// ── Wheel animation ──
// ── Wheel drawing helpers ──────────────────────────────────────────
function drawTrack(x1,x2,y,spin,color){
  const h=6;
  ctx.fillStyle='#0d0d1a';ctx.fillRect(x1,y-h/2,x2-x1,h);
  ctx.strokeStyle=color+'55';ctx.lineWidth=0.8;
  const sp=5,off=((spin*4)%sp+sp)%sp;
  for(let tx=x1+off;tx<x2;tx+=sp){
    ctx.beginPath();ctx.moveTo(tx,y-h/2);ctx.lineTo(tx,y+h/2);ctx.stroke();}
  ctx.strokeStyle=color+'99';ctx.lineWidth=1.2;ctx.strokeRect(x1,y-h/2,x2-x1,h);
}
// Swerve module: prominent housing + rotating wheel + direction arrow
function drawSwerveWhl(cx,cy,dir,spin,color){
  ctx.save();ctx.translate(cx,cy);
  // Rotating wheel assembly (no housing — only the animated wheel + direction arrow)
  ctx.rotate(dir);
  ctx.fillStyle='#111';ctx.fillRect(-10,-4.5,20,9);
  ctx.strokeStyle=color+'55';ctx.lineWidth=0.9;
  const sp=4,off=((spin*3)%sp+sp)%sp;
  for(let tx=-10+off;tx<10;tx+=sp){
    ctx.beginPath();ctx.moveTo(tx,-4.5);ctx.lineTo(tx,4.5);ctx.stroke();}
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(-10,-4.5,20,9);
  // Bright direction arrow extending beyond housing
  ctx.strokeStyle=color;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(14,0);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(10,-4);ctx.lineTo(10,4);ctx.closePath();ctx.fill();
  ctx.restore();
}
// Mecanum: wheel body aligned with robot forward (0°), diagonal rollers at ±45°
// rollerDir: +1 = / rollers (FL+BR), -1 = \ rollers (FR+BL)
function drawMecanumWhl(cx,cy,rollerDir,spin,color){
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#0d0d1a';ctx.fillRect(-9,-5,18,10);
  // Clip rollers to wheel rectangle
  ctx.save();
  ctx.beginPath();ctx.rect(-9,-5,18,10);ctx.clip();
  ctx.rotate(rollerDir*Math.PI/4);
  ctx.strokeStyle=color+'77';ctx.lineWidth=1.2;
  const sp=5,off=((spin*3)%sp+sp)%sp;
  for(let tx=-20+off;tx<20;tx+=sp){
    ctx.beginPath();ctx.moveTo(tx,-14);ctx.lineTo(tx,14);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle=color+'cc';ctx.lineWidth=1.8;ctx.strokeRect(-9,-5,18,10);
  ctx.restore();
}
// Omni wheel: barrel-roller circles, axle oriented along ang
function drawOmniWhl(cx,cy,ang,spin,color){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.fillStyle='#0d0d1a';ctx.fillRect(-8,-4,16,8);
  ctx.strokeStyle=color+'55';ctx.lineWidth=0.9;
  const sp=4,off=((spin*3)%sp+sp)%sp;
  for(let tx=-8+off;tx<8;tx+=sp){
    ctx.beginPath();ctx.arc(tx,0,1.8,0,Math.PI*2);ctx.stroke();}
  ctx.strokeStyle=color+'bb';ctx.lineWidth=1.8;ctx.strokeRect(-8,-4,16,8);
  ctx.restore();
}
// ── Main wheel dispatch ─────────────────────────────────────────────
function drawWheels(inp,layer){
  const id=curDrv().id;
  const col=(curDrv()).c;
  const S=0.065,M=6284;
  const swerve=(id==='botSwerve'||id==='fieldSwerve');
  if(layer==='over'){ // swerve modules render ON TOP of the chassis so the body can't bury the pods (v5.1.44)
    if(!swerve)return;
    const cosH=Math.cos(robot.h),sinH=Math.sin(robot.h);
    const vlx= inp.vx*cosH+inp.vy*sinH;
    const vly=-inp.vx*sinH+inp.vy*cosH;
    const cx=[RR*0.7,RR*0.7,-RR*0.7,-RR*0.7];
    const cy=[-RR*0.7,RR*0.7,-RR*0.7,RR*0.7];
    for(let i=0;i<4;i++){
      const vxc=vlx-cy[i]*inp.vr,vyc=vly+cx[i]*inp.vr;
      const mag=Math.hypot(vxc,vyc);
      if(mag>2)swerveMods[i].d=Math.atan2(vyc,vxc);
      swerveMods[i].s=(swerveMods[i].s+mag*S+M)%M;
      drawSwerveWhl(cx[i],cy[i],swerveMods[i].d,swerveMods[i].s,col);
    }
    return;
  }
  if(swerve)return; // swerve pods are deferred to the 'over' pass (drawn after the body)
  if(id==='tank'||id==='arcade'){
    const lv=inp.vx-inp.vr*RR*0.7,rv=inp.vx+inp.vr*RR*0.7;
    wSpin.l=(wSpin.l+lv*S+M)%M; wSpin.r=(wSpin.r+rv*S+M)%M;
    drawTrack(-RR+1,RR-1,-(RR+3),wSpin.l,col);
    drawTrack(-RR+1,RR-1,(RR+3),wSpin.r,col);
  }else if(id==='mecanum'){
    // Wheel bodies parallel to robot (+x forward). Rollers: FL+BR = / (+1), FR+BL = \ (-1)
    const ws=[[RR*0.6,-(RR+2), 1],[RR*0.6,(RR+2),-1],
              [-RR*0.6,-(RR+2),-1],[-RR*0.6,(RR+2), 1]];
    const spd=[inp.vx-inp.vy-inp.vr*RR*0.5,inp.vx+inp.vy+inp.vr*RR*0.5,
               inp.vx+inp.vy-inp.vr*RR*0.5,inp.vx-inp.vy+inp.vr*RR*0.5];
    for(let i=0;i<4;i++){
      holoSpin[i]=(holoSpin[i]+spd[i]*S+M)%M;
      drawMecanumWhl(ws[i][0],ws[i][1],ws[i][2],holoSpin[i],col);
    }
  }else if(id==='xDrive'){
    // Four omni wheels at 45° to the chassis sides — form an X pattern from above
    // Each wheel is rotated 45°, rollers perpendicular to wheel's drive axis
    const r=RR+2;
    const ws=[[r*0.71,-(r*0.71),Math.PI*0.75],[r*0.71,r*0.71,Math.PI*0.25],
              [-(r*0.71),-(r*0.71),-Math.PI*0.25],[-(r*0.71),r*0.71,-Math.PI*0.75]];
    const spd=[(inp.vx+inp.vy)*0.7+inp.vr*RR*0.4,(inp.vx-inp.vy)*0.7-inp.vr*RR*0.4,
               (inp.vx-inp.vy)*0.7+inp.vr*RR*0.4,(inp.vx+inp.vy)*0.7-inp.vr*RR*0.4];
    for(let i=0;i<4;i++){
      holoSpin[i]=(holoSpin[i]+spd[i]*S+M)%M;
      drawOmniWhl(ws[i][0],ws[i][1],ws[i][2],holoSpin[i],col);
    }
  }else if(id==='frontStrafer'||id==='hDrive'||id==='uDrive'){
    // Robot-local lateral velocity drives the strafe wheel (world-frame inp.vy is ~0
    // when the robot faces up and the player strafes — must rotate into robot frame)
    const cosH=Math.cos(robot.h),sinH=Math.sin(robot.h);
    const vly=-inp.vx*sinH+inp.vy*cosH; // robot-local lateral (strafe) component
    const Y=RR+3;
    if(id==='frontStrafer'){
      const lv=inp.vx-inp.vr*RR*0.6,rv=inp.vx+inp.vr*RR*0.6;
      holoSpin[0]=(holoSpin[0]+lv*S+M)%M; holoSpin[1]=(holoSpin[1]+rv*S+M)%M;
      holoSpin[2]=(holoSpin[2]+vly*S+M)%M;
      drawOmniWhl( RR*0.6,-Y,0,holoSpin[0],col); drawOmniWhl(-RR*0.6,-Y,0,holoSpin[0],col);
      drawOmniWhl( RR*0.6, Y,0,holoSpin[1],col); drawOmniWhl(-RR*0.6, Y,0,holoSpin[1],col);
    }else if(id==='hDrive'){
      const lv=inp.vx-inp.vr*RR*0.6,rv=inp.vx+inp.vr*RR*0.6;
      holoSpin[0]=(holoSpin[0]+lv*S+M)%M; holoSpin[1]=(holoSpin[1]+rv*S+M)%M;
      holoSpin[2]=(holoSpin[2]+vly*S+M)%M;
      drawOmniWhl( RR*0.6,-Y,0,holoSpin[0],col); drawOmniWhl(-RR*0.6,-Y,0,holoSpin[0],col);
      drawOmniWhl( RR*0.6, Y,0,holoSpin[1],col); drawOmniWhl(-RR*0.6, Y,0,holoSpin[1],col);
    }else{ // uDrive
      const lv=inp.vx-inp.vr*RR*0.5,rv=inp.vx+inp.vr*RR*0.5;
      holoSpin[0]=(holoSpin[0]+lv*S+M)%M; holoSpin[1]=(holoSpin[1]+rv*S+M)%M;
      holoSpin[2]=(holoSpin[2]+vly*S+M)%M;
      drawOmniWhl(0,-Y,0,holoSpin[0],col);
      drawOmniWhl(0, Y,0,holoSpin[1],col);
    }
  }else if(id==='fourWheelSteer'){
    // 4WS: 4 corner wheels, show current steering angles with smooth interpolation
    const S=0.065,M=6284;
    const frontA=fwsVis.steer*0.62;
    const crabA =fwsVis.crab*0.62; // same max angle as WASD steer
    const targets=[frontA+crabA, frontA+crabA, -frontA+crabA, -frontA+crabA]; // FL,FR,RL,RR
    const cx=[RR*0.65,RR*0.65,-RR*0.65,-RR*0.65];
    const cy=[-RR*0.65,RR*0.65,-RR*0.65,RR*0.65];
    const totalSpd=Math.hypot(inp.vx,inp.vy)+Math.abs(inp.vr)*RR*0.4;
    for(let i=0;i<4;i++){
      fwsAngles[i]+=(targets[i]-fwsAngles[i])*0.2;
      holoSpin[i]=(holoSpin[i]+totalSpd*S+M)%M;
      drawSwerveWhl(cx[i],cy[i],fwsAngles[i],holoSpin[i],col);
    }
  }else if(id==='kiwi'){
    // Triangle: rear wheel horizontal, two front wheels angled inward
    const r=RR+1;
    const pos=[[-r,0],[r*0.5,-r*0.866],[r*0.5,r*0.866]];
    const rollAng=[Math.PI/2, Math.PI/6, -Math.PI/6];
    // Kinematics: rear=vy-r*vr, FL=0.866*vx+0.5*vy+r*vr, FR=0.866*vx-0.5*vy-r*vr
    const spd=[inp.vy-inp.vr*RR, 0.866*inp.vx+0.5*inp.vy+inp.vr*RR, 0.866*inp.vx-0.5*inp.vy-inp.vr*RR];
    for(let i=0;i<3;i++){
      holoSpin[i]=(holoSpin[i]+spd[i]*S+M)%M;
      drawOmniWhl(pos[i][0],pos[i][1],rollAng[i],holoSpin[i],col);
    }
  }
}

// Full-width strafe wheel overlay — drawn AFTER robot body so it's visible on top
function drawRobot(){
  const d=curDrv();
  ctx.save();ctx.translate(FX+robot.x,FY+robot.y);
  // Shadow
  ctx.beginPath();ctx.ellipse(2,5,RR,RR*0.6,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.42)';ctx.fill();

  ctx.rotate(robot.h);
  drawWheels(lastRobotInp);
  // Outer glow ring
  ctx.beginPath();ctx.arc(0,0,RR+8,0,Math.PI*2);
  ctx.fillStyle=d.c+'14';ctx.fill();
  // Robot body (triangle for kiwi, square for all others)
  const isKiwi=holoMode&&HOLO_DRIVES[curHD].id==='kiwi';
  ctx.fillStyle='#1a1a2e';
  if(isKiwi){
    ctx.beginPath();ctx.moveTo(RR,0);ctx.lineTo(-RR*0.55,-RR*0.95);ctx.lineTo(-RR*0.55,RR*0.95);ctx.closePath();
    ctx.fill();ctx.strokeStyle=d.c;ctx.lineWidth=3;ctx.stroke();
    // Front tip accent
    ctx.fillStyle=d.c+'cc';ctx.beginPath();ctx.moveTo(RR,0);ctx.lineTo(RR-7,-RR*0.38);ctx.lineTo(RR-7,RR*0.38);ctx.closePath();ctx.fill();
  }else{
    rr(-RR,-RR,RR*2,RR*2,4);ctx.fill();
    ctx.strokeStyle=d.c;ctx.lineWidth=3;
    rr(-RR,-RR,RR*2,RR*2,4);ctx.stroke();
    // Front bumper stripe (bright)
    ctx.fillStyle=d.c+'cc';ctx.fillRect(RR-5,-RR,5,RR*2);
  }
  // Ball scoop / funnel arms (hidden in obstacle course mode)
  if(!obstacleCourse){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  // Subtle filled pocket between the arms
  ctx.beginPath();
  ctx.moveTo(SC_BX,-SC_BY);
  ctx.lineTo(SC_MX,-SC_MY);ctx.lineTo(SC_TX,-SC_TY);
  ctx.lineTo(SC_TX, SC_TY);
  ctx.lineTo(SC_MX, SC_MY);ctx.lineTo(SC_BX, SC_BY);
  ctx.closePath();
  ctx.fillStyle='rgba(60,60,90,0.35)';ctx.fill();
  // Left arm
  ctx.strokeStyle=d.c;ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(SC_BX,-SC_BY);ctx.lineTo(SC_MX,-SC_MY);ctx.lineTo(SC_TX,-SC_TY);
  ctx.stroke();
  // Right arm
  ctx.beginPath();
  ctx.moveTo(SC_BX, SC_BY);ctx.lineTo(SC_MX, SC_MY);ctx.lineTo(SC_TX, SC_TY);
  ctx.stroke();
  // Crossbar connecting the tips (front of scoop)
  ctx.strokeStyle=d.c+'cc';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(SC_TX,-SC_TY);ctx.lineTo(SC_TX,SC_TY);ctx.stroke();
  // Inner highlight along arm edges
  ctx.strokeStyle='#ffffff44';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(SC_BX,-SC_BY);ctx.lineTo(SC_MX,-SC_MY);ctx.lineTo(SC_TX,-SC_TY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(SC_BX, SC_BY);ctx.lineTo(SC_MX, SC_MY);ctx.lineTo(SC_TX, SC_TY);ctx.stroke();
  // Mounting tabs from robot corners to arm bases
  ctx.strokeStyle=d.c+'77';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(RR,-RR);ctx.lineTo(SC_BX,-SC_BY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RR, RR);ctx.lineTo(SC_BX, SC_BY);ctx.stroke();
  ctx.lineCap='butt';ctx.restore();
  } // end !obstacleCourse scoop
  // Direction arrow
  ctx.strokeStyle='#ffffff66';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(RR-6,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(RR-5,-4.5);ctx.lineTo(RR+3,0);ctx.lineTo(RR-5,4.5);
  ctx.strokeStyle=d.c;ctx.lineWidth=2;ctx.stroke();
  // Center dot
  ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fillStyle='#ffffff88';ctx.fill();

  // Strafe wheel overlay — drawn after body, same size as all other wheels
  if(holoMode){
    const hid=HOLO_DRIVES[curHD].id;
    if(hid==='frontStrafer') drawOmniWhl(RR, 0,Math.PI/2,holoSpin[2],d.c);
    else if(hid==='hDrive')  drawOmniWhl(0,  0,Math.PI/2,holoSpin[2],d.c);
    else if(hid==='uDrive')  drawOmniWhl(-RR, 0,Math.PI/2,holoSpin[2],d.c);
  }
  // Car steer: front wheel angle indicators
  if(d.id==='carSteer'){
    const sa=carSteerVis.steer*0.62;
    for(const wy of[-RR*0.48,RR*0.48]){
      ctx.save();ctx.translate(RR*0.65,wy);ctx.rotate(sa);
      ctx.fillStyle='#111';ctx.fillRect(-7,-3.5,14,7);
      ctx.strokeStyle=d.c;ctx.lineWidth=1.5;ctx.strokeRect(-7,-3.5,14,7);
      ctx.strokeStyle=d.c+'cc';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(6,0);ctx.stroke();
      ctx.restore();
    }
  }
  // Rear steer: fixed front wheels + turning rear wheel indicators
  if(d.id==='rearSteer'){
    // Fixed front wheels
    for(const wy of[-RR*0.48,RR*0.48]){
      ctx.save();ctx.translate(RR*0.65,wy);
      ctx.fillStyle='#111';ctx.fillRect(-7,-3.5,14,7);
      ctx.strokeStyle=d.c+'88';ctx.lineWidth=1.5;ctx.strokeRect(-7,-3.5,14,7);
      ctx.restore();
    }
    // Turning rear wheels
    const sa=carSteerVis.steer*0.62;
    for(const wy of[-RR*0.48,RR*0.48]){
      ctx.save();ctx.translate(-RR*0.65,wy);ctx.rotate(sa);
      ctx.fillStyle='#111';ctx.fillRect(-7,-3.5,14,7);
      ctx.strokeStyle=d.c;ctx.lineWidth=1.5;ctx.strokeRect(-7,-3.5,14,7);
      ctx.strokeStyle=d.c+'cc';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(6,0);ctx.stroke();
      ctx.restore();
    }
  }
  // Shooter mode: show intake count as dots on robot
  if(shooterMode){
    const dotR=4,spacing=10;
    for(let i=0;i<intake.length;i++){
      const dx=(i-(intake.length-1)/2)*spacing;
      const g2=ctx.createRadialGradient(dx-1,-1,1,dx,0,dotR);
      g2.addColorStop(0,'#fff59d');g2.addColorStop(1,'#d84000');
      ctx.beginPath();ctx.arc(dx,0,dotR,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
    }
    // "INTAKE" label at front
    if(intake.length<4){
      ctx.font='bold 7px Courier New';ctx.textAlign='center';
      ctx.fillStyle='#ffffff55';ctx.fillText('INTAKE',RR+8,-RR-6);
    }else{
      ctx.font='bold 7px Courier New';ctx.textAlign='center';
      ctx.fillStyle='#ff4444cc';ctx.fillText('FULL!',RR+8,-RR-6);
    }
  }
  drawWheels(lastRobotInp,'over'); // swerve pods on TOP of the body (no-op for other drives) — v5.1.44
  ctx.restore();

  // Field-centric compass (not rotated with robot)
  if(d.id==='fieldSwerve'&&!_drivePreview){
    const cx=FX+FW-42,cy=FY+42;
    ctx.fillStyle=d.c+'1a';
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=d.c+'55';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.stroke();
    ctx.font='bold 10px Courier New';ctx.textAlign='center';
    const dirs=[['N',0,-1],['S',0,1],['E',1,0],['W',-1,0]];
    for(const[l,dx,dy] of dirs){
      ctx.fillStyle=d.c+'cc';ctx.fillText(l,cx+dx*24,cy+dy*24+4);
    }
  }
  // Bot-centric: show faint strafe arrows relative to robot
  if(d.id==='botSwerve'&&!_drivePreview){
    ctx.save();ctx.translate(FX+robot.x,FY+robot.y);ctx.rotate(robot.h);
    ctx.strokeStyle=d.c+'30';ctx.lineWidth=1.5;
    for(const[ax,ay] of[[1,0],[-1,0],[0,1],[0,-1]]){
      ctx.beginPath();ctx.moveTo(ax*(RR+5),ay*(RR+5));ctx.lineTo(ax*(RR+14),ay*(RR+14));ctx.stroke();
    }
    ctx.restore();
  }
}

function drawProjectiles(){
  ctx.save();ctx.translate(FX,FY);
  for(const p of balls){
    if(!p.proj)continue;
    ctx.globalAlpha=0.9;
    if(frisbeeMode){
      ctx.font=(BR*2.4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🥏',p.x,p.y);
      ctx.textBaseline='alphabetic';
    }else{
      ctx.beginPath();ctx.arc(p.x+1,p.y+2,BR,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fill();
      const g=ctx.createRadialGradient(p.x-BR*0.3,p.y-BR*0.35,BR*0.08,p.x,p.y,BR);
      g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#ffe000');g.addColorStop(1,'#ff6000');
      ctx.beginPath();ctx.arc(p.x,p.y,BR,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      // Travel trail
      ctx.strokeStyle='rgba(255,200,0,0.3)';ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-Math.cos(Math.atan2(p.vy,p.vx))*18,p.y-Math.sin(Math.atan2(p.vy,p.vx))*18);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawCarSteerInstruments(){
  const d=curDrv();
  const {steer,throttle}=carSteerVis;
  const swR=JR;

  // Swap visual positions when sticks are swapped
  const swx=stickSwap?JR2.bx:JL.bx, swy=stickSwap?JR2.by:JL.by;
  const tbx=stickSwap?JL.bx:JR2.bx, tby=stickSwap?JL.by:JR2.by;

  // ── Steering wheel ──
  ctx.beginPath();ctx.arc(swx,swy,swR+6,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();
  ctx.save();ctx.translate(swx,swy);ctx.rotate(steer*Math.PI*0.65);
  // Rim
  ctx.beginPath();ctx.arc(0,0,swR-6,0,Math.PI*2);
  ctx.strokeStyle=d.c;ctx.lineWidth=3.5;ctx.stroke();
  // Hub
  ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fillStyle=d.c;ctx.fill();
  // 3 spokes
  ctx.lineWidth=2.5;
  for(let i=0;i<3;i++){const a=i*Math.PI*2/3;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);
    ctx.lineTo(Math.cos(a)*(swR-6),Math.sin(a)*(swR-6));ctx.stroke();}
  // Direction arrow at 12-o'clock — rotates with wheel to show steer direction
  const rimR=swR-6;
  ctx.fillStyle=d.c;
  ctx.beginPath();
  ctx.moveTo(0,-(rimR+10));  // tip beyond rim
  ctx.lineTo(-7,-(rimR-5)); // left base
  ctx.lineTo( 7,-(rimR-5)); // right base
  ctx.closePath();ctx.fill();
  ctx.restore();
  // Fixed straight-ahead reference tick
  ctx.strokeStyle=d.c+'44';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(swx,swy-(swR+6));ctx.lineTo(swx,swy-(swR-4));ctx.stroke();
  ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillStyle=d.c+'88';
  ctx.fillText('STEER',swx,swy+swR+14);

  // ── Throttle bar ──
  const tbH=swR*1.9,tbW=22;
  ctx.beginPath();ctx.arc(tbx,tby,swR+6,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();
  rr(tbx-tbW/2,tby-tbH/2,tbW,tbH,5);ctx.fillStyle='#0d0d18';ctx.fill();
  ctx.strokeStyle=d.c+'33';ctx.lineWidth=1;rr(tbx-tbW/2,tby-tbH/2,tbW,tbH,5);ctx.stroke();
  if(throttle>0){rr(tbx-tbW/2,tby-tbH/2,tbW,tbH/2*throttle,5);
    ctx.fillStyle='rgba(0,200,80,0.65)';ctx.fill();}
  if(throttle<0){rr(tbx-tbW/2,tby,tbW,tbH/2*(-throttle),5);
    ctx.fillStyle='rgba(220,60,0,0.65)';ctx.fill();}
  ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(tbx-tbW/2-3,tby);ctx.lineTo(tbx+tbW/2+3,tby);ctx.stroke();
  const pipY=tby-throttle*tbH/2;
  ctx.beginPath();ctx.arc(tbx,pipY,6,0,Math.PI*2);
  ctx.fillStyle=throttle>0.05?'#00e676':throttle<-0.05?'#ff5252':'#666688';ctx.fill();
  ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='bold 8px Courier New';ctx.textAlign='center';
  ctx.fillStyle='#00e67677';ctx.fillText('GAS',tbx,tby-tbH/2-5);
  ctx.fillStyle='#ff525277';ctx.fillText('BRK',tbx,tby+tbH/2+10);
  ctx.fillStyle=d.c+'88';ctx.fillText('THROTTLE',tbx,tby+swR+14);
}

function drawJoysticks(){
  const d=curDrv();
  if((d.id==='carSteer'||d.id==='rearSteer')&&(phase==='playing'||phase==='countdown'||phase==='done')){
    drawCarSteerInstruments();
    // Still draw sensitivity slider + fire button
  }else{
  const pairs=[
    {j:joys.L, label:curDrv().id==='tank'?'L TRACK':'LEFT'},
    {j:joys.R, label:curDrv().id==='tank'?'R TRACK':'RIGHT'}
  ];
  for(const{j,label} of pairs){
    const bx=j.active?j.bx:j===joys.L?JL.bx:JR2.bx;
    const by=j.active?j.by:j===joys.L?JL.by:JR2.by;
    // Semi-transparent background so joystick is readable over field
    ctx.beginPath();ctx.arc(bx,by,JR+6,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fill();
    ctx.beginPath();ctx.arc(bx,by,JR,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.32)';ctx.fill();
    ctx.strokeStyle=d.c+'55';ctx.lineWidth=2;ctx.stroke();
    // Crosshair guides
    ctx.strokeStyle=d.c+'22';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx-JR,by);ctx.lineTo(bx+JR,by);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,by-JR);ctx.lineTo(bx,by+JR);ctx.stroke();
    // Thumb
    const tx=bx+j.dx, ty=by+j.dy;
    const thumbGrad=ctx.createRadialGradient(tx-4,ty-4,2,tx,ty,JTR);
    thumbGrad.addColorStop(0,d.c+'ee');thumbGrad.addColorStop(1,d.c+'66');
    ctx.beginPath();ctx.arc(tx,ty,JTR,0,Math.PI*2);
    ctx.fillStyle=thumbGrad;ctx.fill();
    ctx.strokeStyle=d.c;ctx.lineWidth=2;ctx.stroke();
    // Label
    ctx.font='bold 10px Courier New';ctx.textAlign='center';
    ctx.fillStyle=d.c+'99';ctx.fillText(label,bx,by+JR+14);
  }

  } // end normal joystick display

  // ── Sensitivity slider between joysticks ──
  const trackY=SL_Y+SL_H/2;
  // Dark pill background
  ctx.beginPath();
  rr(SL_X1-10,SL_Y-14,SL_X2-SL_X1+20,SL_H+28,10);
  ctx.fillStyle='rgba(0,0,0,0.50)';ctx.fill();
  // Track trough
  ctx.beginPath();
  rr(SL_X1,trackY-4,SL_X2-SL_X1,8,4);
  ctx.fillStyle='#1a1a2e';ctx.fill();
  ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1;ctx.stroke();
  // Filled portion (left of thumb)
  const thumbX=SL_X1+(sensitivity-SENS_MIN)/(SENS_MAX-SENS_MIN)*(SL_X2-SL_X1);
  ctx.beginPath();
  rr(SL_X1,trackY-4,thumbX-SL_X1,8,4);
  ctx.fillStyle=d.c+'66';ctx.fill();
  // Thumb
  ctx.beginPath();ctx.arc(thumbX,trackY,9,0,Math.PI*2);
  ctx.fillStyle=d.c;ctx.fill();
  ctx.strokeStyle='#fff5';ctx.lineWidth=1.5;ctx.stroke();
  // Labels
  ctx.font='bold 9px Courier New';ctx.textAlign='center';
  ctx.fillStyle='#6060808';
  ctx.fillStyle='#505068';ctx.fillText('SENS',CW/2,SL_Y-4);
  ctx.fillStyle=d.c+'cc';ctx.font='bold 11px Courier New';
  ctx.fillText(sensitivity.toFixed(1)+'×',CW/2,SL_Y+SL_H+14);

  // ── Stick swap button (bot/field swerve + car steer only) ──
  {const id=d.id;
  if(holoMode||['botSwerve','fieldSwerve','carSteer','rearSteer'].includes(id)){
    ctx.fillStyle=stickSwap?'rgba(60,100,220,0.45)':'rgba(15,15,35,0.55)';
    rr(SWAP_BTN.x,SWAP_BTN.y,SWAP_BTN.w,SWAP_BTN.h,8);ctx.fill();
    ctx.strokeStyle=stickSwap?'#5588ff':'#334';ctx.lineWidth=1.5;
    rr(SWAP_BTN.x,SWAP_BTN.y,SWAP_BTN.w,SWAP_BTN.h,8);ctx.stroke();
    ctx.font='bold 9px Courier New';ctx.textAlign='center';
    ctx.fillStyle=stickSwap?'#aaccff':'#445566';
    ctx.fillText(stickSwap?'⇄ STICKS SWAPPED':'⇄ SWAP STICKS [Tab]',CW/2,SWAP_BTN.y+13);
  }}

  // ── Fire button (shooter mode only) ──
  if(shooterMode||tankFight){
    const hasAmmo=tankFight?(tfState&&tfState.player.hp>0):intake.length>0;
    const firing=fireBtnPressed||!!keys[' '];
    ctx.beginPath();ctx.arc(FB_X,FB_Y,FB_R+8,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fill();
    ctx.beginPath();ctx.arc(FB_X,FB_Y,FB_R,0,Math.PI*2);
    ctx.fillStyle=hasAmmo?(firing?'rgba(255,60,60,0.7)':'rgba(180,30,30,0.45)'):'rgba(30,20,20,0.6)';ctx.fill();
    ctx.strokeStyle=hasAmmo?(firing?'#ff8888':'#ff4444'):'#442222';ctx.lineWidth=2.5;ctx.stroke();
    ctx.font='bold 10px Courier New';ctx.textAlign='center';
    ctx.fillStyle=hasAmmo?'#ffaaaa':'#442222';ctx.fillText(tankFight?'FIRE':'FIRE',FB_X,FB_Y+4);
    // Ammo pips (shooter) or HP pips (tank fight)
    if(tankFight){
      const hp=tfState?tfState.player.hp:0;
      for(let i=0;i<3;i++){
        const px=FB_X-10+i*10,py=FB_Y+FB_R+8;
        ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);
        ctx.fillStyle=i<hp?'#44ff4488':'#2a1a1a';ctx.fill();
        ctx.strokeStyle='#44ff4444';ctx.lineWidth=1;ctx.stroke();
      }
    }else{
      for(let i=0;i<6;i++){
        const px=FB_X-15+i*10,py=FB_Y+FB_R+8;
        ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);
        if(i<intake.length){const g3=ctx.createRadialGradient(px-1,py-1,1,px,py,4);g3.addColorStop(0,'#fff59d');g3.addColorStop(1,'#d84000');ctx.fillStyle=g3;}
        else{ctx.fillStyle='#2a1a1a';}
        ctx.fill();ctx.strokeStyle='#ff444455';ctx.lineWidth=1;ctx.stroke();
      }
    }
  }
}

function drawHUD(){
  const d=curDrv();
  // Top bar

function parseHighScores(){
  const f=hsFilters;
  const allBases=[];
  DRIVES.forEach(d=>allBases.push({base:d.id,name:d.name,cat:'main'}));
  HOLO_DRIVES.forEach(d=>{
    allBases.push({base:'holo_'+d.id,name:d.name+' ⬡',cat:'holo'});
    allBases.push({base:'holo_'+d.id+'_fc',name:d.name+' 🌐',cat:'holo'});
  });
  STEER_DRIVES.forEach(d=>allBases.push({base:d.id,name:d.name,cat:'steer'}));
  const entries=[];
  for(const [key,time] of Object.entries(best)){
    for(const {base,name,cat} of allBases){
      if(key===base||key.startsWith(base+'_')){
        const sfx=key.slice(base.length);
        const hasInv=sfx.includes('_inv'),cpuM=sfx.match(/_cpu(\d)/),hasSht=sfx.includes('_sht'),hasTf=sfx.includes('_tf'),hasOc=sfx.includes('_oc');
        if(f.cat!=='all'&&f.cat!==cat)continue;
        if(f.inv&&!hasInv)continue;if(f.cpu&&!cpuM)continue;if(f.sht&&!hasSht)continue;if(f.tf&&!hasTf)continue;if(f.oc&&!hasOc)continue;
        const tags=[];
        if(hasInv)tags.push('↕INV');if(cpuM)tags.push('CPU×'+cpuM[1]);if(hasSht)tags.push('🎯');if(hasTf)tags.push('⚔');if(hasOc)tags.push('🏁');
        entries.push({name,time,settings:tags.length?tags.join(' '):'NORMAL',key,cat,playerName:bestNames[key]||''});
        break;
      }
    }
  }
  return entries.sort((a,b)=>a.time-b.time);
}

function applyCpuSlider(id,t){
  const sl=cpuSliders().find(s=>s.id===id);if(!sl||!sl.min)return;
  const raw=sl.min+t*(sl.max-sl.min);
  if(id==='speed'){cpuSpeedMult=Math.round(raw*4)/4;return;}
  if(id==='nd'){cpuPrefs.normalDisrupt=Math.round(Math.min(raw,0.90-cpuPrefs.normalGuard)*100)/100;return;}
  if(id==='ng'){cpuPrefs.normalGuard=Math.round(Math.min(raw,0.90-cpuPrefs.normalDisrupt)*100)/100;return;}
  if(id==='stand'){cpuPrefs.interceptStandoff=Math.round(raw*100)/100;return;}
  if(id==='si'){cpuPrefs.shooterIntercept=Math.round(Math.min(raw,0.90-cpuPrefs.shooterBlock)*100)/100;return;}
  if(id==='sb'){cpuPrefs.shooterBlock=Math.round(Math.min(raw,0.90-cpuPrefs.shooterIntercept)*100)/100;return;}
  if(id==='dz'){cpuPrefs.dangerZone=Math.round(raw*2)/2;return;}
  if(id==='st'){cpuPrefs.stuckTime=Math.round(raw*100)/100;}
}

const TF_OBS=[
  // Top-left L bunker
  {x:15,y:78,w:68,h:14},{x:15,y:78,w:14,h:58},
  // Top-right L bunker
  {x:297,y:78,w:68,h:14},{x:351,y:78,w:14,h:58},
  // Bottom-left L bunker
  {x:15,y:536,w:68,h:14},{x:15,y:478,w:14,h:58},
  // Bottom-right L bunker
  {x:297,y:536,w:68,h:14},{x:351,y:478,w:14,h:58},
  // Centre cross cover
  {x:138,y:296,w:104,h:14},{x:183,y:252,w:14,h:104},
  // Mid side covers
  {x:20,y:268,w:14,h:88},{x:346,y:268,w:14,h:88},
];

function obsCheck(obj,r){
  obj.x=clamp(obj.x,r,FW-r);obj.y=clamp(obj.y,r,FH-r);
  for(const o of (tfObs||TF_OBS)){
    // Deep penetration (center inside the rect): eject along the smallest axis.
    // Reachable at high sensitivity (≈18px/frame at 2.0× vs 26px-thin walls), latent in SP too.
    if(obj.x>o.x&&obj.x<o.x+o.w&&obj.y>o.y&&obj.y<o.y+o.h){
      const dl=obj.x-o.x,dr=o.x+o.w-obj.x,dtp=obj.y-o.y,db=o.y+o.h-obj.y;
      const m=Math.min(dl,dr,dtp,db);
      if(m===dl)obj.x=o.x-r;else if(m===dr)obj.x=o.x+o.w+r;
      else if(m===dtp)obj.y=o.y-r;else obj.y=o.y+o.h+r;
      continue;
    }
    const cx=clamp(obj.x,o.x,o.x+o.w),cy=clamp(obj.y,o.y,o.y+o.h);
    const dx=obj.x-cx,dy=obj.y-cy,d=Math.hypot(dx,dy)||0.01;
    if(d<r){obj.x=cx+dx/d*r;obj.y=cy+dy/d*r;
      if(obj.vx!==undefined){const into=obj.vx*dx/d+obj.vy*dy/d;if(into<0){obj.vx-=into*dx/d;obj.vy-=into*dy/d;}}} // ICE/DRIFT: kill velocity into the wall so the bot doesn't stick/jitter
  }
}
function tfBulletOOB(b){return b.x<=3||b.x>=FW-3||b.y<=3||b.y>=FH-3;} // arena bounds (always lethal)
function tfBulletHitObs(b){ // obstacle hit (pierce can survive this)
  for(const o of (tfObs||TF_OBS)){
    const cx=clamp(b.x,o.x,o.x+o.w),cy=clamp(b.y,o.y,o.y+o.h);
    if(Math.hypot(b.x-cx,b.y-cy)<5)return true;
  }
  return false;
}
function tfBulletDead(b){return tfBulletOOB(b)||tfBulletHitObs(b);} // legacy SP tank-fight path
function tfShoot(tank,owner){
  if(!tfState)return;
  tfState.bullets.push({x:tank.x+Math.cos(tank.h)*(RR+10),y:tank.y+Math.sin(tank.h)*(RR+10),
    vx:Math.cos(tank.h)*400,vy:Math.sin(tank.h)*400,owner,id:tfState._bid++});
}

function updateTankFight(dt){
  if(!tfState||tfState.result)return;
  playT+=dt;if(anyCheat())cheatedRun=true;
  const p=tfState.player,cpu=tfState.cpu;

  // ── Player movement (reuses existing getInp which reads robot.h = player.h) ──
  const inp=getInp();
  p.h+=inp.vr*dt; {const _m=momModeFor(p,-1);if(_m)applyMomentum(p,inp,dt,_m);else{p.x+=inp.vx*dt;p.y+=inp.vy*dt;}}
  obsCheck(p,RR);

  // Player shoot
  p.reload-=dt;
  if((keys[' ']||fireBtnPressed)&&p.reload<=0&&p.hp>0){
    tfShoot(p,'player'); p.reload=0.32;
  }

  // ── CPU AI ──
  if(cpu.hp>0){
    const pdx=p.x-cpu.x,pdy=p.y-cpu.y,pdist=Math.hypot(pdx,pdy)||0.01;
    const targetH=Math.atan2(pdy,pdx);
    let dh=targetH-cpu.h;
    while(dh>Math.PI)dh-=2*Math.PI;while(dh<-Math.PI)dh+=2*Math.PI;
    cpu.h+=Math.sign(dh)*Math.min(Math.abs(dh),TSP*2.8*dt);
    cpu.reload-=dt;
    if(Math.abs(dh)<0.22&&cpu.reload<=0){tfShoot(cpu,'cpu');cpu.reload=1.0+Math.random()*0.5;}
    cpu.moveTimer=(cpu.moveTimer||0)-dt;
    if(cpu.moveTimer<=0){cpu.moveDir=(Math.random()-0.5)*2;cpu.moveTimer=0.7+Math.random()*1.1;}
    const fwdBias=pdist>160?0.85:pdist>80?0.35:-0.6;
    const spd=SPD*sensitivity;
    const cch=Math.cos(cpu.h),csh=Math.sin(cpu.h);
    cpu.x+=(cch*fwdBias*spd - csh*cpu.moveDir*spd*0.45)*dt;
    cpu.y+=(csh*fwdBias*spd + cch*cpu.moveDir*spd*0.45)*dt;
    obsCheck(cpu,RR);
  }

  // Tank-tank collision
  const tcx=p.x-cpu.x,tcy=p.y-cpu.y,tc=Math.hypot(tcx,tcy)||0.01;
  if(tc<RR*2){const nx=tcx/tc,ny=tcy/tc,ov=RR*2-tc;
    p.x+=nx*ov*0.5;p.y+=ny*ov*0.5;cpu.x-=nx*ov*0.5;cpu.y-=ny*ov*0.5;
    obsCheck(p,RR);obsCheck(cpu,RR);}

  // ── Bullets ──
  for(const b of tfState.bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(tfBulletDead(b)){b.dead=true;continue;}
    if(b.owner==='cpu'&&p.hp>0&&Math.hypot(b.x-p.x,b.y-p.y)<RR+4){
      p.hp--;b.dead=true;
      if(p.hp<=0)tfState.result='lose';
    }
    if(b.owner==='player'&&cpu.hp>0&&Math.hypot(b.x-cpu.x,b.y-cpu.y)<RR+4){
      cpu.hp--;b.dead=true;
      if(cpu.hp<=0){tfState.result='win';const k=modeKey(DRIVES[curD].id);if(!cheated()&&(!best[k]||playT<best[k])){best[k]=playT;saveBest();}}
    }
  }
  tfState.bullets=tfState.bullets.filter(b=>!b.dead);
}

  for(const o of OC_OBS){

function updateObstacleCourse(dt){
  if(!ocState||ocState.result)return;
  playT+=dt;if(anyCheat())cheatedRun=true;
  ocState.resetFlash=Math.max(0,ocState.resetFlash-dt);
  const inp=getInp();
  robot.h+=inp.vr*dt; {const _m=momModeFor(robot,-1);if(_m)applyMomentum(robot,inp,dt,_m);else{robot.x+=inp.vx*dt;robot.y+=inp.vy*dt;}}
  // Field boundary check (hitting side/top/bottom walls = reset)
  if(robot.x<RR||robot.x>FW-RR||robot.y>FH-RR){ocReset();return;}
  // Obstacle collision = reset
  if(robotHitsOCObs()){ocReset();return;}
  spGhostSample();
  // Finish line
  if(robot.y<OC_FINISH_Y){
    ocState.result='win';
    const k=modeKey(DRIVES[curD].id);
    const _pb=!cheated()&&(!best[k]||playT<best[k]); // cheats disable records
    if(_pb){best[k]=playT;saveBest();}
    spGhostFinish(k,_pb);
  }
}

let importMsg='',importMsgT=0;
function saveBest(){
  try{localStorage.setItem('frc_showdown_v1',JSON.stringify({best,bestNames}));}catch(e){}
}
function loadBest(){
  try{
    const s=localStorage.getItem('frc_showdown_v1');
    if(s){const d=JSON.parse(s);const src=d.best||d;
      for(const[k,v]of Object.entries(src))if(typeof v==='number')best[k]=v;
      if(d.bestNames)for(const[k,v]of Object.entries(d.bestNames))if(typeof v==='string')bestNames[k]=v;}
  }catch(e){}
}
function exportScores(){
  const data=JSON.stringify({v:1,exported:new Date().toISOString(),best,bestNames},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(data);
  a.download='frc_showdown_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function importScores(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        const src=d.best||d;let count=0;
        for(const[k,v]of Object.entries(src)){
          if(typeof v==='number'&&(!best.hasOwnProperty(k)||v<best[k])){best[k]=v;count++;}
        }
        if(d.bestNames)for(const[k,v]of Object.entries(d.bestNames))if(typeof v==='string'&&best.hasOwnProperty(k))bestNames[k]=v;
        saveBest();
        importMsg=count?'✓ '+count+' score'+(count>1?'s':'')+' imported!':'No new best times found';
        importMsgT=performance.now();
      }catch(err){importMsg='✗ Invalid file — expected exported JSON';importMsgT=performance.now();}
    };
    r.readAsText(f);
  };
  inp.click();
}

function ghostList(){ // [{key,t,imported}] for every frcds_spghost:* entry
  const out=[];
  try{

      if(sk.indexOf('frcds_spghost:')!==0)continue;
      try{const g=JSON.parse(localStorage.getItem(sk));if(g&&Array.isArray(g.samples))out.push({key:sk.slice(14),t:g.t,imported:!!g.imported});}catch(e){}
    }

  return out.sort((a,b)=>a.t-b.t);

  const bases=[];
  DRIVES.forEach(d=>bases.push({base:d.id,name:d.name}));
  HOLO_DRIVES.forEach(d=>{bases.push({base:'holo_'+d.id,name:d.name+' ⬡'});bases.push({base:'holo_'+d.id+'_fc',name:d.name+' 🌐'});});
  STEER_DRIVES.forEach(d=>bases.push({base:d.id,name:d.name}));
  for(const {base,name} of bases){

function ghostsToJSON(){ // pure: bundle all ghosts (clean, no imported flag on export)
  const ghosts={};

    if(sk.indexOf('frcds_spghost:')!==0)continue;
    try{const g=JSON.parse(localStorage.getItem(sk));if(g&&Array.isArray(g.samples))ghosts[sk.slice(14)]={t:g.t,samples:g.samples};}catch(e){}
  }

function ghostsFromJSON(text){ // pure: merge + tag imported:true; returns count or throws
  const d=JSON.parse(text);
  const src=d.ghosts||d;
  if(typeof src!=='object'||src===null)throw new Error('no ghosts');
  let count=0;
  for(const [k,g] of Object.entries(src)){
    if(!g||!Array.isArray(g.samples)||typeof g.t!=='number')continue;
    localStorage.setItem('frcds_spghost:'+k,JSON.stringify({k,t:g.t,samples:g.samples,imported:true}));
    count++;
  }
  if(!count)throw new Error('no valid ghosts');
  _spgK=null;_spgG=null; // force the active ghost to reload from the imported data
  return count;
}
function exportGhosts(){

function importGhosts(){

ain changes). Single file, no assets.
  v3.10.1 (2026-06-12): SHOT-BLOCK FIX (H2H shooter). Fired balls (projectiles) now collide with robot bodies in head-to-head shooter; previously they passed straight through every player robot, so a defender standing in the lane did nothing. Contact is contact-dependent: a shot striking the front face of a robot that has magazine room is CAUGHT (added to its intake, re-shootable); any other contact BLOCKS, motion-scaled so a parked robot dead-stops the ball where it hits while a moving robot carries it (push scales with the blocker's speed along the contact normal). Applies to both player bots and alliance CPU teammates (CPUs carry no velocity or magazine, so they act as soft walls that dead-stop a shot, never catch). Blocked/caught balls are credited to the blocker's alliance for scoring attribution. Single-goal mode is unchanged (its CPU defenders already deflected shots, and the CPU never shoots at the player there). New suite smoke41 (9 asserts: parked dead-stop, moving push + direction, front-face catch, full-magazine block, alliance-CPU dead-stop + credit, no self-collision at the fire spawn). smoke82's far-goal scoring case hardened to park the idle defender out of the shot lane (it had been scoring through blue's body, which the fix correctly now blocks). Single file, no assets.
  v3.11 (2026-06-12): ACHIEVEMENTS + SECRET ACHIEVEMENTS (item 4, batch feature 1 of 6). Added a persisted, idempotent achievement system: 9 standard and 4 secret unlocks, each firing a toast and the unlock sound the moment it triggers, persisted in localStorage (frcds_ach_v1 plus a progress object frcds_achp_v1 for the cumulative all-drives and all-tiers goals). New Achievements screen reached from the High Scores records hub, secret entries masked until earned. Triggers: First Blood (first H2H win), Tier Climber (beat all five CPU tiers), Brick Wall (shooter shutout), Golden Touch (golden-ball sudden-death win), Gearhead (drive five distinct drive types), Hot Lap (course best), Bracket Buster (tournament win), Denied (block a shot with your body), Pickpocket (catch a shot out of the air); secret: Ghostbuster (beat an imported ghost), Wrong Way (own goal), Pacifist (win on opponent own-goals without scoring yourself), The Code (konami). Hooks added at the SP finish, the H2H result edge (reusing the series-report edge), b2Credit (real-goal tracking and own-goal detection), b2ProjBlock (block/catch, human bots only), the konami activations, and the tournament champion site. New suite smoke42 (12 asserts: definition shape, idempotent unlock, unknown-id reject, cumulative drive/tier thresholds with dedupe). Single file, no assets.
  v3.12 (2026-06-12): H2H CPU NORMAL-MODE SCORING FINISH (batch feature 2 of 6). Fixes the CPU stalling at the opponent gap in ball normal mode: a ball nudged toward the gap used to drag to a halt just short because, within the scoring lane, the brain demanded a tight 0.86 cone alignment to commit and otherwise executed its 'stand off and let drag park it' branch. Now, inside the opponent gap's scoring lane (push objective, within 130px of G.ex and the gap span), the standoff is suppressed and an aligned bot drives the ball THROUGH the gap line instead of nudging 16px past its rest point; a bot not yet behind still orbits to get behind first, so it no longer mis-pushes. Shared-brain, mode-gated (push objective only, so shooter keeps its shoot-from-shootR terminal and tank/race are untouched); the v3.10 own-goal guard is preserved since the lane keys off the opponent gap (G.ex), never the own gap. New suite smoke43 (3 asserts: integration proof that CHAMPION drives a lane ball through the gap, the in-lane aligned drive-through, and the behind-side gate). smoke38 CHAMPION-scores and balance both stay green. Single file, no assets.
  v4.0 (2026-06-13): STICKY-PLOW SCORING REWORK (batch feature 3 of 6). Reworks H2H ball normal-mode CPU scoring so CPU bots reliably finish. (1) Scoring-registration fix: a ball scores the instant its center crosses the gap wall plane while in the gap mouth, not only after travelling ~15px past it, so a ball pushed gently through but stopped just inside still registers (a deep Y-independent threshold is kept as a fallback). (2) Sticky plow, CPU bots only (human main bots push exactly as before, preserving existing feel): a CPU bot captures balls in its front cone, carries a tier-scaled load (ROOKIE 1 / VETERAN 2 / FINALIST 3 / WINNER 4 / CHAMPION 6; alliance teammates a flat 1), scores by driving the load through the opponent gap, and loses it to opponent contact with no friendly fire (ordinary contact pops the front ball, a hard hit from the opponent main bot scatters the whole load, an alliance carrier drops its single ball to any opponent contact). (3) Scoring cycle replaces the old defend/push/clear brain for main CPU bots, which are now PURE OFFENSE and never own-goal: gather a load while progressing toward the opponent gap (own-gap-mouth balls and backtracking skipped, anti-double-team retained), then deliver when full or near the gap with a clear lane, slipping to the open side of the mouth around a camped defender; tier-scaled focus lapses keep weaker tiers weaker. Hands-off CHAMPION clears 30 goals/90s comfortably (about 45 vs an idle gap-camper) with zero own goals measured at every tier. (4) Shooter-mode unstick: a main CPU bot with no progress for about 2.5s breaks free toward open center and re-picks its objective. (5) Match-timer visibility: the timed-format countdown is promoted to a prominent scoreboard readout, amber under 15s, red and pulsing under 5s. New suites smoke45 (sticky engine, 9 asserts), smoke46 (scoring cycle and the zero-own-goal guarantee, 5), smoke47 (shooter unstick, 4); smoke38 and smoke43 re-baselined for the pure-offense design. NOTE: lower CPU tiers score higher than the originally proposed targets because any working cycle scores well against a passive opponent; lower-tier scaling is left as a balance-tuning preference. Single file, no assets.
  v4.1 (2026-06-13): STICKY-PLOW TUNING + UNSTICK + END COUNTDOWN. (1) Alliance teammates no longer carry balls — their stickiness was removed (it was not fun); they still strip an opposing main CPU's load on contact. (2) Plow stickiness and how easily balls are knocked loose now scale with the CPU's skill tier: a ROOKIE's loose plow drops the ball to any ordinary contact, while a CHAMPION's tight plow shrugs off soft contact entirely and only a hard hit scatters its load (both the hard-hit threshold and the capture reach scale with tier). (3) The main CPU bot now unsticks itself: if it makes no progress for about 3s (held up or pinned), it jukes away from the nearest opponent toward open space for about 0.7s while keeping its load, so it is no longer held indefinitely. (4) Pin penalties (the pin contact rule) now apply only to clean main-vs-main wall pins — an alliance bot in the cluster voids the penalty, so a human is no longer penalized when their own alliance does the holding. (5) Timed matches now beep a 5-4-3-2-1 countdown over the final five seconds. New suite smoke48 (cycle unstick, pin alliance-void, end countdown; 5 asserts); smoke45 strip tests re-baselined for the tier-scaled gradient (now 10 asserts). Difficulty and scoring are unchanged: CHAMPION still clears 30 goals/90s with zero own goals at every tier. Single file, no assets.
  v4.2 (2026-06-13): PLOW LOOSENED — HIT-LOCATION STRIP MODEL. The sticky plow (itself a workaround for the CPU being unable to retain a ball) was too retentive. Stripping now depends on WHERE the opponent makes contact: the carried balls protrude in front, so hitting one of THEM knocks it loose at any skill tier (and a hard hit on the cluster scatters the whole load), while a bump to the BOT BODY only dislodges a ball on a loose low-tier plow — a CHAMPION's plow ignores body bumps, so you must actually hit the ball to take it. This is looser overall (the exposed front balls are easy to hit) while keeping the skill ranking the player asked for (ROOKIE loses a ball to any bump; CHAMPION only to a hit on the ball). Capture reach is now consistent across tiers; the skill difference lives entirely in the strip. NOTE: this is a deliberate playtest candidate — flattening to a consistent strip with no tier ranking is a one-line change if the ranking does not feel worth it. smoke45 strip tests re-baselined to the hit-location model (11 asserts). Scoring and own-goal safety are unchanged: CHAMPION still clears 30 goals/90s with zero own goals at every tier. Single file, no assets.
  v5.0 (2026-06-13): SETUP OVERHAUL + PLOW STEAL + BALL COUNT (big build, 3v3 follows as v5.1). (1) Plow flattened: a body bump now dislodges a carried ball at EVERY tier including CHAMPION (the per-tier resistance gate was removed); also fixed a latent bug where the body-bump cooldown gated on an undefined value so first-contact bumps never fired. (2) Plow STEAL: a soft hit on a carried ball is now a take rather than a scatter — the ball releases along the stealer's heading and ends up in front of its plow; any opposing bot can steal; a hard hit on the cluster still scatters the whole load. (3) Unified setup screen: the separate drive-pick step is merged into the claim screen as one Mario-Kart card per spot — rendered bot in the drive color, Push/Maneuver/Grip stat bars, a description line, a tabbed drive picker (Classic | Holonomic | Steer) with cycle arrows, controller assignment (keyboard/gamepad/touch or CPU + tier), a per-spot custom name (click to rename; defaults to the drive name), and a sensitivity slider replacing the +/- steppers. Custom names show in the ball-mode HUD, results, and pin toast (default RED/BLUE). (4) Ball-count setting: BALLS IN PLAY = AUTO (scales with robot count, 4 + total robots, clamped 4-14) or manual 4/6/8/10/12, spawned from a left/right mirror-symmetric generator so the field is fair from both ends. (5) Alliance count (CPU BOTS PER SIDE 0/1/2) confirmed and kept. New suite smoke50 (unified setup screen: flow, drive tabs/arrows, rename, slider, swap, start; 19 asserts); smoke45 re-baselined for flatten + steal (12 asserts); smoke13 and smoke38 updated for the merged flow and new claim coordinates. Full battery green (26 suites); scoring and own-goal safety unchanged (own goals 0 at every tier, CHAMPION clears 30+). Single file, no assets.
  v5.0.1 (2026-06-13): FIX — single-player gamepad sticks went dead after playing a 2P match. resetBinds() existed but was never called, so playerBind[0] kept the last 2P claim (e.g. keyboard); single-player getInp then read that stale bind and bindAxes returned zero gamepad axes, ignoring the sticks (bumpers still changed sensitivity because that reads gamepad buttons globally). Wired resetBinds() into p2Exit(), the single chokepoint every 2P-to-menu path funnels through, restoring the 'any' routing on return to single-player. Pre-existing since the 2P binding system (present in v4.2); surfaced by the v5.0 setup screen prompting more 2P play. New regression asserts in smoke50 (now 22). Full battery green. Single file, no assets.
  v5.1-wip (2026-06-13): RESUME BASE for the 3v3 pass (NOT a playable release). Phase 7 foundation staged on top of v5.0.1: Chunk 1 (alliance-helper refactor — mains carry .al/.spot; identity, attribution, foe-gathering, and projectile contact route through b2Mains/b2Foes/b2OppMain/b2IsMain; behavior-preserving at two bots) and b2Roster (pure mirror-fair fill rule: competitors=clamp(max humans either side,1,3), each side fields that many competitor mains then 3-competitors alliance bots; unit-tested in smoke51). The remaining 3v3 wiring (roster-driven spawn + 3 lanes/side, per-main CPU brain, per-main input routing, N-pair pinning, six-card setup UI, name wiring for six, re-green battery for always-3v3, balance) is pending. Battery green: 27 suites incl smoke50 (setup screen) and smoke51 (fill rule). Single file, no assets.
  v5.1-wip fix pass (2026-06-14): playtest fixes on the resume base, ahead of the 3v3 wiring. (1) Post-match nav rewired for the v5.0 merged setup: the dead "DRIVES" button (old p2drive stub) is now "SETUP" -> the unified p2claim screen; the SETTINGS round-trip preserves controller claims so it no longer dumps you back to a full re-claim. (2) CPU translate speed is capped at the player's drive speed (tier multipliers above 1, e.g. CHAMPION 1.06, clamped to 1) so a CPU never outruns a human. (3) CPU now honors its drive kinematics: only swerve/holonomic strafe; tank/arcade and steer drive along their heading (arc toward targets, no instant sideways slide) -- a forward-floor arc keeps CHAMPION scoring 30+/90s. (4) Setup card renders the actual drive (body + per-drive wheels + scoop) instead of a generic box. (5) In-match name tag over each robot shows the custom name, not RED/BLUE. (6) 2P sensitivity slider supports grab-and-drag (mouse + touch) in addition to click-to-jump. (7) 2P gamepad nav is spatial (real up/down + left/right via nearest-in-direction) instead of flat sequential. (8) On the setup screen each claimed gamepad sets up its own card (dpad cycles drive/group, LB/RB sensitivity). (9) Sticky plow rebalanced: capacity [1,2,3,4,4]->[1,2,2,3,3] (CHAMPION carries 3, fits within the plow arms), plus a tier-scaled movement-drop while driving (CHAMPION 0/perfect, WINNER .10, FINALIST .28, VETERAN .45, ROOKIE .70 per sec) released sideways so own goals stay zero; shooter mode untouched. Battery green (smoke40 10 asserts, smoke45 14). Single file, no assets.
  v5.1-wip fix pass 2 (2026-06-14): more playtest fixes. (1) SP CPU-settings screen is now gamepad-navigable (dashed cursor over back/reset/count/sliders/presets; left-right adjusts the focused slider; A activates; B backs out). (2) Setup screen: each claimed gamepad already drove its own card; added on-screen hints, plus release/unclaim (click a claimed controller box or press B on a claimed pad) so an accidental keyboard claim can be swapped to a pad. (3) Custom names commit live as you type (no Enter needed; Esc reverts; clicking away closes) -- fixes names not showing when you did not press Enter; tank/race result screens now use the custom name too. (4) ALLIANCE SKILL setting (ROOKIE..CHAMPION) scales the alliance support bots; default tier 2 == the old speed. (5) Default CPU BOTS PER SIDE 0->2 (each alliance fields 3 robots). (6) Post-game nav order: SETUP before SETTINGS. (7) Clickable mute toggle in the corner of the menu and 2P setup screens. Battery green (smoke50 23). Single file, no assets.
  v5.1 (2026-06-14): RELEASE. Promotes the resume-base line to a playable release: v5.0.1 plus the two playtest fix passes above (post-game nav rewire for the merged setup; CPU speed capped to the player and drive-type kinematics so tank/arcade/steer no longer strafe like swerve; sticky-plow rebalance with tier-scaled movement-drop and a plow-fitting capacity; setup card renders the real drive; custom names commit live and show in-match and on tank/race results; 2P sensitivity grab-drag; spatial 2P gamepad nav; controller-only game setup including the CPU opponent; gamepad nav on the SP CPU-settings screen; controller release/unclaim; default 2 alliance bots per side with an ALLIANCE SKILL setting; a small corner mute icon). The Phase-7 3v3 foundation (alliance helpers + b2Roster) remains staged but inert and behavior-preserving. The full always-three-per-side 3v3 head-to-head is deferred to v5.2. Full battery green; own goals zero at every tier; CHAMPION clears 30+ goals/90s. Single file, no assets.
  v5.1.35 (2026-06-14): MOUSE-AIM CONTROL SCHEME. Toggle with K (persisted): the keyboard player's bot turns to face the mouse cursor instead of using arrow/A-D to turn — move with WASD/arrows, aim with the mouse. Applies to non-steer drives (tank/arcade/swerve/holo) in SP + 2P ball/tank; steer drives (they turn by rolling) and the climb/race modes are unaffected. Implemented as a vr override at the end of getInp (turns proportionally toward the cursor, capped at the drive's turn rate, honoring sensitivity). smoke54 +2 (turns toward cursor up/down; off leaves keys). Full battery green. Single file, no assets.
  v5.1.34 (2026-06-14): IN-GAME PAUSE MENU. ESC (or gamepad START) during a live game now PAUSES instead of hard-exiting: a dimmed overlay with RESUME and QUIT, gameplay frozen underneath. Works in single-player (playing/countdown) and all 2P matches (ball/tank/race, while result is null). Resume: ESC/START/A or click RESUME; Quit: B or click QUIT (does the old exit — SP->menu, 2P->back). Mouse + touch + gamepad all drive the overlay; pause auto-clears if the match ends underneath, and resets at every run/match start. SP 'done' results screen ESC still exits as before. smoke54 +5 (canPause, freeze, resume, quit). Full battery green. Single file, no assets.
  v5.1.33 (2026-06-14): TUNING — BIGGER BLAST, WIDER PLOW, CLICKABLE SETTINGS ARROWS. (1) Explosive blast radius 62->80. (2) Sticky-plow capture cone widened a bit (reach [5,5,6,8]->[6,6,8,11], lateral [7,7,9,11]->[11,12,14,16]) so a bot scoops balls beside the cluster and carries more than one at a time — a midpoint between the old narrow cone and the previously-too-grabby version. (3) The 2P MATCH SETTINGS ◀ / ▶ glyphs are now MOUSE-clickable to step a row's value (matching the gamepad ◀▶); clicking the row body still opens the dropdown. smoke52 +3 (arrow-click step up/down, body opens dropdown). Full battery green. Single file, no assets.
  v5.1.32 (2026-06-14): CHEAT SCOPE TAGS. Each cheat description is now prefixed with where it applies — [SP+2P] for ULTIMATE ASCENT, BOUNCY BALLS, ICE SKATING, DRIFT, BALL SIZE, ROBOT SIZE (these work in single-player too), and [2P] for RAMMING, MACHINE GUN, EXTRA BALLS, MULTIBALL, STICKY PLOW, NO-CLIP, BALL POWER-UPS (their hooks live in the 2P ball/tank code). No behavior change. Full battery green. Single file, no assets.
  v5.1.31 (2026-06-14): CHEATS DISABLE RECORDS + TWO-COLUMN MENU. (1) INTEGRITY: using any cheat now DISABLES records, high scores, ghost PBs, H2H records, and performance achievements for that run/match. anyCheat() tracks if a cheat is on; cheatedRun latches if one was active at any point during the run (set each gameplay tick, reset at every run/match start), so toggling a cheat off right before finishing still won't earn a record. The cheat menu shows an amber 'records & high scores disabled' warning while any cheat is on. (2) The cheat menu is now TWO COLUMNS (the list reached 13) — far more compact; ◀▶ switches columns (or adjusts a slider), ▲▼ move, A toggles. smoke54 +4 (anyCheat/cheated, cheated H2H records nothing, menu fits two-col). Full battery green. Single file, no assets.
  v5.1.30 (2026-06-14): CHEAT MENU COMPACTION. The cheat list grew to 13 entries and was overflowing the menu — compacted the layout (smaller top logo, row pitch 36->26, list starts higher) so all 13 rows + the focused-cheat description + the rambots/instagram links + footer fit on screen with margin. smoke54 now asserts the menu fits (rows + links bottom < canvas height) so future cheats can't silently overflow. Full battery green. Single file, no assets.
  v5.1.29 (2026-06-14): BALL POWER-UPS cheat (pickups in ball modes). A Konami toggle spawns SPEED » pickups on the field in 2P ball + shooter (there was no pickup substrate in ball mode before): a fresh pickup every ~5-9s at free field spots, grabbed on contact for an 8s 1.4x speed boost, rendered on the field. Scoped to SPEED for now (the cleanest effect that maps to ball mode; shield/rapid can follow). smoke54 +2 (grant+consume, off-clears). Full battery green. Single file, no assets.
  v5.1.28 (2026-06-14): ROBOT SIZE cheat (giant/tiny robots). A Konami slider scales the robot radius live (0.5×–1.5×, clamped RR 8–26) — RR is now a live let and the plow geometry SC_* is recomputed proportionally so the arms scale with the body (offsets ×RR/RR0). Every physics/AI/render site reads RR live (wheelbase, capture cone, collisions, race obstacle inflation, name tags, rings). Pairs with BALL SIZE to totally change the feel. Range kept conservative because a giant robot inflates the race obstacle math (the cheat warns big bots may not fit the course); the scoring gap still fits. smoke54 +3 (grow/shrink/restore RR + plow). Full battery green. Single file, no assets.
  v5.1.27 (2026-06-14): BALL SIZE cheat (giant/tiny balls). A Konami slider scales the ball radius live (0.5×–2.0×, clamped to BR 4–18 so giant balls still fit the gap and the plow). BR is now a live let (no load-time const baked it in — only RR feeds the plow geometry, so robots are untouched); every physics + render site reads BR live, so balls resize everywhere consistently. The cheat-menu slider click/drag now honors a fractional step (was int-only for EXTRA BALLS). smoke54 +3 (grow/shrink/restore, clamped). Full battery green. Single file, no assets.
  v5.1.26 (2026-06-14): ICE SKATING + DRIFT cheats (movement momentum). Adds a momentum layer (robots normally move by instant integration): ICE SKATING = low uniform friction so you glide and brakes barely work; DRIFT = grippy along the heading but slippery sideways, so turning the chassis slides the body wide (best on tank/arcade/steer). Both are HUMAN-ONLY (CPU brains assume instant control, so they stay instant) and mutually exclusive; toggling clears any stored velocity. Applied at all six movement sites (SP play/tank/obstacle + 2P ball/tank/race). obsCheck now damps velocity into obstacles so ice bots do not stick/jitter; wall bounce comes for free via the existing wall handlers. smoke54 +4 (momentum builds/glides, human-only gating, mode select). Full battery green. Single file, no assets.
  v5.1.25 (2026-06-14): THREE NEW CHEATS — MULTIBALL, STICKY PLOW, NO-CLIP. (1) MULTIBALL: every goal in 2P ball/shooter spawns 2 fresh balls near center, hard-capped at B2_BALL_CAP (72, shared with EXTRA BALLS). (2) STICKY PLOW: your human bot(s) get the CHAMPION sticky plow in 2P normal ball (carry up to 5); BOUNCY still wins precedence (it disables sticky). (3) NO-CLIP: robots phase through each other (all 2P modes) and through obstacles/hazards (tank + race) — balls and outer walls still collide. New cheat toggles in the Konami menu (now 8). smoke54 +5 (multiball spawn+cap, sticky carriers on/off, no-clip separation on/off). Full battery green. Single file, no assets.
  v5.1.24 (2026-06-14): MACHINE-GUN SPECIAL-AMMO BARRAGE. With MACHINE GUN on, a banked EXPLOSIVE/PIERCING stack no longer vanishes in ~0.15s (one round per 0.05s shot) — instead the first shot CONVERTS the whole stack into a timed full-auto barrage of that special round: MG_BURST_PER (1.0s) of fire per banked round, so a 3-stack = ~3s of nonstop explosive/piercing mayhem at MG cadence (~60 rounds). During the barrage every MG shot carries the flag without consuming ammo; the timer decays and resets on respawn. HUD shows the barrage countdown (e.g. '💥 3.0s') instead of the round count while it runs. smoke55 updated for the barrage model (16 asserts). Full battery green. Single file, no assets.
  v5.1.23 (2026-06-14): TANK POWER-UPS — EXPLOSIVE / PIERCING / AUTO-AIM (cheat-build batch 1). Three new tank-fight pickups (spawn under the existing POWER-UPS toggle): (1) EXPLOSIVE 💥 — single-use, STACKABLE (+3 per pickup); each fired shot consumes one and detonates an area blast on impact (wall/obstacle/tank) that damages the enemy within ~62px (owner-immune) with a fading ring. (2) PIERCING ↯ — single-use, STACKABLE (+3); the shot punches THROUGH obstacles and through the enemy (single hit, guarded against multi-frame double-hit), still dies at the arena bound. (3) AUTO-AIM 🎯 — timed 8s; each shot's launch angle snaps to the foe's CURRENT position. Ammo persists across respawns; the aim timer resets (like rapid/speed/shield). Precedence when a shot is both explosive AND piercing: explosive wins on walls (detonate+stop), piercing wins on tanks (pass through, no blast). HUD shows ammo/timer pills. Also fixes a latent gap: sfx('explosion') was never defined (the RAMMING tackle was silently silent) — now a real boom, shared by tackle + blasts. New suite smoke55 (15 asserts). Full battery green. Single file, no assets.
  v5.1.22 (2026-06-14): SHOOTER SHOVE EDGE + REAR-STEER CONTROL FIX. (1) DIFFICULTY (shooter): the main CPU bot now out-muscles alliance bots in the shoving match (tier-scaled mass B2_SHOVE [1.3,1.6,2.5,6]) so it isn't bullied off its scoring run — CHAMPION barely budges and plows through, ROOKIE is near-even. Alliance bots can still STRIP carried balls and BLOCK shots; they just can't body-bully the main bot. This (not intake-denial, which costs the CPU scoring time) is the lever that lets a strong CPU actually score. Gated to SHOOTER for now per the playtest plan; classic/normal unchanged pending a test. (2) Rear-steer (Forklift) steering input negated so left/right is intuitive (press right → curve right) — it read as inverted before; the rear wheels still toe opposite for the rear-pivot feel. smoke45 +2 (shove resists by tier). Full battery green. Single file, no assets.
  v5.1.21 (2026-06-14): TANK-FIGHT CPU HONORS ITS DRIVE TYPE. The tank-fight CPU no longer slides like swerve regardless of drive. Swerve/holo still strafe freely (the common case); tank/arcade/steer now drive like a tank — they steer the BODY toward where they're travelling to relocate and navigate around cover, and lock onto the foe only when settled in a clear firing pose (then hold the range band and shoot). This is the fix deferred in v5.1.20, now working: it paths around obstacle maps and wins (every drive type beats an idle foe in-harness; tank/arcade close from full court and win). The obstacle-RACE CPU is left holonomic for now (free-strafe is the common pick there). Full battery green (smoke38's arcade duel exercises the non-strafe path). Single file, no assets.
  v5.1.20 (2026-06-14): CHAMPION TANK DODGE BUFF. The tank bullet-dodge is stronger at the top end (scaled by sharpness): detection range 408->495px, lateral catch ~101->124px, sidestep strength ~4x->5.3x, so a sharp CHAMPION evades far more incoming fire (lower tiers improve modestly too). NOTE / KNOWN: in tank-fight and obstacle-race the CPU still moves holonomically (free strafe) regardless of its drive type — the human respects its drive (tank/arcade/steer don't strafe) but the CPU does not. A fix was attempted and reverted: the tank/race CPU navigates AROUND obstacles by strafing, so locking it to heading-only motion makes it drive straight into cover and stall (it won't turn off-target to path around). Proper support needs obstacle-aware steering in those brains — deferred. Full battery green. Single file, no assets.

  v5.1.61 (2026-06-15): TANK 3v3 grid polish — inline rename, per-player sensitivity, spacing, no stray compass. From playtest: (1) renaming a player is now INLINE (click the name, type, ENTER) instead of a browser prompt() — prompt() stays only as a touch/mobile fallback. (2) Each assigned PLAYER seat has its own SENSITIVITY slider (per-seat seat.sens → m2.sens at match start). (3) Re-laid each cell into 3 zones — preview (left, smaller) · info: name / device / tier / sens (middle, shifted well clear of the bot) · drive picker (right) — so the PLAYER/CPU labels, ✎ rename, and ROOKIE/VETERAN/WINNER/CHAMPION no longer crowd the rendered drive. (4) The field-centric compass + bot-centric strafe arrows no longer render inside the small drive previews (they were a stray N/S/E/W rose cut off at the screen edge); suppressed via a _drivePreview flag in p2cDrawDrivePreview. smoke56 +2 (sens slider → seat.sens → m2.sens) → 98. Full battery green. Single file, no assets.
  v5.1.60 (2026-06-15): TANK 3v3 grid — + PLAYER button, player names + rename, correct device labels. Reworked the seat claim per playtest: empty cells now offer + PLAYER and + CPU (dropped "+ TOUCH" — a touch player is still a human, the word read oddly). "+ PLAYER" makes a seat named "PLAYER N" awaiting a device; the device you then press (keyboard / gamepad / on-screen touch) is what its tag shows — so claiming with the keyboard reads "⌨ KEYBOARD", not "TOUCH". Each player name is editable (click the name to rename) and carries into the in-match HUD/results; CPUs read "CPU" + side/slot so all six stay distinct. Unassigned players get an amber border + a "👆 USE TOUCH" option and block START until every player has a controller. Wiring: seats carry {name, dev (null until assigned)}; tankGridAddPlayer/SetTouch/SeatReady/Unassigned; canStart needs ready seats + no unassigned. smoke56 +5 (+PLAYER, unassigned blocks start, keyboard→KEYBOARD label, rename→HUD) → 96. Grid is eyeball-only. Full battery green. Single file, no assets.
